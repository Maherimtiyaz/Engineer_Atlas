 class of hard-to-reproduce bugs.","mins":900,"pre":["sql","concur"],"ideas":["A transaction groups writes so they all commit or none do. The write-ahead log records changes before they hit data files, so a crash can be replayed or rolled back.","Isolation levels trade safety for concurrency. Read Committed can show different data to two reads in one transaction, Repeatable Read gives a stable snapshot, and Serializable makes the result match some one-at-a-time order.","PostgreSQL uses MVCC: each update writes a new row version, and each transaction sees the versions that were committed when its snapshot was taken. Readers do not block writers.","A lost update happens when two requests read a value, change it in code and write it back. Fix it with an atomic UPDATE ... SET x = x + 1, SELECT ... FOR UPDATE, or Serializable with retries."],"callout":["Pitfall","Serializable and Repeatable Read in PostgreSQL abort conflicting transactions instead of waiting. Your code must catch serialization failures and retry the whole transaction."],"lectures":[{"t":"F2023 #15 - Concurrency Control Theory","u":"https://www.youtube.com/watch?v=NJyisAkDJYI","by":"CMU Database Group (Andy Pavlo)"},{"t":"F2023 #18 - Multi-Version Concurrency Control","u":"https://www.youtube.com/watch?v=wO0PfAFiK3U","by":"CMU Database Group (Andy Pavlo)"},{"t":"Transactions: myths, surprises and opportunities","u":"https://www.youtube.com/watch?v=5ZjhNTM8XU8","by":"Martin Kleppmann (Strange Loop)"}],"papers":[{"t":"A Critique of ANSI SQL Isolation Levels (1995)","u":"https://arxiv.org/abs/cs/0701157","by":"Berenson, Bernstein, Gray, Melton, O'Neil, O'Neil"},{"t":"PostgreSQL docs: Transaction Isolation","u":"https://www.postgresql.org/docs/current/transaction-iso.html","by":"PostgreSQL Global Development Group"},{"t":"PostgreSQL docs: Explicit Locking","u":"https://www.postgresql.org/docs/current/explicit-locking.html","by":"PostgreSQL Global Development Group"},{"t":"Serializable Snapshot Isolation in PostgreSQL (VLDB 2012)","u":"https://drkp.net/papers/ssi-vldb12.pdf","by":"Dan R. K. Ports, Kevin Grittner"}],"reads":[{"t":"Consistency Models (clickable map)","u":"https://jepsen.io/consistency","by":"Jepsen (Kyle Kingsbury)"},{"t":"How Postgres Makes Transactions Atomic","u":"https://brandur.org/postgres-atomicity","by":"Brandur Leach"},{"t":"Implementing Stripe-like Idempotency Keys in Postgres","u":"https://brandur.org/idempotency-keys","by":"Brandur Leach"}],"projects":[{"n":"Reproduce the anomalies","l":"Intermediate","d":"Write a Python script with two concurrent connections that triggers a lost update and write skew in your schema. Show which isolation level or lock prevents each one, as Hermitage does."},{"n":"Safe money transfer endpoint","l":"Advanced","d":"Add a credits balance and a transfer endpoint to your API. Hammer it with 100 concurrent transfers and assert the total never changes, then compare throughput of FOR UPDATE versus Serializable with retries."}],"repos":[{"r":"ept/hermitage","d":"Tests showing which anomalies each database's isolation levels allow"},{"r":"jepsen-io/jepsen","d":"Framework for testing databases under faults and concurrency"}]},{"id":"orm","title":"ORMs & schema migrations","short":"ORMs & migrations","level":"Intermediate","why":"ORMs like SQLAlchemy map rows to Python objects and migration tools like Alembic version your schema, and using them carelessly causes slow N+1 queries and outages during deploys.","mins":600,"pre":["sql","indexes","lang"],"ideas":["An ORM maps tables to classes and rows to objects. It saves boilerplate, but every attribute access can hide a query, so you still need to know the SQL it sends.","The N+1 problem appears when you load N parent rows and then lazily load each child list, sending N extra queries. Eager loading with selectinload or joinedload fetches them in one or two queries.","A migration is a versioned script that moves the schema from one state to the next. Alembic stores the current revision in the database and can autogenerate a draft by diffing your models.","Zero-downtime changes use expand and contract: add the new column or table, deploy code that writes both, backfill, switch reads, then drop the old part in a later release."],"callout":["Pitfall","Some ALTER TABLE operations take a lock that blocks all reads and writes until they finish. Set lock_timeout in migrations and create indexes CONCURRENTLY on large tables."],"lectures":[{"t":"Introduction to SQLAlchemy 2020 (Tutorial)","u":"https://www.youtube.com/watch?v=sO7FFPNvX2s","by":"Mike Bayer"},{"t":"Alembic Introduction: Migrations and Auto-Generating Revisions","u":"https://www.youtube.com/watch?v=i9RX03zFDHU","by":"BugBytes"},{"t":"Zero-downtime migrations (Postgres.FM 048)","u":"https://www.youtube.com/watch?v=mr_J5v398Qo","by":"PostgresTV"}],"papers":[{"t":"SQLAlchemy Unified Tutorial","u":"https://docs.sqlalchemy.org/en/20/tutorial/index.html","by":"SQLAlchemy"},{"t":"SQLAlchemy: Relationship Loading Techniques","u":"https://docs.sqlalchemy.org/en/20/orm/queryguide/relationships.html","by":"SQLAlchemy"},{"t":"Alembic Tutorial","u":"https://alembic.sqlalchemy.org/en/latest/tutorial.html","by":"Alembic"},{"t":"Evolutionary Database Design","u":"https://martinfowler.com/articles/evodb.html","by":"Pramod Sadalage, Martin Fowler"}],"reads":[{"t":"Online migrations at scale","u":"https://stripe.com/blog/online-migrations","by":"Jacqueline Xu (Stripe)"},{"t":"Zero-downtime Postgres migrations: the hard parts","u":"https://gocardless.com/blog/zero-downtime-postgres-migrations-the-hard-parts/","by":"GoCardless Engineering"},{"t":"The Vietnam of Computer Science","u":"https://www.odbms.org/wp-content/uploads/2013/11/031.01-Neward-The-Vietnam-of-Computer-Science-June-2006.pdf","by":"Ted Neward"}],"projects":[{"n":"Kill the N+1","l":"Intermediate","d":"Port your API's data layer to SQLAlchemy 2.0 and log every SQL statement per request. Find an endpoint with N+1 queries, fix it with eager loading and report the query count and latency before and after."},{"n":"Zero-downtime column rename","l":"Advanced","d":"Rename a column in your service using expand and contract across three Alembic migrations while a load script keeps hitting the API. Show zero failed requests and lint the migrations with squawk."}],"repos":[{"r":"sqlalchemy/alembic","d":"Database migration tool for SQLAlchemy"},{"r":"sbdchd/squawk","d":"Linter that flags unsafe Postgres migrations"},{"r":"fastapi/full-stack-fastapi-template","d":"FastAPI + SQLModel + Alembic + Postgres reference project"}]}]},{"id":"sec","title":"Security","level":"Intermediate","intro":"A backend holds user data and credentials, so mistakes here leak them. This chapter covers proving who a user is, deciding what they may do, the common web attacks, and protecting secrets and dependencies.","phase":1,"optional":false,"topics":[{"id":"authn","title":"Authentication: sessions, JWT & OAuth","short":"Authentication","level":"Intermediate","why":"Authentication proves who is making a request, and getting passwords, sessions or tokens wrong hands accounts to attackers.","mins":900,"pre":["http","framework"],"ideas":["Store passwords with a slow, salted hash such as Argon2id or bcrypt. A salt makes each hash unique and the slowness makes guessing billions of passwords expensive.","A session is a random ID in an HttpOnly, Secure cookie that points to server-side state. You can revoke it instantly by deleting the row.","A JWT is a signed JSON payload the server can verify without a lookup. It cannot be revoked before it expires, so keep access tokens short-lived and always pin the expected algorithm.","OAuth 2.0 lets a user grant an app limited access to an API without sharing a password. OpenID Connect adds an ID token on top so the app also learns who the user is. Use the authorization code flow with PKCE."],"callout":["Pitfall","A JWT payload is only base64-encoded, not encrypted. Anyone holding the token can read every claim, so never put secrets in it."],"lectures":[{"t":"OAuth 2.0 and OpenID Connect (in plain English)","u":"https://www.youtube.com/watch?v=996OiexHze0","by":"Nate Barbettini (OktaDev)"},{"t":"How NOT to Store Passwords!","u":"https://www.youtube.com/watch?v=8ZtInClXe1Q","by":"Computerphile"},{"t":"How Passkeys Work","u":"https://www.youtube.com/watch?v=xYfiOnufBSk","by":"Computerphile"}],"papers":[{"t":"RFC 6749: The OAuth 2.0 Authorization Framework","u":"https://datatracker.ietf.org/doc/html/rfc6749","by":"IETF"},{"t":"RFC 7519: JSON Web Token (JWT)","u":"https://datatracker.ietf.org/doc/html/rfc7519","by":"IETF"},{"t":"RFC 9700: Best Current Practice for OAuth 2.0 Security","u":"https://datatracker.ietf.org/doc/html/rfc9700","by":"IETF"},{"t":"OWASP Password Storage Cheat Sheet","u":"https://cheatsheetseries.owasp.org/cheatsheets/Password_Storage_Cheat_Sheet.html","by":"OWASP"}],"reads":[{"t":"The Copenhagen Book: a guide to implementing auth","u":"https://copenhagen.pilcrowonpaper.com/","by":"Pilcrow"},{"t":"An Illustrated Guide to OAuth and OpenID Connect","u":"https://developer.okta.com/blog/2019/10/21/illustrated-guide-to-oauth-and-oidc","by":"David Neal (Okta)"},{"t":"JWT attacks","u":"https://portswigger.net/web-security/jwt","by":"PortSwigger Web Security Academy"}],"projects":[{"n":"Login for the course API","l":"Intermediate","d":"Add signup and login to your FastAPI service with Argon2id hashing, server-side sessions in Redis, logout and rate-limited login. Measure hash time and tune parameters to about 100 ms."},{"n":"Sign in with GitHub","l":"Intermediate","d":"Add OAuth login with the authorization code flow and PKCE using Authlib. Log each redirect and token exchange, then try replaying a used code and tampering with the state parameter to see them rejected."}],"repos":[{"r":"lepture/authlib","d":"OAuth and OpenID Connect client and server library for Python"},{"r":"jpadilla/pyjwt","d":"JWT encoding and verification for Python"},{"r":"fastapi-users/fastapi-users","d":"Ready-made user management for FastAPI to read and compare"}]},{"id":"authz","title":"Authorization & multi-tenancy","short":"Authz & tenancy","level":"Intermediate","why":"Authorization decides what an authenticated user may do, and in a multi-tenant app a single missing check lets one customer read another's data.","mins":720,"pre":["authn","sql"],"ideas":["Role-based access control gives users roles and roles permissions. Attribute and relationship-based models decide using facts about the user, the resource and how they connect, such as 'member of the project that owns this task'.","Check permissions on the server for every request and every object. Hiding a button in the UI does nothing, and checking only that a user is logged in leads to IDOR bugs where changing an ID in the URL exposes other records.","Multi-tenant apps either give each tenant its own database or schema, or share tables with a tenant_id column. Shared tables are cheaper to run but every query must filter by tenant.","PostgreSQL row-level security attaches a policy to a table so the database itself filters rows by the current tenant. It acts as a safety net when application code forgets a WHERE clause."],"callout":["Intuition","Authentication answers 'who are you?' and authorization answers 'may you do this to that?'. Most real breaches are the second question answered wrong."],"lectures":[{"t":"Zanzibar: Google's Consistent, Global Authorization System (USENIX ATC '19)","u":"https://www.youtube.com/watch?v=mstZT431AeQ","by":"USENIX"},{"t":"Everything you need to know about Postgres Row Level Security","u":"https://www.youtube.com/watch?v=vZT1Qx2xUCo","by":"POSETTE 2024 (Microsoft Developer)"},{"t":"Broken Access Control | Complete Guide","u":"https://www.youtube.com/watch?v=_jz5qFWhLcg","by":"Rana Khalil"}],"papers":[{"t":"Zanzibar: Google's Consistent, Global Authorization System","u":"https://research.google/pubs/zanzibar-googles-consistent-global-authorization-system/","by":"Pang et al. (Google)"},{"t":"OWASP Authorization Cheat Sheet","u":"https://cheatsheetseries.owasp.org/cheatsheets/Authorization_Cheat_Sheet.html","by":"OWASP"},{"t":"PostgreSQL docs: Row Security Policies","u":"https://www.postgresql.org/docs/current/ddl-rowsecurity.html","by":"PostgreSQL Global Development Group"},{"t":"OWASP Multi-Tenant Security Cheat Sheet","u":"https://cheatsheetseries.owasp.org/cheatsheets/Multi_Tenant_Security_Cheat_Sheet.html","by":"OWASP"}],"reads":[{"t":"Authorization Academy","u":"https://www.osohq.com/academy","by":"Oso"},{"t":"Multi-tenant data isolation with PostgreSQL Row Level Security","u":"https://aws.amazon.com/blogs/database/multi-tenant-data-isolation-with-postgresql-row-level-security/","by":"AWS Database Blog"},{"t":"The Google Zanzibar paper, annotated","u":"https://zanzibar.tech/","by":"AuthZed"}],"projects":[{"n":"Organizations and roles","l":"Intermediate","d":"Add organizations, memberships and owner/editor/viewer roles to your API. Write a test suite that tries every endpoint as every role and as a user from another org, and fail the build on any unexpected 200."},{"n":"RLS safety net","l":"Advanced","d":"Enable row-level security on your tenant tables and set the tenant per request with SET LOCAL. Remove a WHERE tenant_id filter on purpose and show that RLS still blocks the leak."}],"repos":[{"r":"authzed/spicedb","d":"Open source Zanzibar-inspired permissions database"},{"r":"openfga/openfga","d":"Relationship-based authorization engine (CNCF)"},{"r":"casbin/pycasbin","d":"Python library for ACL, RBAC and ABAC policies"}]},{"id":"owasp","title":"Web security & the OWASP Top 10","short":"OWASP Top 10","level":"Intermediate","why":"The OWASP Top 10 lists the web flaws attackers exploit most often, and a backend engineer needs to recognize and prevent each one in their own code.","mins":900,"pre":["http","authn","authz"],"ideas":["Injection happens when user input is pasted into a query or command. Parameterized queries send data separately from code, so input can never change the query's structure.","Cross-site scripting runs attacker JavaScript in a victim's browser. Escape output by default in templates and add a Content-Security-Policy that blocks inline scripts.","Cross-site request forgery makes a logged-in browser send a request it did not mean to. SameSite cookies plus CSRF tokens or checking the Origin header stop it.","Server-side request forgery tricks your server into fetching an internal URL, such as a cloud metadata endpoint. Validate destinations against an allow-list and block private IP ranges after DNS resolution."],"callout":["Pitfall","Broken access control is number one on the list. Scanners rarely find it, because only your code knows who should see what."],"lectures":[{"t":"Hacking Websites with SQL Injection","u":"https://www.youtube.com/watch?v=_jKylhJtPmI","by":"Computerphile"},{"t":"Cross-Site Scripting (XSS) Explained","u":"https://www.youtube.com/watch?v=EoaDgUgS6QA","by":"PwnFunction"},{"t":"Server-Side Request Forgery (SSRF) | Complete Guide","u":"https://www.youtube.com/watch?v=ih5R_c16bKc","by":"Rana Khalil"}],"papers":[{"t":"OWASP Top 10:2025","u":"https://top10.owasp.org/2025/","by":"OWASP"},{"t":"OWASP Cheat Sheet Series","u":"https://cheatsheetseries.owasp.org/","by":"OWASP"},{"t":"OWASP Application Security Verification Standard (ASVS)","u":"https://owasp.org/www-project-application-security-verification-standard/","by":"OWASP"},{"t":"MDN: Content Security Policy (CSP)","u":"https://developer.mozilla.org/en-US/docs/Web/HTTP/Guides/CSP","by":"MDN Web Docs"}],"reads":[{"t":"Web Security Academy (free labs)","u":"https://portswigger.net/web-security","by":"PortSwigger"},{"t":"Insecure direct object references (IDOR)","u":"https://portswigger.net/web-security/access-control/idor","by":"PortSwigger"},{"t":"CSRF is (really) dead","u":"https://scotthelme.co.uk/csrf-is-really-dead/","by":"Scott Helme"}],"projects":[{"n":"Attack your own API","l":"Intermediate","d":"Run OWASP ZAP and bandit against your service and work through 10 PortSwigger labs that match your stack. Fix each real finding and add a regression test for it."},{"n":"Hardening headers and SSRF guard","l":"Intermediate","d":"Add security headers (CSP, HSTS, SameSite cookies) and a URL-fetch feature with an SSRF guard that resolves DNS and blocks private ranges. Verify with curl that 169.254.169.254 and localhost are refused."}],"repos":[{"r":"juice-shop/juice-shop","d":"Deliberately insecure web app covering the OWASP Top 10"},{"r":"OWASP/CheatSheetSeries","d":"Source of the OWASP cheat sheets"},{"r":"PyCQA/bandit","d":"Static analyzer that finds common security issues in Python"}]},{"id":"secrets","title":"Secrets, dependencies & supply chain","short":"Secrets & supply","level":"Intermediate","why":"API keys and database passwords leak through code and logs, and the packages you install run with your app's full access, so both need deliberate handling.","mins":480,"pre":["owasp"],"ideas":["Keep secrets out of source code. Inject them at runtime from environment variables or a secrets manager, give each one the least access it needs, and rotate it on a schedule and after any leak.","A leaked secret stays in git history after you delete the file. Revoke and rotate it first, then clean history, and run a scanner in pre-commit and CI to catch the next one.","Every dependency, and every dependency of a dependency, is code you trust. Pin exact versions with hashes in a lock file and audit them against vulnerability databases such as OSV.","Supply chain attacks target the build path: typosquatted or confused package names, hijacked maintainer accounts, or tampered builds. Signed artifacts and provenance such as SLSA and Sigstore let you check what you install."],"callout":["Pitfall","Dependency confusion: if an internal package name also exists on public PyPI, pip may install the public one with a higher version. Use a single index or reserve your internal names."],"lectures":[{"t":"SLSA, SigStore, SBOM & Software Supply Chain Security. What does it all mean?","u":"https://www.youtube.com/watch?v=hF95PiItWtM","by":"Abdel Sghiouar (NDC Conferences)"},{"t":"The Internet Was Weeks Away From Disaster And No One Knew","u":"https://www.youtube.com/watch?v=aoag03mSuXQ","by":"Veritasium"},{"t":"Secret Management with HashiCorp's Vault","u":"https://www.youtube.com/watch?v=C2iUSUtr93E","by":"Daniel Bornkessel (GOTO 2018)"}],"papers":[{"t":"OWASP Secrets Management Cheat Sheet","u":"https://cheatsheetseries.owasp.org/cheatsheets/Secrets_Management_Cheat_Sheet.html","by":"OWASP"},{"t":"SLSA: Supply-chain Levels for Software Artifacts","u":"https://slsa.dev/","by":"OpenSSF"},{"t":"Reflections on Trusting Trust (1984)","u":"https://www.cs.cmu.edu/~rdriley/487/papers/Thompson_1984_ReflectionsonTrustingTrust.pdf","by":"Ken Thompson"},{"t":"pip: Secure installs (hash-checking mode)","u":"https://pip.pypa.io/en/stable/topics/secure-installs/","by":"PyPA"}],"reads":[{"t":"Our Software Dependency Problem","u":"https://research.swtch.com/deps","by":"Russ Cox"},{"t":"Timeline of the xz open source attack","u":"https://research.swtch.com/xz-timeline","by":"Russ Cox"},{"t":"Dependency Confusion: How I Hacked Into Apple, Microsoft and Dozens of Other Companies","u":"https://medium.com/@alex.birsan/dependency-confusion-4a5d60fec610","by":"Alex Birsan"}],"projects":[{"n":"Secret hygiene for the course API","l":"Beginner","d":"Move every secret in your service into environment variables loaded by pydantic-settings, add gitleaks as a pre-commit hook and in CI, then commit a fake key on a branch to confirm it is blocked."},{"n":"Locked and audited dependencies","l":"Intermediate","d":"Generate a hash-pinned lock file, run pip-audit in CI and fail the build on known CVEs. Count your direct versus transitive dependencies and note which ones have a single maintainer."}],"repos":[{"r":"gitleaks/gitleaks","d":"Scans git repos and commits for leaked secrets"},{"r":"pypa/pip-audit","d":"Audits Python environments for known vulnerabilities"},{"r":"sigstore/cosign","d":"Signs and verifies container images and artifacts"}]},{"id":"sec_threat","title":"Threat modeling & secure design","short":"Threat modeling","level":"Intermediate","why":"Threat modeling is a structured way to find what can go wrong in a design before you build it, when fixes are cheap.","mins":720,"pre":["owasp","authn","authz","apis"],"ideas":["Every threat model answers four questions: what are we working on, what can go wrong, what are we going to do about it, and did we do a good job. If you only have 30 minutes, answer these on a whiteboard.","Start with a data flow diagram: processes, data stores, external entities and the flows between them. Draw a trust boundary wherever data crosses from one owner or privilege level to another, because most attacks happen at those lines.","STRIDE gives you a checklist per element: Spoofing (authentication), Tampering (integrity), Repudiation (audit logs), Information disclosure (confidentiality), Denial of service (availability) and Elevation of privilege (authorization). Walk each flow that crosses a boundary and ask which letters apply.","For each threat pick one response: mitigate it with a control, eliminate the feature, transfer the risk, or accept it in writing. Turn mitigations into tickets with owners, and re-run the model when the design changes, not once a year."],"callout":["Pitfall","A threat model that lives in a slide deck nobody updates is worse than none, because it gives false confidence. Keep it short, in the repo next to the design doc, and revisit it in design reviews."],"lectures":[{"t":"Threat Modeling Lessons from Star Wars (and Elsewhere)","u":"https://www.youtube.com/watch?v=KLpgaoD8ySM","by":"Adam Shostack (ICSI at Berkeley)"},{"t":"STRIDE Threat Modeling for Beginners - In 20 Minutes","u":"https://www.youtube.com/watch?v=rEnJYNkUde0","by":"Netsec Explained"},{"t":"Welcome to the World's Shortest Threat Modeling Course","u":"https://www.youtube.com/watch?v=2pvprvsr1lo","by":"Adam Shostack"}],"papers":[{"t":"Threat Modeling Manifesto","u":"https://www.threatmodelingmanifesto.org/","by":"Threat Modeling Manifesto working group"},{"t":"Threat Modeling Cheat Sheet","u":"https://cheatsheetseries.owasp.org/cheatsheets/Threat_Modeling_Cheat_Sheet.html","by":"OWASP"},{"t":"Microsoft Threat Modeling Tool: threat categories (STRIDE)","u":"https://learn.microsoft.com/en-us/azure/security/develop/threat-modeling-tool-threats","by":"Microsoft"},{"t":"Building Secure and Reliable Systems (free book)","u":"https://google.github.io/building-secure-and-reliable-systems/raw/toc.html","by":"Google"}],"reads":[{"t":"Threat Modeling Guide for Software Teams","u":"https://martinfowler.com/articles/agile-threat-modelling.html","by":"Jim Gumbley (martinfowler.com)"},{"t":"The Ultimate Beginner's Guide to Threat Modeling","u":"https://shostack.org/resources/threat-modeling","by":"Shostack + Associates"},{"t":"Threat Modeling (community page)","u":"https://owasp.org/www-community/Threat_Modeling","by":"OWASP"}],"projects":[{"n":"STRIDE your own API","l":"Intermediate","d":"Draw a data flow diagram of one service you built, with trust boundaries, and list at least 15 STRIDE threats in a THREATS.md in the repo. Fix the top three and record which ones you accepted and why."},{"n":"Threat model as code","l":"Advanced","d":"Describe a small multi-tenant SaaS (web app, API, queue, database, object storage) in OWASP pytm and generate the diagram and threat report. Then add a tenant-isolation bug on purpose and check whether the model surfaces it."}],"repos":[{"r":"OWASP/pytm","d":"Pythonic threat modeling: describe a system in code, get diagrams and threats"},{"r":"OWASP/threat-dragon","d":"Open source diagramming tool for threat models"},{"r":"hysnsec/awesome-threat-modelling","d":"Curated list of threat modeling books, tools and talks"}]}]},{"id":"shipearly","title":"Ship from week one","level":"Beginner","intro":"Deploy early and often: containers, a CI pipeline and structured logs for everything you build.","phase":1,"optional":false,"topics":[{"id":"docker","title":"Containers & Docker","short":"Docker","level":"Beginner","why":"Containers package your app with its exact dependencies so it runs the same on your laptop, in CI and in production.","mins":900,"pre":["os","lang"],"ideas":["A container is a normal Linux process with a restricted view: namespaces give it its own filesystem, process list and network, and cgroups cap its CPU and memory. It is not a virtual machine and shares the host kernel.","An image is a stack of read-only layers, one per Dockerfile instruction. Docker caches layers, so copy requirements.txt and install dependencies before copying your source, and code edits will not reinstall everything.","Multi-stage builds compile or install in a big builder image, then copy only the results into a slim runtime image. Smaller images pull faster and carry fewer vulnerable packages.","Containers are disposable. Keep data in volumes or external databases, read config from environment variables, log to stdout, and handle SIGTERM so the process shuts down cleanly."],"callout":["Pitfall","Running your server as PID 1 with a shell-form CMD means it may never receive SIGTERM, so every deploy waits for a hard kill. Use exec-form CMD [\"uvicorn\", ...] and run as a non-root user."],"lectures":[{"t":"Containers From Scratch","u":"https://www.youtube.com/watch?v=8fi7uSYlOdc","by":"Liz Rice, GOTO 2018"},{"t":"Docker Crash Course for Absolute Beginners","u":"https://www.youtube.com/watch?v=pg19Z8LL06w","by":"TechWorld with Nana"}],"papers":[{"t":"Docker docs: Building best practices","u":"https://docs.docker.com/build/building/best-practices/","by":"Docker"},{"t":"Docker docs: Multi-stage builds","u":"https://docs.docker.com/build/building/multi-stage/","by":"Docker"},{"t":"FastAPI in Containers - Docker","u":"https://fastapi.tiangolo.com/deployment/docker/","by":"Sebasti\u00e1n Ram\u00edrez"}],"reads":[{"t":"What even is a container: namespaces and cgroups","u":"https://jvns.ca/blog/2016/10/10/what-even-is-a-container/","by":"Julia Evans"},{"t":"Learning Containers From The Bottom Up","u":"https://iximiuz.com/en/posts/container-learning-path/","by":"Ivan Velichko"},{"t":"Production-ready Docker packaging for Python developers","u":"https://pythonspeed.com/docker/","by":"Itamar Turner-Trauring"}],"projects":[{"n":"Containerize the API","l":"Beginner","d":"Write a multi-stage Dockerfile and a Compose file for your FastAPI service, Postgres and Redis. Compare image size and rebuild time before and after ordering layers well."},{"n":"Container from scratch","l":"Advanced","d":"Follow Liz Rice's talk to build a tiny container runtime using unshare, chroot and cgroups. Observe what the process can and cannot see compared to the host."}],"repos":[{"r":"docker/awesome-compose","d":"Sample Compose setups for common stacks"},{"r":"lizrice/containers-from-scratch","d":"Minimal container runtime in Go from the talk"},{"r":"fastapi/full-stack-fastapi-template","d":"Production-style FastAPI + Postgres + Docker template"}]},{"id":"cicd","title":"CI/CD & deployment strategies","short":"CI/CD","level":"Intermediate","why":"CI/CD runs your tests on every change and ships small releases automatically, which makes deploys boring and failures cheap to undo.","mins":720,"pre":["testing","docker"],"ideas":["Continuous integration means everyone merges small changes to main often, and each merge triggers an automated build and test run. Problems show up within minutes while the change is still fresh.","Continuous delivery keeps main always deployable; continuous deployment goes further and ships every green build. Small, frequent releases are easier to debug than big monthly ones.","Blue-green runs the new version beside the old and flips traffic at once, so rollback is flipping back. A canary sends a small share of traffic to the new version first and compares error rates before going wider.","Feature flags separate deploying code from releasing a feature. Schema changes need expand-and-contract: add the new column, deploy code that writes both, backfill, then remove the old column in a later release."],"callout":["Intuition","Measure your rollback time. If undoing a bad deploy takes one click and two minutes, you can ship many times a day without fear."],"lectures":[{"t":"CI/CD In 5 Minutes | Is It Worth The Hassle","u":"https://www.youtube.com/watch?v=42UP1fxi2SY","by":"ByteByteGo"},{"t":"Top 5 Most-Used Deployment Strategies","u":"https://www.youtube.com/watch?v=AWVTKBUnoIg","by":"ByteByteGo"},{"t":"Continuous Delivery Explained PERFECTLY In 15 Minutes","u":"https://www.youtube.com/watch?v=tQMrrNo16jo","by":"Dave Farley, Modern Software Engineering"}],"papers":[{"t":"Continuous Integration","u":"https://martinfowler.com/articles/continuousIntegration.html","by":"Martin Fowler"},{"t":"GitHub Actions: Building and testing Python","u":"https://docs.github.com/en/actions/use-cases-and-examples/building-and-testing/building-and-testing-python","by":"GitHub Docs"},{"t":"Google SRE workbook: Canarying Releases","u":"https://sre.google/workbook/canarying-releases/","by":"Google"}],"reads":[{"t":"Automating safe, hands-off deployments","u":"https://aws.amazon.com/builders-library/automating-safe-hands-off-deployments/","by":"Clare Liguori, Amazon Builders' Library"},{"t":"Feature Toggles (aka Feature Flags)","u":"https://martinfowler.com/articles/feature-toggles.html","by":"Pete Hodgson"},{"t":"BlueGreenDeployment","u":"https://martinfowler.com/bliki/BlueGreenDeployment.html","by":"Martin Fowler"}],"projects":[{"n":"Pipeline for the API","l":"Intermediate","d":"Add GitHub Actions that lint, run pytest against a Postgres service container, build the Docker image and push it on main. Track total pipeline time and get it under five minutes."},{"n":"Canary with automatic rollback","l":"Advanced","d":"Deploy two versions behind nginx weights (or Argo Rollouts on kind), send 10% to the new one, and roll back automatically if its 5xx rate exceeds the old one's."}],"repos":[{"r":"actions/starter-workflows","d":"Official GitHub Actions workflow templates"},{"r":"nektos/act","d":"Run GitHub Actions locally"},{"r":"argoproj/argo-rollouts","d":"Canary and blue-green deployments for Kubernetes"}]},{"id":"observ","title":"Observability: logs, metrics & traces","short":"Observability","level":"Intermediate","why":"Observability is being able to answer new questions about what your system is doing in production, using the telemetry it emits.","mins":900,"pre":["framework"],"ideas":["Metrics are cheap numeric time series (request count, latency histogram) good for dashboards and alerts. Use histograms for latency, because an average hides the slow 1% of requests that users complain about.","Structured logs are key-value events, not free text. Emitting one wide 'canonical' log line per request with user id, route, status, duration and query count makes most questions a simple filter.","A trace follows one request across services. Each unit of work is a span with a start, end and parent, and the trace id travels in headers (W3C traceparent) so spans from different services join up.","OpenTelemetry is the vendor-neutral standard: one SDK emits metrics, logs and traces, and a collector ships them to whatever backend you choose. RED (rate, errors, duration) for services and USE (utilization, saturation, errors) for resources tell you what to measure first."],"callout":["Pitfall","Putting user ids or URLs with ids into metric labels creates millions of time series and can take down your metrics system. High-cardinality fields belong in logs and traces."],"lectures":[{"t":"Observability: it's not just an ops thing","u":"https://www.youtube.com/watch?v=ACHr-qwHS8Y","by":"Charity Majors, NDC Conferences"},{"t":"How Tracing works with OpenTelemetry","u":"https://www.youtube.com/watch?v=LQOeaxfiAt8","by":"That DevOps Guy"},{"t":"LISA '12 - Performance Analysis Methodology","u":"https://www.youtube.com/watch?v=abLan0aXJkw","by":"Brendan Gregg, USENIX"}],"papers":[{"t":"OpenTelemetry: Observability concepts","u":"https://opentelemetry.io/docs/concepts/","by":"OpenTelemetry"},{"t":"Dapper, a Large-Scale Distributed Systems Tracing Infrastructure","u":"https://research.google/pubs/dapper-a-large-scale-distributed-systems-tracing-infrastructure/","by":"Sigelman et al., Google"},{"t":"Google SRE book: Monitoring Distributed Systems","u":"https://sre.google/sre-book/monitoring-distributed-systems/","by":"Rob Ewaschuk, Google"},{"t":"Prometheus: Histograms and summaries","u":"https://prometheus.io/docs/practices/histograms/","by":"Prometheus"}],"reads":[{"t":"Using Canonical Log Lines for Online Visibility","u":"https://brandur.org/canonical-log-lines","by":"Brandur Leach"},{"t":"The USE Method","u":"https://www.brendangregg.com/usemethod.html","by":"Brendan Gregg"},{"t":"Logs vs Structured Events","u":"https://charity.wtf/2019/02/05/logs-vs-structured-events/","by":"Charity Majors"}],"projects":[{"n":"Instrument the API","l":"Intermediate","d":"Add OpenTelemetry auto-instrumentation for FastAPI, SQLAlchemy and Redis, and send traces and metrics to a local Grafana LGTM stack. Find the slowest endpoint and the query that causes it."},{"n":"RED dashboard and canonical logs","l":"Intermediate","d":"Emit one structured JSON log line per request and build a dashboard with rate, error ratio and p50/p95/p99 latency per route. Inject a slow query and confirm you can spot it in under a minute."}],"repos":[{"r":"open-telemetry/opentelemetry-python","d":"OpenTelemetry SDK and instrumentation for Python"},{"r":"grafana/docker-otel-lgtm","d":"One container with an OTel collector, Prometheus, Loki, Tempo and Grafana"},{"r":"open-telemetry/opentelemetry-demo","d":"Multi-service demo app with full telemetry"}]}]},{"id":"design","title":"Software design","level":"Intermediate","intro":"Write code other people can change: design, refactoring and written decisions.","phase":1,"optional":false,"topics":[{"id":"se_design","title":"Software design: patterns, clean architecture & refactoring","short":"Software design","level":"Intermediate","why":"Good design keeps code cheap to change as a project grows, which is most of what a working engineer is paid for.","mins":1200,"pre":["lang","testing"],"ideas":["Complexity is anything that makes code hard to understand or change. Ousterhout's rule is to build deep modules: a small, simple interface that hides a lot of work behind it.","Clean and hexagonal architecture put business rules in the middle and push the database, web framework and outside APIs to the edges. Dependencies point inward, so you can test the core without a database and swap an adapter without touching the rules.","Refactoring is changing the structure of code without changing what it does, in small steps, with tests run after each one. Extract function, rename and move are the moves you will use every day.","Design patterns like Strategy, Adapter and Repository are named solutions to common problems. They help when the problem is really there. Duplication is cheaper than the wrong abstraction, so wait until you see the same shape two or three times."],"callout":["Pitfall","Layers and interfaces added up front for flexibility you might need later make code harder to read today. Add structure when a real change forces it."],"lectures":[{"t":"A Philosophy of Software Design","u":"https://www.youtube.com/watch?v=bmSAYlu0NcY","by":"John Ousterhout, Talks at Google"},{"t":"Workflows of Refactoring","u":"https://www.youtube.com/watch?v=vqEg37e4Mkw","by":"Martin Fowler, OOP 2014"},{"t":"What is DDD","u":"https://www.youtube.com/watch?v=pMuiVlnGqjk","by":"Eric Evans, DDD Europe 2019"}],"papers":[{"t":"Refactoring catalog and code smells","u":"https://refactoring.guru/refactoring","by":"Refactoring.guru"},{"t":"Design patterns catalog","u":"https://refactoring.guru/design-patterns","by":"Refactoring.guru"},{"t":"Catalog of Patterns of Enterprise Application Architecture","u":"https://martinfowler.com/eaaCatalog/","by":"Martin Fowler"},{"t":"Architecture Patterns with Python (free online book)","u":"https://www.cosmicpython.com/book/preface.html","by":"Harry Percival & Bob Gregory"}],"reads":[{"t":"The Wrong Abstraction","u":"https://sandimetz.com/blog/2016/1/20/the-wrong-abstraction","by":"Sandi Metz"},{"t":"Write code that is easy to delete, not easy to extend","u":"https://programmingisterrible.com/post/139222674273/how-to-write-disposable-code-in-large-systems","by":"tef"},{"t":"Hexagonal Architecture","u":"https://alistair.cockburn.us/hexagonal-architecture/","by":"Alistair Cockburn"}],"projects":[{"n":"Refactor a legacy script","l":"Beginner","d":"Take a 300+ line script you wrote earlier, add characterization tests around its output, then refactor in small commits. Compare function count, longest function length and test run time before and after."},{"n":"Ports and adapters service","l":"Intermediate","d":"Build a small order service with the business logic in a pure core and adapters for Postgres and an in-memory fake. Show that the core tests run in under a second with no database."}],"repos":[{"r":"cosmicpython/book","d":"Source of Architecture Patterns with Python, with example code per chapter"},{"r":"faif/python-patterns","d":"Classic design patterns written in idiomatic Python"}]},{"id":"se_docs","title":"Design docs, RFCs & technical writing","short":"Design docs","level":"Intermediate","why":"Writing a design down before building lets others find problems cheaply, and clear docs are how senior engineers scale their influence.","mins":600,"pre":["apis"],"ideas":["A design doc states the context, goals, non-goals, the proposed design and the alternatives you rejected with reasons. Non-goals and alternatives are where reviewers find the real disagreements.","An RFC process like Oxide's gives every proposal a number, a state (discussion, accepted, abandoned) and a public review thread. The value is a searchable record of why decisions were made.","An Architecture Decision Record is a short file per decision: context, decision and consequences. It lives in the repo next to the code, so it stays close to what it describes.","Good technical writing starts from what the reader needs to do. Use short sentences, define terms once, put the conclusion first and split docs by purpose: tutorial, how-to, reference or explanation."],"callout":["Intuition","Writing the doc is part of designing. If you cannot explain the tradeoff in a paragraph, you have not finished deciding."],"lectures":[{"t":"The Craft of Writing Effectively","u":"https://www.youtube.com/watch?v=vtIzMaLkCaM","by":"Larry McEnerney, UChicago Leadership Lab"},{"t":"What nobody tells you about documentation","u":"https://www.youtube.com/watch?v=t4vKPhjcMZg","by":"Daniele Procida, PyCon AU"}],"papers":[{"t":"Design Docs at Google","u":"https://www.industrialempathy.com/posts/design-docs-at-google/","by":"Malte Ubl"},{"t":"RFD 1: Requests for Discussion","u":"https://rfd.shared.oxide.computer/rfd/0001","by":"Oxide Computer Company"},{"t":"Technical Writing courses","u":"https://developers.google.com/tech-writing","by":"Google"},{"t":"Di\u00e1taxis documentation framework","u":"https://diataxis.fr/","by":"Daniele Procida"}],"reads":[{"t":"Companies Using RFCs or Design Docs and Examples of These","u":"https://blog.pragmaticengineer.com/rfcs-and-design-docs/","by":"Gergely Orosz"},{"t":"The Power of \"Yes, if\": Iterating on our RFC Process","u":"https://engineering.squarespace.com/blog/2019/the-power-of-yes-if","by":"Squarespace Engineering"},{"t":"Documenting Architecture Decisions","u":"https://cognitect.com/blog/2011/11/15/documenting-architecture-decisions","by":"Michael Nygard"}],"projects":[{"n":"Retroactive design doc","l":"Beginner","d":"Write a 2 to 4 page design doc for a system you already built, including non-goals and two rejected alternatives. Ask a peer to review it and count how many questions the doc failed to answer."},{"n":"ADR log for a real repo","l":"Intermediate","d":"Add an ADR folder to one of your projects and record five past decisions with adr-tools. Then rewrite its README using the Di\u00e1taxis split and measure how long a newcomer takes to run it locally."}],"repos":[{"r":"joelparkerhenderson/architecture-decision-record","d":"ADR templates and examples"},{"r":"npryce/adr-tools","d":"Command-line tools for managing ADRs"}]}]},{"id":"scale","title":"Performance & building blocks","level":"Intermediate","intro":"The pieces every production backend uses.","phase":2,"optional":false,"topics":[{"id":"caching","title":"Caching & Redis","short":"Caching & Redis","level":"Intermediate","why":"A cache keeps recently used data in fast memory so repeated reads skip the slow database, which is the cheapest way to cut latency and load.","mins":720,"pre":["sql","indexes","http"],"ideas":["Cache-aside is the default pattern: read the cache, and on a miss read the database and write the result back with a TTL. The application owns both steps, so the cache can always be thrown away safely.","Invalidation is the hard part. Either delete the key when the row changes, or accept staleness up to the TTL. Deleting is safer than updating, because two racing updates can leave the cache holding the older value.","A stampede happens when a hot key expires and hundreds of requests miss at once and all hit the database. Fixes are a lock so only one request refills the key, early refresh before expiry, and random jitter on TTLs.","Redis is an in-memory data structure server: strings, hashes, sorted sets and streams with atomic commands. When memory fills it evicts keys by a policy such as allkeys-lru, so never store data there that you cannot rebuild."],"callout":["Pitfall","A cache that hides a slow database becomes load-bearing. If the cache restarts empty, the full traffic lands on a database sized for 5% of it and falls over."],"lectures":[{"t":"NSDI '13 - Scaling Memcache at Facebook","u":"https://www.youtube.com/watch?v=m4_7W4XzRgk","by":"USENIX"},{"t":"Cache Systems Every Developer Should Know","u":"https://www.youtube.com/watch?v=dGAgxozNWFE","by":"ByteByteGo"},{"t":"Caching Pitfalls Every Developer Should Know","u":"https://www.youtube.com/watch?v=wh98s0XhMmQ","by":"ByteByteGo"}],"papers":[{"t":"Scaling Memcache at Facebook (NSDI 2013)","u":"https://www.usenix.org/system/files/conference/nsdi13/nsdi13-final170_update.pdf","by":"Nishtala et al."},{"t":"RFC 9111: HTTP Caching","u":"https://www.rfc-editor.org/rfc/rfc9111","by":"IETF"},{"t":"Redis docs: Key eviction","u":"https://redis.io/docs/latest/develop/reference/eviction/","by":"Redis"}],"reads":[{"t":"Caching challenges and strategies","u":"https://aws.amazon.com/builders-library/caching-challenges-and-strategies/","by":"Amazon Builders' Library"},{"t":"Caches, Modes, and Unstable Systems","u":"https://brooker.co.za/blog/2021/08/27/caches.html","by":"Marc Brooker"}],"projects":[{"n":"Cache-aside for your API","l":"Intermediate","d":"Add Redis cache-aside with TTLs to a slow read endpoint of your FastAPI service. Measure p50/p99 latency and database queries per second with a load tool like locust, before and after."},{"n":"Stampede lab","l":"Advanced","d":"Expire a hot key under load and watch database QPS spike. Add a Redis lock (SET NX PX) plus TTL jitter and show the spike is gone."}],"repos":[{"r":"redis/redis","d":"Redis server source; the C code is famously readable"},{"r":"redis/redis-py","d":"Official Python client, including asyncio support"}]},{"id":"queues","title":"Queues & background jobs","short":"Queues & jobs","level":"Intermediate","why":"Queues let a request hand slow or unreliable work to background workers, so users get fast responses and failures can be retried.","mins":720,"pre":["concur","caching","txn"],"ideas":["A job queue decouples the producer (your API) from consumers (workers). The API writes a small message and returns 202; workers pull messages at their own pace, so traffic bursts become a backlog instead of timeouts.","Most queues give at-least-once delivery: if a worker crashes before acknowledging, the job runs again. So jobs must be idempotent, for example by keying side effects on a job id and skipping ones already done.","Retries need exponential backoff and a cap. Jobs that keep failing go to a dead-letter queue for a human to inspect, instead of looping forever and blocking healthy work.","If you enqueue inside a database transaction that later rolls back, the worker sees a job for data that does not exist. The transactional outbox fixes this: write the job to a table in the same transaction, then a relay moves it to the queue."],"callout":["Intuition","Watch queue depth and the age of the oldest message. Depth tells you how much work is waiting; age tells you how late your users' work is."],"lectures":[{"t":"Getting Started With Celery: Asynchronous Tasks in Python","u":"https://www.youtube.com/watch?v=VRHVEporra0","by":"Pretty Printed"},{"t":"Kafka vs. RabbitMQ vs. Messaging Middleware vs. Pulsar","u":"https://www.youtube.com/watch?v=x4k1XEjNzYQ","by":"ByteByteGo"}],"papers":[{"t":"Celery: Tasks user guide","u":"https://docs.celeryq.dev/en/stable/userguide/tasks.html","by":"Celery project"},{"t":"RabbitMQ tutorials","u":"https://www.rabbitmq.com/tutorials","by":"RabbitMQ"},{"t":"PostgreSQL SELECT: the locking clause (FOR UPDATE SKIP LOCKED)","u":"https://www.postgresql.org/docs/current/sql-select.html","by":"PostgreSQL docs"}],"reads":[{"t":"Avoiding insurmountable queue backlogs","u":"https://aws.amazon.com/builders-library/avoiding-insurmountable-queue-backlogs/","by":"David Yanacek, Amazon Builders' Library"},{"t":"Transactionally Staged Job Drains in Postgres","u":"https://brandur.org/job-drain","by":"Brandur Leach"},{"t":"Postgres Job Queues & Failure By MVCC","u":"https://brandur.org/postgres-queues","by":"Brandur Leach"}],"projects":[{"n":"Offload email and reports","l":"Intermediate","d":"Move a slow endpoint (sending email or generating a PDF) to Celery or RQ workers backed by Redis. Return 202 with a job id and a status endpoint; measure request latency and job completion time."},{"n":"Postgres queue with SKIP LOCKED","l":"Advanced","d":"Build a job table, claim jobs with FOR UPDATE SKIP LOCKED from several workers, and add retries with backoff and a dead-letter state. Kill workers mid-job and prove no job is lost or run twice in effect."}],"repos":[{"r":"celery/celery","d":"The standard distributed task queue for Python"},{"r":"rq/rq","d":"Simple Redis-backed job queue, small enough to read in an afternoon"},{"r":"pgmq/pgmq","d":"A lightweight message queue built as a Postgres extension"}]},{"id":"ratelimit","title":"Rate limiting & backpressure","short":"Rate limiting","level":"Intermediate","why":"Rate limits and backpressure stop one client or one traffic spike from taking down a service that everyone shares.","mins":480,"pre":["http","caching","queues"],"ideas":["A token bucket holds up to N tokens and refills at R per second. Each request takes a token or is rejected, so clients get short bursts up to N but a long-run average of R.","A fixed window counter (requests per minute) is simple but allows double bursts at window edges. A sliding window or GCRA smooths this and can be stored as one counter or timestamp per key in Redis.","Reject early and cheaply with HTTP 429 and a Retry-After header. Doing the work and then failing wastes the capacity you were trying to protect.","Backpressure means a full system says no instead of queueing without limit. Bounded queues, timeouts, and load shedding keep latency stable, while unbounded queues just turn overload into very slow failures."],"callout":["Pitfall","Retries multiply load. If three layers each retry three times, one failed call becomes 27. Retry at one layer, with backoff and jitter, and cap the total."],"lectures":[{"t":"Rate Limiter System Design: Token Bucket, Leaky Bucket, Scaling","u":"https://www.youtube.com/watch?v=YXkOdWBwqaA","by":"ByteByteGo"},{"t":"AWS re:Invent 2024 - Try again: The tools and techniques behind resilient systems (ARC403)","u":"https://www.youtube.com/watch?v=rvHd4Y76-fs","by":"AWS Events"}],"papers":[{"t":"Google SRE book: Handling Overload","u":"https://sre.google/sre-book/handling-overload/","by":"Google"},{"t":"RFC 6585: Additional HTTP Status Codes (429 Too Many Requests)","u":"https://www.rfc-editor.org/rfc/rfc6585","by":"IETF"},{"t":"RateLimit header fields for HTTP (draft)","u":"https://datatracker.ietf.org/doc/draft-ietf-httpapi-ratelimit-headers/","by":"IETF HTTPAPI WG"}],"reads":[{"t":"Scaling your API with rate limiters","u":"https://stripe.com/blog/rate-limiters","by":"Paul Tarjan, Stripe"},{"t":"Rate Limiting, Cells, and GCRA","u":"https://brandur.org/rate-limiting","by":"Brandur Leach"},{"t":"Using load shedding to avoid overload","u":"https://aws.amazon.com/builders-library/using-load-shedding-to-avoid-overload/","by":"David Yanacek, Amazon Builders' Library"}],"projects":[{"n":"Redis token bucket middleware","l":"Intermediate","d":"Write FastAPI middleware that enforces a per-API-key token bucket in Redis using a Lua script, returning 429 with Retry-After. Load test it and check the accepted rate matches your configured limit."},{"n":"Overload experiment","l":"Advanced","d":"Push your service past capacity with and without a bounded worker queue and load shedding. Plot goodput and p99 latency versus offered load to see the collapse and the fix."}],"repos":[{"r":"laurentS/slowapi","d":"Rate limiting for FastAPI and Starlette"},{"r":"brandur/redis-cell","d":"Redis module implementing GCRA rate limiting"},{"r":"upstash/ratelimit-py","d":"Serverless Redis rate limiting with sliding window and token bucket"}]},{"id":"lb","title":"Load balancing & horizontal scaling","short":"Load balancing","level":"Intermediate","why":"Running many identical copies of a service behind a load balancer is how backends grow past one machine and survive the loss of one.","mins":600,"pre":["internet","http","ratelimit"],"ideas":["To scale horizontally, servers must be stateless: sessions, uploads and caches live in shared stores like Postgres, Redis or object storage. Then any request can go to any copy, and copies can be added or killed freely.","Layer 4 balancers forward TCP connections without reading them. Layer 7 balancers parse HTTP, so they can route by path or header, retry, and terminate TLS, at more CPU cost.","Round robin ignores how busy a server is. Least-connections or 'power of two random choices' (pick two servers at random, send to the less loaded) spread load far better with little coordination.","Health checks remove dead servers from rotation. A shallow check (process is up) can miss a broken dependency, while a deep check that fails on a shared database outage can remove every server at once."],"callout":["Intuition","Adding servers only helps if the bottleneck is the servers. If every copy waits on one database, ten copies just queue ten times as many requests on it."],"lectures":[{"t":"Top 6 Load Balancing Algorithms Every Developer Should Know","u":"https://www.youtube.com/watch?v=dBmxNsS3BGE","by":"ByteByteGo"},{"t":"Load balancing in Layer 4 vs Layer 7 with HAPROXY Examples","u":"https://www.youtube.com/watch?v=aKMLgFVxZYk","by":"Hussein Nasser"}],"papers":[{"t":"Google SRE book: Load Balancing in the Datacenter","u":"https://sre.google/sre-book/load-balancing-datacenter/","by":"Google"},{"t":"Maglev: A Fast and Reliable Software Network Load Balancer","u":"https://research.google/pubs/maglev-a-fast-and-reliable-software-network-load-balancer/","by":"Eisenbud et al., Google (NSDI 2016)"},{"t":"The Twelve-Factor App","u":"https://12factor.net/","by":"Adam Wiggins"}],"reads":[{"t":"Load Balancing (interactive)","u":"https://samwho.dev/load-balancing/","by":"Sam Rose"},{"t":"The power of two random choices","u":"https://brooker.co.za/blog/2012/01/17/two-random.html","by":"Marc Brooker"},{"t":"Implementing health checks","u":"https://aws.amazon.com/builders-library/implementing-health-checks/","by":"David Yanacek, Amazon Builders' Library"}],"projects":[{"n":"Three replicas behind nginx","l":"Intermediate","d":"Run three copies of your API with Docker Compose behind nginx. Move session state to Redis, then kill one replica during a load test and count failed requests."},{"n":"Balancer algorithm shootout","l":"Advanced","d":"Write a small simulator (or use HAProxy configs) comparing round robin, least connections and two random choices when one backend is slow. Compare p99 latency for each."}],"repos":[{"r":"haproxy/haproxy","d":"High-performance TCP/HTTP load balancer"},{"r":"envoyproxy/envoy","d":"Cloud-native L7 proxy used in most service meshes"},{"r":"nginx/nginx","d":"Web server and reverse proxy"}]},{"id":"be_api_adv","title":"API patterns: versioning, pagination, idempotency & webhooks","short":"API patterns","level":"Intermediate","why":"Public APIs live for years and run over unreliable networks, so these patterns decide whether clients can retry safely and upgrade without breaking.","mins":720,"pre":["apis","http","validation"],"ideas":["An idempotency key is a client-chosen ID sent with a write. The server stores the key with the result, so a retry after a timeout returns the first result instead of charging the card twice.","Cursor pagination returns an opaque token that encodes where the last page ended, such as the last seen id. Unlike offset pagination it stays fast on deep pages and does not skip or repeat rows when data changes.","Versioning lets you change an API without breaking old clients. Stripe pins each account to a dated version and translates responses through a chain of small version changes, so old integrations keep working.","Webhooks push events to a client URL. Sign each payload with HMAC and a timestamp, retry with exponential backoff, and expect receivers to dedupe by event id because delivery is at least once."],"callout":["Pitfall","Adding a field is usually safe, but removing a field, renaming it or changing an enum's values breaks clients. Treat every response field as a promise."],"lectures":[{"t":"The principles behind great API design","u":"https://www.youtube.com/watch?v=IEe-5VOv0Js","by":"Stripe Sessions 2019"},{"t":"Webhooks at scale: best practices and lessons learned","u":"https://www.youtube.com/watch?v=u2O-QS-A7jo","by":"Stripe Developers"},{"t":"Designing Idempotent API Endpoints for Payments at Stripe","u":"https://www.youtube.com/watch?v=J2IcD9FZvZU","by":"Arpit Bhayani"}],"papers":[{"t":"AIP-158: Pagination","u":"https://google.aip.dev/158","by":"Google API Improvement Proposals"},{"t":"Standard Webhooks specification","u":"https://www.standardwebhooks.com/","by":"Standard Webhooks"},{"t":"The Idempotency-Key HTTP Header Field (IETF draft)","u":"https://datatracker.ietf.org/doc/draft-ietf-httpapi-idempotency-key-header/","by":"IETF HTTPAPI WG"},{"t":"Idempotent requests (API reference)","u":"https://docs.stripe.com/api/idempotent_requests","by":"Stripe"}],"reads":[{"t":"APIs as infrastructure: future-proofing Stripe with versioning","u":"https://stripe.com/blog/api-versioning","by":"Brandur Leach, Stripe"},{"t":"Implementing Stripe-like Idempotency Keys in Postgres","u":"https://brandur.org/idempotency-keys","by":"Brandur Leach"},{"t":"Evolving API Pagination at Slack","u":"https://slack.engineering/evolving-api-pagination-at-slack/","by":"Slack Engineering"}],"projects":[{"n":"Idempotent payments endpoint","l":"Intermediate","d":"Build a POST /charges endpoint that stores idempotency keys in Postgres. Fire the same request 50 times concurrently with a script and prove exactly one charge row exists."},{"n":"Webhook sender and receiver","l":"Intermediate","d":"Build a sender that signs payloads per Standard Webhooks and retries with backoff, plus a receiver that verifies signatures and dedupes. Kill the receiver mid-run and measure how many events arrive late or twice."}],"repos":[{"r":"standard-webhooks/standard-webhooks","d":"Webhook spec with reference libraries in many languages"},{"r":"svix/svix-webhooks","d":"Open-source webhook sending service"},{"r":"microsoft/api-guidelines","d":"Microsoft and Azure REST API guidelines"}]},{"id":"be_search","title":"Search: Postgres full-text search & Elasticsearch/OpenSearch","short":"Search","level":"Intermediate","why":"Almost every product needs a search box, and knowing how text is indexed and ranked tells you when Postgres is enough and when you need a search engine.","mins":780,"pre":["sql","indexes"],"ideas":["A search engine builds an inverted index: for each term, a sorted list of the documents that contain it. A query intersects or merges these lists instead of scanning every document.","Text is analyzed before indexing. A tokenizer splits it into words, then filters lowercase them, drop stop words and stem them, so \"Running\" and \"runs\" both match \"run\". The query must use the same analyzer.","BM25 scores a document higher when a query term appears often in it, rarely across the whole corpus, and in a shorter document. Term frequency saturates, so the tenth mention adds less than the second.","Postgres stores analyzed text as a tsvector, matches it with a tsquery and speeds it up with a GIN index. Elasticsearch and OpenSearch add BM25 ranking, typo tolerance, facets and horizontal sharding at the cost of running a second system you must keep in sync."],"callout":["Intuition","Start with Postgres full-text search when the data already lives there. Move to a dedicated engine when you need relevance tuning, fuzzy matching or search load that would hurt your main database."],"lectures":[{"t":"Inverted Index: The Data Structure Behind Search Engines","u":"https://www.youtube.com/watch?v=iHHqnyThrqE","by":"Arpit Bhayani"},{"t":"BM25: The Most Important Text Metric in Data Science","u":"https://www.youtube.com/watch?v=ruBm9WywevM","by":"ritvikmath"},{"t":"Full text search (Postgres.FM 098)","u":"https://www.youtube.com/watch?v=2kGn1_aWU7o","by":"Postgres.FM"}],"papers":[{"t":"Full Text Search (PostgreSQL docs, chapter 12)","u":"https://www.postgresql.org/docs/current/textsearch.html","by":"PostgreSQL Global Development Group"},{"t":"Text analysis","u":"https://www.elastic.co/docs/manage-data/data-store/text-analysis","by":"Elastic"},{"t":"OpenSearch documentation","u":"https://docs.opensearch.org/latest/","by":"OpenSearch Project"},{"t":"The Probabilistic Relevance Framework: BM25 and Beyond","u":"https://www.staff.city.ac.uk/~sbrp622/papers/foundations_bm25_review.pdf","by":"Robertson & Zaragoza"}],"reads":[{"t":"Postgres full-text search is Good Enough!","u":"https://rachbelaid.com/postgres-full-text-search-is-good-enough/","by":"Rachid Belaid"},{"t":"Practical BM25, Part 2: The BM25 Algorithm and its Variables","u":"https://www.elastic.co/blog/practical-bm25-part-2-the-bm25-algorithm-and-its-variables","by":"Shane Connelly, Elastic"},{"t":"Visualizing Lucene's segment merges","u":"https://blog.mikemccandless.com/2011/02/visualizing-lucenes-segment-merges.html","by":"Mike McCandless"}],"projects":[{"n":"Postgres search for a docs site","l":"Beginner","d":"Load a few thousand articles into Postgres, add a generated tsvector column with weights for title and body, and a GIN index. Compare query time with and without the index and judge the top 10 results for 20 queries."},{"n":"Postgres vs OpenSearch bake-off","l":"Intermediate","d":"Index the same corpus in OpenSearch and build a small sync job from Postgres. Compare relevance on a labeled query set (precision at 10), p95 latency and the effort to handle typos."}],"repos":[{"r":"paradedb/paradedb","d":"Postgres extension adding BM25 search"},{"r":"meilisearch/meilisearch","d":"Simple search engine with typo tolerance"},{"r":"quickwit-oss/tantivy","d":"Lucene-style full-text search library in Rust"}]},{"id":"be_storage","title":"Object storage, file uploads & CDNs","short":"Storage & CDNs","level":"Intermediate","why":"User files, images and videos do not belong in your database or app server, and object storage plus a CDN is the standard way to store and serve them cheaply.","mins":600,"pre":["http","caching"],"ideas":["Object storage like S3 keeps blobs under a key in a flat bucket. Objects are written whole and read over HTTP, which makes storage cheap and durable but means you cannot edit part of a file in place.","A presigned URL is a time-limited, signed link that lets a browser upload or download one object directly. Your server only signs the URL, so large files never pass through it.","Multipart upload splits a big file into parts that upload in parallel and retry on their own. After upload, a background job can scan, resize or transcode the file and write the results back as new objects.","A CDN caches responses at edge servers near users. Cache-Control headers decide how long an edge keeps a copy, and putting a content hash in the file name lets you cache forever and still ship updates."],"callout":["Pitfall","Never trust the file name or Content-Type a client sends. Check size and type on the server side, store files under keys you generate and keep buckets private by default."],"lectures":[{"t":"AWS S3 Presigned URL Upload Tutorial in Python","u":"https://www.youtube.com/watch?v=1D9ggTJ9Ejc","by":"Be A Better Dev"},{"t":"CDNs 101: An Introduction to Content Delivery Networks","u":"https://www.youtube.com/watch?v=djyt_mG3S60","by":"Jake Ginnivan, NDC Oslo 2023"},{"t":"What Is A CDN? How Does It Work?","u":"https://www.youtube.com/watch?v=RI9np1LWzqw","by":"ByteByteGo"}],"papers":[{"t":"Download and upload objects with presigned URLs","u":"https://docs.aws.amazon.com/AmazonS3/latest/userguide/using-presigned-url.html","by":"AWS"},{"t":"Uploading and copying objects using multipart upload","u":"https://docs.aws.amazon.com/AmazonS3/latest/userguide/mpuoverview.html","by":"AWS"},{"t":"RFC 9111: HTTP Caching","u":"https://www.rfc-editor.org/rfc/rfc9111.html","by":"IETF"},{"t":"tus resumable upload protocol","u":"https://tus.io/protocols/resumable-upload","by":"tus.io"}],"reads":[{"t":"Building and operating a pretty big storage system called S3","u":"https://www.allthingsdistributed.com/2023/07/building-and-operating-a-pretty-big-storage-system.html","by":"Andy Warfield, All Things Distributed"},{"t":"Caching best practices & max-age gotchas","u":"https://jakearchibald.com/2016/caching-best-practices/","by":"Jake Archibald"},{"t":"What is a CDN?","u":"https://www.cloudflare.com/learning/cdn/what-is-a-cdn/","by":"Cloudflare Learning Center"}],"projects":[{"n":"Direct-to-bucket uploads","l":"Beginner","d":"Run MinIO locally and build an endpoint that returns presigned PUT URLs, plus a page that uploads straight to the bucket. Upload a 1 GB file and compare app server memory and CPU with a proxied upload."},{"n":"Image pipeline behind a CDN","l":"Intermediate","d":"On upload, queue a job that makes thumbnails and WebP versions, then serve them through imgproxy or a CDN with hashed names. Measure cache hit ratio and time to first byte from a cold and warm edge."}],"repos":[{"r":"minio/minio","d":"S3-compatible object storage you can run locally"},{"r":"imgproxy/imgproxy","d":"Fast on-the-fly image resizing server"},{"r":"transloadit/uppy","d":"Modular browser file uploader with S3 and tus support"}]},{"id":"nosql","title":"NoSQL & choosing a datastore","short":"NoSQL & choosing","level":"Intermediate","why":"Key-value, document, wide-column and other stores each fit some access patterns far better than others, and choosing well means knowing what each one gives up.","mins":720,"pre":["sql","indexes"],"ideas":["Key-value stores like Redis and DynamoDB are fast because every read goes straight to one key. The cost is that you must design keys around queries you know in advance.","Dynamo-style systems spread data across nodes with consistent hashing and replicate it. They stay writable during failures by allowing replicas to disagree for a while and reconciling later.","Wide-column stores like Bigtable and Cassandra keep rows sorted by key, so range scans over one partition are cheap. Writes go to a log and memtable and are merged later, which suits heavy write loads.","PostgreSQL with JSONB, full-text search and extensions covers many NoSQL use cases. Add a second datastore when a measured need appears, since each one adds operations and consistency work."],"callout":["Pitfall","In single-table DynamoDB design you model access patterns first. If a new query appears later that your keys do not support, you may need a backfill or a new index."],"lectures":[{"t":"Amazon DynamoDB Deep Dive: Advanced Design Patterns (re:Invent 2018)","u":"https://www.youtube.com/watch?v=HaEPXoXVf2k","by":"Rick Houlihan (AWS)"},{"t":"How To Choose The Right Database?","u":"https://www.youtube.com/watch?v=kkeFE6iRfMM","by":"ByteByteGo"}],"papers":[{"t":"Dynamo: Amazon's Highly Available Key-value Store (2007)","u":"https://www.allthingsdistributed.com/files/amazon-dynamo-sosp2007.pdf","by":"DeCandia et al."},{"t":"Bigtable: A Distributed Storage System for Structured Data (2006)","u":"https://static.googleusercontent.com/media/research.google.com/en//archive/bigtable-osdi06.pdf","by":"Chang et al. (Google)"},{"t":"Redis data types","u":"https://redis.io/docs/latest/develop/data-types/","by":"Redis"},{"t":"Best practices for designing and architecting with DynamoDB","u":"https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/best-practices.html","by":"AWS"}],"reads":[{"t":"The What, Why, and When of Single-Table Design with DynamoDB","u":"https://www.alexdebrie.com/posts/dynamodb-single-table/","by":"Alex DeBrie"},{"t":"Just Use Postgres for Everything","u":"https://www.amazingcto.com/postgres-for-everything/","by":"Stephan Schmidt"},{"t":"Jepsen: MongoDB 4.2.6","u":"https://jepsen.io/analyses/mongodb-4.2.6","by":"Kyle Kingsbury"}],"projects":[{"n":"Same feature, two stores","l":"Intermediate","d":"Implement an activity feed for your API in PostgreSQL and again in Redis sorted sets or DynamoDB Local. Compare read latency, code size and what breaks when you add a new filter."},{"n":"JSONB versus columns","l":"Beginner","d":"Store task metadata as JSONB with a GIN index and as normal columns. Measure query speed and storage, and list which constraints you lose with JSONB."}],"repos":[{"r":"rxin/db-readings","d":"Curated reading list of database papers"},{"r":"redis/redis","d":"Source of Redis; data structures are readable C"}]}]},{"id":"arch","title":"Architecture & data","level":"Intermediate","intro":"How services and data flow at scale.","phase":2,"optional":false,"topics":[{"id":"be_arch","title":"Monoliths, microservices & service communication","short":"Monolith vs micro","level":"Intermediate","why":"How you split a system into deployable units shapes team speed, failure modes and cost for years, and the wrong split is expensive to undo.","mins":900,"pre":["apis","queues"],"ideas":["A monolith is one deployable unit. A modular monolith keeps clear module boundaries inside it, which gives most of the design benefits of services without network calls or distributed transactions.","Microservices are independently deployable services, each owning its own data. They let many teams ship separately, but every call can now fail or be slow, and you need tracing, retries and versioned contracts.","Services talk synchronously (HTTP or gRPC, the caller waits) or asynchronously (events on a queue, the caller moves on). Async calls decouple uptime between services but make the flow harder to follow and data eventually consistent.","To split a monolith, find boundaries along business domains (DDD bounded contexts), then peel off one piece at a time with the strangler fig pattern, routing traffic to the new service while the old code still runs."],"callout":["Pitfall","A set of services that must deploy together or share one database is a distributed monolith. It has the costs of both styles and the benefits of neither."],"lectures":[{"t":"Monolith Decomposition Patterns","u":"https://www.youtube.com/watch?v=9I9GdSQ1bbM","by":"Sam Newman, GOTO 2019"},{"t":"When To Use Microservices (And When Not To!)","u":"https://www.youtube.com/watch?v=GBTdnfD6s5Q","by":"Sam Newman & Martin Fowler, GOTO 2020"},{"t":"Microservices","u":"https://www.youtube.com/watch?v=wgdBVIX9ifA","by":"Martin Fowler, GOTO 2014"}],"papers":[{"t":"Microservices","u":"https://martinfowler.com/articles/microservices.html","by":"James Lewis & Martin Fowler"},{"t":"MonolithFirst","u":"https://martinfowler.com/bliki/MonolithFirst.html","by":"Martin Fowler"},{"t":"Microservice Architecture pattern language","u":"https://microservices.io/patterns/index.html","by":"Chris Richardson"},{"t":"gRPC core concepts","u":"https://grpc.io/docs/what-is-grpc/core-concepts/","by":"gRPC Authors"}],"reads":[{"t":"Goodbye Microservices: From 100s of problem children to 1 superstar","u":"https://segment.com/blog/goodbye-microservices/","by":"Alexandra Noonan, Segment"},{"t":"Deconstructing the Monolith: Designing Software that Maximizes Developer Productivity","u":"https://shopify.engineering/deconstructing-monolith-designing-software-maximizes-developer-productivity","by":"Kirsten Westeinde, Shopify"},{"t":"Introducing Domain-Oriented Microservice Architecture","u":"https://www.uber.com/us/en/blog/microservice-architecture/","by":"Adam Gluck, Uber"}],"projects":[{"n":"Modular monolith","l":"Intermediate","d":"Build a small shop app as one service with three modules (catalog, orders, payments) that may only call each other through public interfaces. Add a check in CI that fails on forbidden imports."},{"n":"Extract a service","l":"Advanced","d":"Move the payments module into its own service using the strangler fig pattern, first over HTTP, then over a queue. Measure p99 latency, error rate when payments is down and how many lines of glue code each style needed."}],"repos":[{"r":"GoogleCloudPlatform/microservices-demo","d":"Online Boutique: 11 services talking over gRPC"},{"r":"Shopify/packwerk","d":"Enforces module boundaries inside a Rails monolith"}]},{"id":"events","title":"Event-driven architecture & Kafka","short":"Events & Kafka","level":"Advanced","why":"Event-driven systems record what happened as an ordered log that many services read independently, which decouples teams and lets data flow in real time.","mins":900,"pre":["queues"],"ideas":["Kafka is a partitioned, replicated append-only log. Producers append records to a topic partition; consumers track their own offset, so many consumer groups can read the same data at their own pace and replay from the past.","Order is only guaranteed within a partition. Records with the same key go to the same partition, so key by entity id (order id, user id) to keep each entity's events in order.","Delivery is at-least-once by default, so consumers must be idempotent. Commit the offset after processing, and store a processed-event id or use upserts so a redelivered event has no extra effect.","An event notification says 'order 42 changed'; event-carried state includes the data. Change data capture (Debezium) or a transactional outbox turns database writes into events without the dual-write problem of writing to both DB and Kafka separately."],"callout":["Intuition","A database table is a snapshot of a log, and the log is the history of the table. Keeping the log lets you rebuild new views (search indexes, caches, analytics) from scratch."],"lectures":[{"t":"\"Turning the database inside out with Apache Samza\"","u":"https://www.youtube.com/watch?v=fU9hR3kiOK0","by":"Martin Kleppmann, Strange Loop"},{"t":"Apache Kafka Fundamentals You Should Know","u":"https://www.youtube.com/watch?v=-RDyEFvnTXI","by":"ByteByteGo"},{"t":"I \u2665 Logs: Apache Kafka and Real-Time Data Integration","u":"https://www.youtube.com/watch?v=aJuo_bLSW6s","by":"Jay Kreps"}],"papers":[{"t":"Kafka: a Distributed Messaging System for Log Processing","u":"https://notes.stephenholiday.com/Kafka.pdf","by":"Kreps, Narkhede, Rao (NetDB 2011)"},{"t":"Apache Kafka documentation: Design","u":"https://kafka.apache.org/documentation/#design","by":"Apache Kafka"},{"t":"Pattern: Transactional outbox","u":"https://microservices.io/patterns/data/transactional-outbox.html","by":"Chris Richardson"}],"reads":[{"t":"What do you mean by \"Event-Driven\"?","u":"https://martinfowler.com/articles/201701-event-driven.html","by":"Martin Fowler"},{"t":"Turning the database inside-out with Apache Samza","u":"https://www.confluent.io/blog/turning-the-database-inside-out-with-apache-samza/","by":"Martin Kleppmann"},{"t":"Exactly-once Semantics are Possible: Here's How Kafka Does it","u":"https://www.confluent.io/blog/exactly-once-semantics-are-possible-heres-how-apache-kafka-does-it/","by":"Neha Narkhede, Confluent"}],"projects":[{"n":"Order events pipeline","l":"Intermediate","d":"Publish an OrderCreated event from your API via a transactional outbox into Kafka (or Redpanda). Build two consumers, one for email and one for analytics, and replay the topic to rebuild the analytics table."},{"n":"CDC into a search index","l":"Advanced","d":"Stream Postgres changes with Debezium into Kafka and keep a search index or Redis read model in sync. Kill consumers mid-stream and verify the read model ends up identical to the source."}],"repos":[{"r":"apache/kafka","d":"Apache Kafka source"},{"r":"confluentinc/confluent-kafka-python","d":"Confluent's Python client built on librdkafka"},{"r":"debezium/debezium","d":"Change data capture from databases into Kafka"}]},{"id":"pyml","title":"Python for ML: NumPy & pandas","short":"NumPy & pandas","level":"Beginner","why":"NumPy and pandas are how ML code holds and transforms data, so fluency here makes every later topic faster.","mins":1200,"pre":[],"ideas":["A NumPy array is one block of memory holding values of a single type, plus a shape and strides that say how to walk it. That layout is why array math runs in C and is 10 to 100 times faster than a Python loop.","Vectorization means writing one operation over a whole array (a * b, x.sum(axis=0)) instead of looping over elements. The loop still happens, but in compiled code.","Broadcasting lines up shapes from the right and stretches any dimension of size 1. A (100, 3) array minus a (3,) array subtracts the same row from all 100 rows without copying it.","A pandas DataFrame is a set of named columns that share a row index. Most work is filter, groupby, aggregate and merge, which map almost directly to SQL WHERE, GROUP BY and JOIN."],"callout":["Pitfall","Slicing a NumPy array returns a view that shares memory, so editing the slice edits the original. Call .copy() when you need an independent array."],"lectures":[{"t":"Losing your Loops: Fast Numerical Computing with NumPy (PyCon 2015)","u":"https://www.youtube.com/watch?v=EEUXKG97YRw","by":"Jake VanderPlas"},{"t":"Complete Python Pandas Data Science Tutorial","u":"https://www.youtube.com/watch?v=vmEHCJofslg","by":"Keith Galli"}],"papers":[{"t":"Python Data Science Handbook (free online)","u":"https://jakevdp.github.io/PythonDataScienceHandbook/","by":"Jake VanderPlas"},{"t":"Array programming with NumPy (Nature, 2020)","u":"https://www.nature.com/articles/s41586-020-2649-2","by":"Harris et al."},{"t":"NumPy: the absolute basics for beginners","u":"https://numpy.org/doc/stable/user/absolute_beginners.html","by":"NumPy docs"},{"t":"10 minutes to pandas","u":"https://pandas.pydata.org/docs/user_guide/10min.html","by":"pandas docs"}],"reads":[{"t":"From Python to NumPy","u":"https://www.labri.fr/perso/nrougier/from-python-to-numpy/","by":"Nicolas Rougier"},{"t":"A Visual Intro to NumPy and Data Representation","u":"https://jalammar.github.io/visual-numpy/","by":"Jay Alammar"},{"t":"Modern Pandas (Part 1)","u":"https://tomaugspurger.net/posts/modern-1-intro/","by":"Tom Augspurger"}],"projects":[{"n":"Loop vs vectorized benchmark","l":"Beginner","d":"Implement pairwise Euclidean distances for 2,000 points with Python loops, then with broadcasting. Time both and check the results match to 1e-9."},{"n":"Clean and summarize a public dataset","l":"Beginner","d":"Load a messy CSV (for example NYC taxi trips) into pandas, fix types and missing values, then answer five questions with groupby. Record how memory use changes after converting columns to categories."}],"repos":[{"r":"rougier/numpy-100","d":"100 NumPy exercises with solutions, graded by difficulty"},{"r":"jakevdp/PythonDataScienceHandbook","d":"Notebooks for the whole handbook, runnable in Colab"}]},{"id":"datasql","title":"Working with data: SQL & data cleaning","short":"SQL & cleaning","level":"Beginner","why":"Most ML datasets start in a database and most model errors start in dirty data, so querying and cleaning are core skills.","mins":900,"pre":["pyml","sql"],"ideas":["SQL describes what rows you want, not how to get them. The database runs FROM and JOIN first, then WHERE, GROUP BY, HAVING, SELECT and ORDER BY, which is why you cannot filter on a SELECT alias in WHERE.","A JOIN matches rows from two tables on a key. An inner join drops unmatched rows and a left join keeps them with NULLs, so the wrong join type silently changes your row count.","Tidy data means each variable is a column, each observation is a row and each kind of thing has its own table. Tidy data is easy to filter, group and plot.","Cleaning means fixing types, units, duplicates, missing values and impossible values. Always count rows and check summaries before and after each step so you notice what changed."],"callout":["Pitfall","Filling missing values or normalizing using the whole dataset before the train/test split leaks test information into training. Fit cleaning steps on training data only."],"lectures":[{"t":"CS50 SQL Lecture 0: Querying","u":"https://www.youtube.com/watch?v=vHYeChEf2lA","by":"CS50 (Carter Zenke)"},{"t":"CS50 SQL Lecture 1: Relating","u":"https://www.youtube.com/watch?v=_2t18Hy9Z0Y","by":"CS50 (Carter Zenke)"},{"t":"The present and future of tidy data","u":"https://www.youtube.com/watch?v=w0KfXPVBNQk","by":"Hadley Wickham"}],"papers":[{"t":"Tidy Data (Journal of Statistical Software, 2014)","u":"https://www.jstatsoft.org/article/view/v059i10","by":"Hadley Wickham"},{"t":"PostgreSQL Tutorial","u":"https://www.postgresql.org/docs/current/tutorial.html","by":"PostgreSQL docs"},{"t":"Query Planning in SQLite","u":"https://www.sqlite.org/queryplanner.html","by":"SQLite docs"}],"reads":[{"t":"SQL queries don't start with SELECT","u":"https://jvns.ca/blog/2019/10/03/sql-queries-don-t-start-with-select/","by":"Julia Evans"},{"t":"Select Star SQL (interactive book)","u":"https://selectstarsql.com/","by":"Zi Chong Kao"},{"t":"Use The Index, Luke","u":"https://use-the-index-luke.com/","by":"Markus Winand"}],"projects":[{"n":"Answer questions with SQL","l":"Beginner","d":"Load a public dataset into SQLite or DuckDB and answer ten questions with joins, groupby and window functions. Check each answer against the same computation in pandas."},{"n":"Build a cleaning pipeline","l":"Intermediate","d":"Write a script that turns a raw dataset into a tidy training table, with assertions for types, ranges and duplicates. Log row counts at every step and train a simple model before and after cleaning to see the effect."}],"repos":[{"r":"duckdb/duckdb","d":"In-process analytical SQL database that reads CSV and Parquet directly"},{"r":"jvns/pandas-cookbook","d":"Practical pandas recipes on real messy datasets"},{"r":"pola-rs/polars","d":"Fast DataFrame library with a lazy query engine"}]},{"id":"de_pipelines","title":"Data engineering: ETL, batch & streaming pipelines","short":"Data pipelines","level":"Intermediate","why":"Analytics, ML training and prod
