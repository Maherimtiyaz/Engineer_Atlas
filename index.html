ennus/awesome-scalability","d":"Curated reading list of real-world scaling case studies"}]},{"id":"enterprise","title":"Enterprise readiness: SSO, compliance & SOC 2","short":"Enterprise ready","level":"Advanced","why":"Companies will not buy your product until it fits their security and compliance rules, so SSO, audit logs and a SOC 2 report often decide a deal.","mins":720,"pre":["authn","authz","owasp","secrets","llmops"],"ideas":["With SSO, the customer's identity provider (Okta, Entra ID, Google) logs users in, and your app trusts a signed assertion. SAML sends signed XML through the browser. OIDC sends a signed JWT ID token after an OAuth 2.0 flow. SCIM lets the provider create and delete user accounts in your app automatically.","RBAC gives each user roles, and each role a set of permissions, checked on the server for every request. Audit logs record who did what, to which resource, when and from where, in an append-only store customers can export.","SOC 2 is an audit report, not a certificate. An independent CPA checks your controls against the AICPA Trust Services Criteria. Type I checks the design at one point in time. Type II checks the controls actually worked over a period, often 3 to 12 months.","LLM apps add data questions customers will ask. Does the model provider train on our data? How long are prompts and outputs retained? Where are they stored? Answer with zero-retention provider settings, a retention policy you enforce in code, PII redaction in logs, and a list of subprocessors."],"callout":["Pitfall","Your traces and eval datasets are full of customer data. Teams lock down the main database and then copy prompts into a logging tool, spreadsheets and notebooks with no retention or access control. Apply the same rules to every copy."],"lectures":[{"t":"What is SSO? (Enterprise Ready Conf 2024)","u":"https://www.youtube.com/watch?v=HGRe_7KqhiY","by":"WorkOS"},{"t":"SOC2 Compliance for Startups","u":"https://www.youtube.com/watch?v=9tLXJwkCr6g","by":"Vanta"},{"t":"What is auth? SSO, SAML, SCIM, AuthN & AuthZ Explained","u":"https://www.youtube.com/watch?v=0Pe16HT7vtc","by":"Technically"}],"papers":[{"t":"EnterpriseReady: build SaaS features enterprises love","u":"https://www.enterpriseready.io/","by":"Grant Miller"},{"t":"SOC 2: SOC for Service Organizations","u":"https://www.aicpa-cima.com/topic/audit-assurance/audit-and-assurance-greater-than-soc-2","by":"AICPA"},{"t":"OpenID Connect Core 1.0","u":"https://openid.net/specs/openid-connect-core-1_0.html","by":"OpenID Foundation"},{"t":"Application Security Verification Standard (ASVS)","u":"https://owasp.org/www-project-application-security-verification-standard/","by":"OWASP"}],"reads":[{"t":"The SOC2 Starting Seven","u":"https://www.latacora.com/blog/2020/03/12/soc2-starting-seven/","by":"Latacora"},{"t":"SOC2: The Screenshots Will Continue Until Security Improves","u":"https://fly.io/blog/soc2-the-screenshots-will-continue-until-security-improves/","by":"Thomas Ptacek, Fly.io"},{"t":"The Developer's Guide to SSO","u":"https://workos.com/guide/the-developers-guide-to-sso","by":"WorkOS"}],"projects":[{"n":"SSO, RBAC and audit log","l":"Advanced","d":"Add OIDC and SAML login to your FastAPI app against a local Keycloak, plus three roles enforced in a dependency and an append-only audit_log table. Write tests that prove a viewer cannot call admin endpoints and that every write produces one audit row."},{"n":"Security packet for an LLM app","l":"Advanced","d":"Write the documents a buyer's security review asks for: data flow diagram, subprocessor list, retention policy, and answers on model training and PII. Implement the retention policy as a scheduled job that deletes traces older than N days, and verify it with a test."}],"repos":[{"r":"keycloak/keycloak","d":"Open source identity provider for testing SAML and OIDC locally"},{"r":"boxyhq/jackson","d":"SAML and OIDC SSO bridge plus directory sync (SCIM)"},{"r":"SAML-Toolkits/python3-saml","d":"Python SAML service provider library"}]}]},{"id":"career","title":"Career","level":"Intermediate","intro":"Turn what you built into a job: portfolio, interviews and public work.","phase":9,"optional":false,"topics":[{"id":"car_portfolio","title":"Portfolio, open-source contributions & writing in public","short":"Portfolio & OSS","level":"Beginner","why":"A small set of shipped projects, real open-source pull requests and public write-ups is the strongest evidence of skill you can show an employer.","mins":2400,"pre":["cli","oss"],"ideas":["Three finished projects beat ten half-built ones. Each should solve a real problem, be deployed or installable, and have a README with what it does, a screenshot or demo, how to run it, the design choices and what you would do next.","Make your first open-source contributions small: fix docs, add a test, reproduce a bug. Read CONTRIBUTING.md, comment on the issue before starting, keep the PR focused, and respond to review quickly. Merged PRs in projects you use carry more weight than toy repos.","Learning in public means writing down what you learn as you learn it: a blog post, a TIL note or a thread. Writing forces you to understand, and the archive becomes a portfolio that recruiters and future you can search.","Keep a brag document: a running list of what you shipped, the impact in numbers and links to proof. It feeds your resume, your performance reviews and your answers to behavioral interview questions."],"callout":["Intuition","A hiring manager spends a minute or two on your GitHub. Pin your best three repos, put the demo link and a one-line summary at the top of each README, and make sure they run."],"lectures":[{"t":"Learn in Public: Personal Branding & Career Marketing for Developers","u":"https://www.youtube.com/watch?v=tkBCPqWKCL8","by":"Shawn swyx Wang (DataTalksClub)"},{"t":"So you want to be a wizard","u":"https://www.youtube.com/watch?v=zUihajla2SE","by":"Julia Evans (Montreal-Python)"},{"t":"Complete Guide to Open Source - How to Contribute","u":"https://www.youtube.com/watch?v=yzeVMecydCE","by":"freeCodeCamp.org"}],"papers":[{"t":"How to Contribute to Open Source","u":"https://opensource.guide/how-to-contribute/","by":"GitHub Open Source Guides"},{"t":"Resume guide for software engineers","u":"https://www.techinterviewhandbook.org/resume/","by":"Tech Interview Handbook (Yangshun Tay)"}],"reads":[{"t":"Learn In Public","u":"https://www.swyx.io/learn-in-public","by":"swyx"},{"t":"Some tactics for writing in public","u":"https://jvns.ca/blog/2023/08/07/tactics-for-writing-in-public/","by":"Julia Evans"},{"t":"Get your work recognized: write a brag document","u":"https://jvns.ca/blog/brag-documents/","by":"Julia Evans"}],"projects":[{"n":"Three-project portfolio","l":"Intermediate","d":"Ship 3 projects (for example a backend API, an LLM app and a data or ML tool), each deployed with a README, demo GIF, architecture diagram and tests. Ask two engineers to try them cold and record where they got stuck."},{"n":"12 weeks in public","l":"Beginner","d":"Land 5 merged PRs in open-source projects you use (start with docs or tests via goodfirstissue.dev) and publish one short post per week for 12 weeks. Track merges, review rounds and which posts got read or shared."}],"repos":[{"r":"firstcontributions/first-contributions","d":"Hands-on walkthrough for making your first pull request"},{"r":"MunGell/awesome-for-beginners","d":"Projects with beginner-friendly issues, by language"},{"r":"github/opensource.guide","d":"Source of GitHub's Open Source Guides"}]},{"id":"car_coding","title":"Coding interviews: data structures & algorithm patterns","short":"Coding interviews","level":"Intermediate","why":"Most engineering hiring loops still include algorithm rounds, and pattern-based practice gets you ready in weeks rather than years.","mins":3600,"pre":["dsa","lang"],"ideas":["Most problems reduce to about 15 patterns: two pointers, sliding window, hash map counting, binary search on the answer, BFS and DFS, topological sort, heap for top-k, intervals, backtracking, union-find, monotonic stack and dynamic programming. Learn the pattern, then do 5 to 10 problems each.","Use the input constraints to guess the target complexity. n up to 10^5 usually needs O(n log n) or better, n up to 20 allows O(2^n) backtracking, and a sorted input hints at binary search or two pointers.","Run the interview like a conversation: restate the problem, ask about edge cases, state a brute force and its complexity, improve it, then code it cleanly and test it by hand on a small example. Silence for 10 minutes is the most common way to fail.","Timebox practice. If stuck after 20 to 25 minutes, read the solution, write down the key insight, and redo the problem from scratch 3 days later and again a week later. Spaced repetition beats grinding new problems."],"callout":["Pitfall","Counting solved problems is a poor measure. Being able to solve a new medium in 25 minutes while talking is what matters, so track that with timed mock sessions."],"lectures":[{"t":"How I Got Good at Coding Interviews","u":"https://www.youtube.com/watch?v=SVvr3ZjtjI8","by":"NeetCode"},{"t":"LeetCode Was Hard Until I Learned THESE 8 Patterns (With Templates!)","u":"https://www.youtube.com/watch?v=RYT08CaYq6A","by":"AlgoMonster"},{"t":"Python for Coding Interviews - Everything you need to Know","u":"https://www.youtube.com/watch?v=0K_eZGS5NsU","by":"NeetCode"}],"papers":[{"t":"Coding interview prep guide","u":"https://www.techinterviewhandbook.org/coding-interview-prep/","by":"Tech Interview Handbook (Yangshun Tay)"},{"t":"NeetCode Roadmap","u":"https://neetcode.io/roadmap","by":"NeetCode"},{"t":"Grind 75: a better Blind 75 study plan","u":"https://www.techinterviewhandbook.org/grind75","by":"Yangshun Tay"}],"reads":[{"t":"LeetCode Patterns","u":"https://seanprashad.com/leetcode-patterns/","by":"Sean Prashad"},{"t":"Algorithm flowchart: which pattern fits this problem","u":"https://algo.monster/flowchart","by":"AlgoMonster"},{"t":"Algorithms interviews: theory vs. practice","u":"https://danluu.com/algorithms-interviews/","by":"Dan Luu"}],"projects":[{"n":"12-week DSA plan","l":"Intermediate","d":"Follow Grind 75 or the NeetCode roadmap over 12 weeks at about 8 problems a week, logging each problem's pattern, time taken and whether you needed a hint. By week 12 you should solve unseen mediums in under 25 minutes at least 70% of the time."},{"n":"Pattern template library","l":"Beginner","d":"Write your own clean Python template and 2 worked examples for each of 15 patterns, with tests, in one repo. Redo every problem you failed after 3 and 10 days and track your re-solve rate."}],"repos":[{"r":"yangshun/tech-interview-handbook","d":"Free interview prep: study plans, cheatsheets and behavioral guides"},{"r":"seanprashad/leetcode-patterns","d":"LeetCode problems grouped by pattern"},{"r":"jwasham/coding-interview-university","d":"Multi-month CS study plan for interviews"}]},{"id":"car_sysdesign","title":"System design interviews","short":"Sys design interv.","level":"Intermediate","why":"System design interviews test whether you can turn a vague product into a working, scalable architecture and explain the trade-offs out loud.","mins":3000,"pre":["sysdesign","caching","replication","lb","queues"],"ideas":["Use a fixed structure for 45 minutes: functional and non-functional requirements (5 min), core entities and API (5 min), a simple high-level design that works (10 to 15 min), then deep dives on the hardest requirements (15 min). Interviewers grade the path as much as the answer.","Get a working design first, then scale it. A single service and database that meets every functional requirement is a better base than a diagram of 12 boxes you cannot justify.","Estimate only when it changes a decision. 100 million daily users doing 10 reads a day is about 12,000 reads per second on average, which tells you if one database is enough or if you need caching or sharding.","Deep dives are where seniority shows. Name the bottleneck, offer two options (for example a cache versus a read replica, or optimistic versus pessimistic locking), state the trade-off, and pick one with a reason."],"callout":["Pitfall","Reciting a memorized design for 'Design Twitter' falls apart at the first follow-up. Learn about 15 core building blocks and patterns well, and practice applying them to new problems out loud."],"lectures":[{"t":"System Design Interview: A Step-By-Step Guide","u":"https://www.youtube.com/watch?v=i7twT3x5yv8","by":"ByteByteGo"},{"t":"System Design Interview: Design Ticketmaster w/ a Ex-Meta Staff Engineer","u":"https://www.youtube.com/watch?v=fhdPyoO6aXI","by":"Hello Interview"},{"t":"Back-Of-The-Envelope Estimation / Capacity Planning","u":"https://www.youtube.com/watch?v=UC5xf8FbdJc","by":"ByteByteGo"}],"papers":[{"t":"The System Design Primer","u":"https://github.com/donnemartin/system-design-primer","by":"Donne Martin"},{"t":"System Design in a Hurry","u":"https://www.hellointerview.com/learn/system-design/in-a-hurry/introduction","by":"Hello Interview"},{"t":"A Framework for System Design Interviews (free chapter)","u":"https://bytebytego.com/courses/system-design-interview/a-framework-for-system-design-interviews","by":"Alex Xu (ByteByteGo)"}],"reads":[{"t":"Delivery framework for system design interviews","u":"https://www.hellointerview.com/learn/system-design/in-a-hurry/delivery","by":"Hello Interview"},{"t":"Numbers to know for system design","u":"https://www.hellointerview.com/learn/system-design/core-concepts/numbers-to-know","by":"Hello Interview"},{"t":"System design interview guide","u":"https://www.techinterviewhandbook.org/system-design/","by":"Tech Interview Handbook"}],"projects":[{"n":"20 mock designs","l":"Intermediate","d":"Do 20 timed 45-minute designs (URL shortener, chat, news feed, Ticketmaster, rate limiter, web crawler and so on) on Excalidraw, recording yourself. After each, compare with a reference solution and log what you missed in a mistakes table."},{"n":"Build one design for real","l":"Advanced","d":"Implement a small version of one design, such as a URL shortener with a cache and a load test. Measure p50 and p99 latency and throughput as you add Redis and a read replica, and check your back-of-the-envelope numbers against the results."}],"repos":[{"r":"donnemartin/system-design-primer","d":"Classic guide to scalable system design with interview practice"},{"r":"ByteByteGoHq/system-design-101","d":"Visual explanations of system design concepts"},{"r":"karanpratapsingh/system-design","d":"Free system design course covering fundamentals and case studies"}]},{"id":"car_ai_int","title":"AI engineering interviews & take-home projects","short":"AI eng interviews","level":"Intermediate","why":"AI engineering roles add LLM system design, ML fundamentals and practical take-homes to the usual loop, and they reward people who have shipped and evaluated real LLM features.","mins":1800,"pre":["llmapi","rag","agents","evals","costlat"],"ideas":["Expect four kinds of rounds: ML and LLM fundamentals (tokenization, attention, fine-tuning versus prompting), LLM system design (a RAG assistant, an agent, a moderation pipeline), a practical coding or take-home round, and behavioral questions about things you shipped.","In LLM system design, cover the parts beyond the model call: data ingestion and chunking, retrieval and reranking, prompt and output format, guardrails, an evaluation set with metrics, latency and cost budgets, and a feedback loop from production.","Evaluation is the strongest signal of seniority. Say how you would build a test set, which failures you would look for by reading real outputs, which metrics are automated and which need humans or an LLM judge, and how you would catch regressions.","For a take-home, scope down and ship something that runs with one command. Include a README with assumptions, a small eval with numbers, known failure cases and what you would do with more time. A tested, honest small solution beats an ambitious broken one."],"callout":["Pitfall","Candidates often describe a pipeline as if the model always works. Interviewers want to hear how it fails (hallucination, bad retrieval, prompt injection, cost spikes) and how you would detect each one."],"lectures":[{"t":"How to Design ChatGPT","u":"https://www.youtube.com/watch?v=KDLfKu1Pgag","by":"Hello Interview"},{"t":"Full ML Design Mock by ex-Meta Staff Engineer (with feedback)","u":"https://www.youtube.com/watch?v=9U48NlbOzCU","by":"MLEpath"},{"t":"ML Coding Interviews Explained","u":"https://www.youtube.com/watch?v=whUAQe5nhmc","by":"Exponent"}],"papers":[{"t":"Introduction to Machine Learning Interviews (free book)","u":"https://huyenchip.com/ml-interviews-book/","by":"Chip Huyen"},{"t":"ML System Design in a Hurry","u":"https://www.hellointerview.com/learn/ml-system-design/in-a-hurry/introduction","by":"Hello Interview"},{"t":"Building effective agents","u":"https://www.anthropic.com/engineering/building-effective-agents","by":"Anthropic Engineering"}],"reads":[{"t":"Patterns for Building LLM-based Systems & Products","u":"https://eugeneyan.com/writing/llm-patterns/","by":"Eugene Yan"},{"t":"Your AI Product Needs Evals","u":"https://hamel.dev/blog/posts/evals/","by":"Hamel Husain"},{"t":"The Rise of the AI Engineer","u":"https://www.latent.space/p/ai-engineer","by":"swyx (Latent Space)"}],"projects":[{"n":"Mock take-home in 6 hours","l":"Intermediate","d":"Give yourself a 6-hour limit to build a RAG question-answering service over a public docs site, with a 50-question eval set, retrieval and answer metrics, and a README of failure cases. Repeat with a different dataset and compare scores and time spent."},{"n":"LLM design question bank","l":"Advanced","d":"Write up 10 LLM system designs (support bot, code review agent, semantic search, content moderation, meeting summarizer and others) with diagrams, eval plans and cost estimates per 1,000 requests. Do 3 of them as recorded 45-minute mocks with a peer."}],"repos":[{"r":"chiphuyen/ml-interviews-book","d":"Source and questions for Chip Huyen's ML interviews book"},{"r":"alirezadir/Machine-Learning-Interviews","d":"Guide to ML and ML system design interviews"},{"r":"chiphuyen/aie-book","d":"Resources accompanying the AI Engineering book"}]}]},{"id":"sysdeep","title":"Systems under the hood","level":"Advanced","intro":"The internals that never go out of date: how computers, compilers, databases, networks and GPUs actually work, by building them.","phase":10,"optional":true,"topics":[{"id":"sys_nand","title":"From logic gates to a computer: architecture under the hood","short":"Gates to computer","level":"Advanced","why":"Knowing how gates become a CPU, and how pipelines and caches really behave, lets you predict why some code is fast and other code is slow.","mins":3600,"pre":["howcomp","os"],"ideas":["Every chip can be built from one gate. NAND gives you NOT, AND and OR, those give you adders and multiplexers, and a flip-flop added to them gives you memory. A CPU is these parts wired to a clock.","A CPU runs a loop: fetch an instruction, decode it, read registers, compute in the ALU, write the result back. Pipelining overlaps these stages for different instructions, so a new one can finish every cycle even though each takes several.","Pipelines stall on hazards. A branch the CPU guesses wrong throws away the work in flight, and an instruction that needs a value not yet computed has to wait. Branch predictors and out-of-order execution exist to keep the pipeline full.","Main memory is about 100 times slower than an L1 cache hit. Caches load memory in 64-byte lines, so code that walks memory in order is fast and code that jumps around misses the cache on almost every access."],"callout":["Intuition","Count cache misses before you count instructions. A loop that does twice the arithmetic but walks an array in order often beats a 'smarter' loop that chases pointers."],"lectures":[{"t":"Building an 8-bit breadboard computer (full series)","u":"https://www.youtube.com/playlist?list=PLowKtXNTBypGqImE405J2565dvjafglHU","by":"Ben Eater"},{"t":"Digital Design and Computer Architecture, ETH Z\u00fcrich Spring 2025 (full course)","u":"https://www.youtube.com/playlist?list=PL5Q2soXY2Zi9Eo29LMgKVcaydS7V1zZW3","by":"Onur Mutlu Lectures"},{"t":"The self-organizing computer course","u":"https://www.youtube.com/watch?v=iE7YRHxwoDs","by":"Shimon Schocken, TED"}],"papers":[{"t":"Nand2Tetris course: book chapters, project specs and tools","u":"https://www.nand2tetris.org/course","by":"Noam Nisan & Shimon Schocken"},{"t":"Computer Systems: A Programmer's Perspective (CS:APP) companion site","u":"https://csapp.cs.cmu.edu/","by":"Randal Bryant & David O'Hallaron"},{"t":"CMU 15-213 Introduction to Computer Systems (slides, labs, schedule)","u":"https://www.cs.cmu.edu/~213/","by":"Carnegie Mellon University"},{"t":"What Every Programmer Should Know About Memory","u":"https://people.freebsd.org/~lstewart/articles/cpumemory.pdf","by":"Ulrich Drepper"}],"reads":[{"t":"Modern Microprocessors: A 90-Minute Guide","u":"https://www.lighterra.com/papers/modernmicroprocessors/","by":"Jason Robert Carey Patterson"},{"t":"Gallery of Processor Cache Effects","u":"http://igoro.com/archive/gallery-of-processor-cache-effects/","by":"Igor Ostrovsky"},{"t":"Branch prediction","u":"https://danluu.com/branch-prediction/","by":"Dan Luu"}],"projects":[{"n":"Nand2Tetris projects 1 to 5: gates to a working CPU","l":"Intermediate","d":"Build gates, an ALU, RAM and the Hack CPU in HDL from NAND alone, then run test scripts on each chip. Run a small assembly program on your CPU and trace each fetch-execute cycle."},{"n":"Cache effects benchmark lab","l":"Advanced","d":"Write C programs that sum an array with strides from 1 to 1024 and traverse a matrix by row and by column, and time them across array sizes. Plot the results and find your L1, L2 and L3 sizes from the steps in the curve, then confirm with perf stat cache-miss counts."}],"repos":[{"r":"nand2tetris/web-ide","d":"Official browser IDE and simulators for the Nand2Tetris projects"},{"r":"hneemann/Digital","d":"Visual logic simulator for building and testing CPUs from gates"}]},{"id":"sys_compilers","title":"Compilers & interpreters: how code becomes execution","short":"Compilers","level":"Advanced","why":"Every language you use is a program that reads text and turns it into work, and knowing its stages makes errors, performance and new languages far less mysterious.","mins":3600,"pre":["dsa","lang"],"ideas":["A compiler is a pipeline. The scanner turns characters into tokens, the parser turns tokens into a syntax tree, later passes check and transform that tree, and the last stage emits code for a machine or a virtual machine.","A tree-walking interpreter runs the syntax tree directly by recursing over its nodes. It is simple to write but slow, because every step chases pointers and makes calls through many layers.","A bytecode VM flattens the program into a compact list of instructions and runs it with a loop and a stack. CPython does this: `dis.dis(f)` shows the bytecode, and the interpreter loop pushes and pops values for each opcode.","A JIT watches which code runs hot and what types it sees, then generates machine code specialized for those cases, with a guard that falls back if the guess is wrong. CPython 3.11 added a specializing interpreter that rewrites bytecodes this way, and 3.13 shipped an experimental JIT."],"callout":["Pitfall","Do not start with the parser generator or the optimizer. Write a small hand-written recursive-descent parser and a working interpreter first. Most of the learning is in getting a full pipeline running end to end."],"lectures":[{"t":"Inside CPython 3.11's new specializing, adaptive interpreter","u":"https://www.youtube.com/watch?v=shQtrn1v7sQ","by":"Brandt Bucher, PyCon US"},{"t":"Building a JIT compiler for CPython","u":"https://www.youtube.com/watch?v=kMO3Ju0QCDo","by":"Brandt Bucher, PyCon US"},{"t":"See CPython run: Getting to know your Python interpreter","u":"https://www.youtube.com/watch?v=tzYhv61piNY","by":"James Bennett, North Bay Python 2019"}],"papers":[{"t":"Crafting Interpreters (free online book)","u":"https://craftinginterpreters.com/","by":"Robert Nystrom"},{"t":"CS143 Compilers (course site)","u":"https://web.stanford.edu/class/cs143/","by":"Stanford University"},{"t":"dis: Disassembler for Python bytecode","u":"https://docs.python.org/3/library/dis.html","by":"Python documentation"},{"t":"PEP 659: Specializing Adaptive Interpreter","u":"https://peps.python.org/pep-0659/","by":"Mark Shannon"}],"reads":[{"t":"A Python Interpreter Written in Python","u":"https://aosabook.org/en/500L/a-python-interpreter-written-in-python.html","by":"Allison Kaptur, 500 Lines or Less"},{"t":"Adventures in JIT compilation, part 1: an interpreter","u":"https://eli.thegreenplace.net/2017/adventures-in-jit-compilation-part-1-an-interpreter/","by":"Eli Bendersky"},{"t":"Compiling a Lisp (series)","u":"https://bernsteinbear.com/blog/compiling-a-lisp-0/","by":"Max Bernstein"}],"projects":[{"n":"Lox, both ways","l":"Intermediate","d":"Follow Crafting Interpreters to build the tree-walking interpreter, then the bytecode VM. Run the same fib(30) benchmark on both and measure the speedup the VM gives you."},{"n":"Read CPython's bytecode and specialization","l":"Advanced","d":"Disassemble a hot loop with `dis.dis(f, adaptive=True)` before and after it warms up, and record which opcodes become specialized. Then write a tiny stack VM in Python that runs a subset of those opcodes for simple functions."}],"repos":[{"r":"munificent/craftinginterpreters","d":"Source for the book, with the full jlox and clox implementations"},{"r":"rui314/chibicc","d":"Small C compiler built in small, readable commits"},{"r":"python/cpython","d":"Read Python/bytecodes.c and the InternalDocs folder"}]},{"id":"sys_netinternals","title":"Networking from scratch: implementing TCP/IP","short":"TCP/IP by hand","level":"Advanced","why":"Implementing the protocols yourself shows what a socket really promises, which makes timeouts, slow connections and odd production failures much easier to reason about.","mins":3600,"pre":["internet","os","concur"],"ideas":["Each layer wraps the one above in a header. An Ethernet frame carries an IP packet, which carries a TCP segment, which carries your bytes. ARP maps an IP address to the MAC address the frame needs on the local network.","IP only delivers packets on a best-effort basis. Packets can be lost, duplicated or reordered, and nothing at that layer fixes it.","TCP builds a reliable byte stream on top. Sequence numbers order the bytes, acknowledgements confirm them, timers resend what was lost, and the three-way handshake agrees on starting sequence numbers. Flow control stops a fast sender from overrunning the receiver's buffer.","On Linux a TUN or TAP device hands raw packets to a user program, so you can write your own stack and talk to the real kernel. Wireshark or tcpdump shows every byte, which is the main way to debug it."],"callout":["Pitfall","TCP is a byte stream, not a message stream. One send can arrive as several reads, and several sends can arrive in one, so every protocol on top of it needs its own framing."],"lectures":[{"t":"Networking tutorial (full series)","u":"https://www.youtube.com/playlist?list=PLowKtXNTBypH19whXTVoG3oKSuOcw_XeW","by":"Ben Eater"},{"t":"Implementing TCP in Rust (part 1)","u":"https://www.youtube.com/watch?v=bzja9fQWzdA","by":"Jon Gjengset"}],"papers":[{"t":"Beej's Guide to Network Programming","u":"https://beej.us/guide/bgnet/","by":"Brian \"Beej\" Hall"},{"t":"RFC 9293: Transmission Control Protocol","u":"https://www.rfc-editor.org/rfc/rfc9293","by":"IETF, 2022"},{"t":"RFC 791: Internet Protocol","u":"https://www.rfc-editor.org/rfc/rfc791","by":"IETF, 1981"},{"t":"CS 144: Introduction to Computer Networking (labs)","u":"https://cs144.github.io/","by":"Stanford University"}],"reads":[{"t":"What happens if you write a TCP stack in Python?","u":"https://jvns.ca/blog/2014/08/12/what-happens-if-you-write-a-tcp-stack-in-python/","by":"Julia Evans"},{"t":"Building Blocks of TCP","u":"https://hpbn.co/building-blocks-of-tcp/","by":"Ilya Grigorik, High Performance Browser Networking"},{"t":"Implement DNS in a weekend","u":"https://implement-dns.wizardzines.com/","by":"Julia Evans"}],"projects":[{"n":"Ping and ARP over a TAP device","l":"Intermediate","d":"Open a Linux TAP device, parse Ethernet frames, answer ARP requests and reply to ICMP echo. Run ping against your stack and watch the exchange in Wireshark."},{"n":"Minimal TCP with the CS 144 labs","l":"Advanced","d":"Work through the CS 144 labs to build a byte stream, reassembler, TCP receiver and sender. Then add random packet loss with tc netem and measure how throughput falls as the loss rate rises."}],"repos":[{"r":"saminiir/level-ip","d":"Userspace TCP/IP stack in C; its README links the 'Let's code a TCP/IP stack' series"},{"r":"jonhoo/rust-tcp","d":"TCP implementation in Rust from the live-coding stream"}]},{"id":"sys_buildyourown","title":"Build your own: database, Redis, Git, HTTP server from scratch","short":"Build your own X","level":"Advanced","why":"Rebuilding tools you use every day, in small working versions, is the fastest way to understand what they guarantee and where they break.","mins":3600,"pre":["dsa","indexes","cli"],"ideas":["A database is a file format plus rules for changing it safely. Rows live in fixed-size pages, a B-tree keeps keys sorted across pages so lookups take a few page reads, and a write-ahead log lets the database recover after a crash.","Redis is a single-threaded event loop over a hash table. It reads commands in the RESP protocol, which is plain text with length prefixes, and it serves many clients at once by waiting on all their sockets with epoll and handling whichever are ready.","Git is a content-addressed store. Every file, directory and commit is an object named by the hash of its contents, so identical content is stored once, and a branch is just a file holding one commit hash.","An HTTP server reads bytes from a TCP socket, parses a request line and headers, finds a handler and writes back a status line, headers and a body. Keep-alive, timeouts and request size limits are what turn a toy into something safe to expose."],"callout":["Intuition","Pick the smallest version that works end to end, then add one guarantee at a time: persistence, then crash safety, then concurrency. Each step shows you why the real tool is built the way it is."],"lectures":[{"t":"CMU Intro to Database Systems 15-445/645, Fall 2025 (full course)","u":"https://www.youtube.com/playlist?list=PLSE8ODhjZXjYMAgsGH-GtY5rJYZ6zjsd5","by":"Andy Pavlo, CMU Database Group"},{"t":"Git From the Bits Up","u":"https://www.youtube.com/watch?v=MYP56QJpDr4","by":"Tim Berglund, InfoQ"}],"papers":[{"t":"Build Your Own Redis / Build Your Own Database From Scratch","u":"https://build-your-own.org/","by":"James Smith"},{"t":"Let's Build a Simple Database (SQLite clone in C)","u":"https://cstack.github.io/db_tutorial/","by":"Connor Stack"},{"t":"Redis serialization protocol (RESP) specification","u":"https://redis.io/docs/latest/develop/reference/protocol-spec/","by":"Redis"},{"t":"Pro Git, chapter 10: Git Internals","u":"https://git-scm.com/book/en/v2/Git-Internals-Plumbing-and-Porcelain","by":"Scott Chacon & Ben Straub"}],"reads":[{"t":"Write yourself a Git!","u":"https://wyag.thb.lt/","by":"Thibault Polge"},{"t":"pygit: Just enough of a Git client to create a repo, commit, and push itself to GitHub","u":"https://benhoyt.com/writings/pygit/","by":"Ben Hoyt"},{"t":"Database File Format","u":"https://www.sqlite.org/fileformat.html","by":"SQLite"}],"projects":[{"n":"Redis clone that real clients can talk to","l":"Intermediate","d":"Build a server that speaks RESP and supports PING, ECHO, SET with expiry and GET, serving many clients from one event loop. Test it with redis-cli and redis-benchmark and compare its ops per second with real Redis."},{"n":"Key-value store with a B-tree and a write-ahead log","l":"Advanced","d":"Store keys in a page-based B-tree file and log each write before applying it. Kill the process with SIGKILL in the middle of a write loop and check that every acknowledged write is there after restart."}],"repos":[{"r":"codecrafters-io/build-your-own-x","d":"Curated list of build-it-from-scratch tutorials for databases, Git, Redis, servers and more"},{"r":"cstack/db_tutorial","d":"Source and tests for the SQLite clone tutorial"},{"r":"thblt/write-yourself-a-git","d":"Source of Write yourself a Git, a literate Python implementation"}]},{"id":"sys_gpu","title":"GPU programming: CUDA, kernels and why AI is fast","short":"GPU programming","level":"Advanced","why":"Modern AI runs on GPUs, and knowing how kernels use threads and memory explains why some models are fast, why others stall, and how to fix it.","mins":3600,"pre":["howcomp","pyml"],"ideas":["A GPU runs thousands of threads in groups of 32 called warps. Threads are organized into blocks, each block runs on one streaming multiprocessor, and all threads in a warp execute the same instruction at once.","Most kernels are limited by memory, not math. Reading from global memory is slow, so fast kernels load a tile into fast on-chip shared memory once and reuse it many times. Arithmetic intensity, the FLOPs done per byte read, tells you which limit you hit.","Coalescing matters. When the 32 threads in a warp read 32 neighbouring values, the hardware merges them into a few wide transactions. Scattered reads turn into many slow ones.","Fusing operations saves memory trips. Running softmax, scaling and masking in one kernel instead of three avoids writing and rereading the tensor each time. FlashAttention and torch.compile get much of their speed this way, and Triton lets you write fused kernels in Python."],"callout":["Pitfall","Do not guess where time goes. Profile first with the PyTorch profiler or Nsight Compute, and check whether a kernel is memory-bound or compute-bound before you rewrite it."],"lectures":[{"t":"Lecture 1: How to profile CUDA kernels in PyTorch","u":"https://www.youtube.com/watch?v=LuhJEEJQgUM","by":"GPU MODE"},{"t":"Lecture 2: Ch1-3 PMPP book","u":"https://www.youtube.com/watch?v=NQ-0D5Ti2dc","by":"GPU MODE"},{"t":"Lecture 3: Getting Started With CUDA for Python Programmers","u":"https://www.youtube.com/watch?v=4sgKnKbR-WE","by":"Jeremy Howard, GPU MODE"}],"papers":[{"t":"CUDA Programming Guide","u":"https://docs.nvidia.com/cuda/cuda-programming-guide/","by":"NVIDIA"},{"t":"Triton tutorials (vector add, fused softmax, matmul, attention)","u":"https://triton-lang.org/main/getting-started/tutorials/index.html","by":"OpenAI / Triton"},{"t":"FlashAttention: Fast and Memory-Efficient Exact Attention with IO-Awareness","u":"https://arxiv.org/abs/2205.14135","by":"Tri Dao et al., 2022"},{"t":"Triton: An Intermediate Language and Compiler for Tiled Neural Network Computations","u":"https://www.eecs.harvard.edu/~htk/publication/2019-mapl-tillet-kung-cox.pdf","by":"Philippe Tillet, H. T. Kung & David Cox, MAPL 2019"}],"reads":[{"t":"Making Deep Learning Go Brrrr From First Principles","u":"https://horace.io/brrr_intro.html","by":"Horace He"},{"t":"How to Optimize a CUDA Matmul Kernel for cuBLAS-like Performance","u":"https://siboehm.com/articles/22/CUDA-MMM","by":"Simon Boehm"},{"t":"GPU Glossary","u":"https://modal.com/gpu-glossary","by":"Modal"}],"projects":[{"n":"Matmul from naive to tiled","l":"Advanced","d":"Write a CUDA (or Triton) matrix multiply, then add coalesced loads, shared-memory tiling and register blocking one step at a time. Measure GFLOPS at each step and compare against cuBLAS via torch.matmul."},{"n":"Fused softmax in Triton","l":"Intermediate","d":"Write a Triton kernel that does a row-wise softmax in one pass and check it against torch.softmax. Measure memory bandwidth achieved versus the unfused PyTorch version across row lengths."}],"repos":[{"r":"gpu-mode/lectures","d":"Notebooks and code for the GPU MODE lecture series"},{"r":"siboehm/SGEMM_CUDA","d":"Step-by-step CUDA matmul kernels from the blog post"},{"r":"srush/GPU-Puzzles","d":"Short puzzles that teach CUDA thinking in Python with Numba"}]}]},{"id":"math","title":"Mathematical foundations","level":"Beginner","intro":"The three pieces of math every later chapter leans on. Learn them visually first; rigor can come later.","phase":10,"optional":true,"topics":[{"id":"linalg","title":"Linear algebra","level":"Beginner","why":"Vectors, matrices and transformations are the language every model is written in.","lectures":[{"t":"Essence of Linear Algebra (full series)","u":"https://www.youtube.com/playlist?list=PLZHQObOWTQDPD3MizzM2xVFitgF8hE_ab","by":"3Blue1Brown"},{"t":"MIT 18.06 Linear Algebra","u":"https://www.youtube.com/playlist?list=PLE7DDD91010BC51F8","by":"Gilbert Strang, MIT OpenCourseWare"}],"papers":[{"t":"Mathematics for Machine Learning (free book)","u":"https://mml-book.github.io/","by":"Deisenroth, Faisal, Ong"},{"t":"The Matrix Calculus You Need for Deep Learning","u":"https://arxiv.org/abs/1802.01528","by":"Parr & Howard"}],"reads":[{"t":"Eigenvectors and Eigenvalues, explained visually","u":"https://setosa.io/ev/eigenvectors-and-eigenvalues/","by":"Setosa"},{"t":"Immersive Linear Algebra (interactive book)","u":"https://immersivemath.com/ila/index.html","by":"Str\u00f6m, \u00c5str\u00f6m, Akenine-M\u00f6ller"},{"t":"Matrix calculus, the explained.ai version","u":"https://explained.ai/matrix-calculus/","by":"Terence Parr"}],"mins":360,"pre":[],"ideas":["A vector is a list of numbers and also an arrow in space; a dataset is a stack of vectors.","A matrix is a function that transforms space. Multiplying matrices composes those transformations.","The dot product measures how aligned two vectors are. Attention, similarity search and linear layers are all dot products.","Eigenvectors are directions a matrix only stretches. They power PCA and help explain training dynamics."],"callout":["Intuition","Every layer of a neural network is a matrix multiply followed by a squiggle. If you can picture what a matrix does to space, you can picture what a layer does to data."],"projects":[{"n":"Matrix playground","l":"Beginner","d":"Write matrix multiply, transpose and a 2D transform visualizer in NumPy. Plot a grid before and after each transform."},{"n":"Image compression with SVD","l":"Beginner","d":"Compress a photo by keeping only the top-k singular values, and plot quality against k."}],"repos":[{"r":"fastai/numerical-linear-algebra","d":"Free course notebooks on applied linear algebra"},{"r":"3b1b/manim","d":"The animation engine behind 3Blue1Brown's videos"}],"short":"Linear algebra"},{"id":"calc","title":"Calculus & gradients","level":"Beginner","why":"Learning = following the gradient downhill. This is where that idea comes from.","lectures":[{"t":"Essence of Calculus (full series)","u":"https://www.youtube.com/playlist?list=PLZHQObOWTQDMsr9K-rj53DwVRMYO3t5Yr","by":"3Blue1Brown"},{"t":"The spelled-out intro to neural networks and backpropagation (micrograd)","u":"https://www.youtube.com/watch?v=VMj-3S1tku0","by":"Andrej Karpathy"}],"papers":[{"t":"Automatic Differentiation in Machine Learning: a Survey","u":"https://arxiv.org/abs/1502.05767","by":"Baydin et al."}],"reads":[{"t":"Calculus on Computational Graphs: Backpropagation","u":"https://colah.github.io/posts/2015-08-Backprop/","by":"Chris Olah"},{"t":"Yes you should understand backprop","u":"https://karpathy.medium.com/yes-you-should-understand-backprop-e2f06eab496b","by":"Andrej Karpathy"}],"mins":270,"pre":["linalg"],"ideas":["A derivative says how much the output moves when you nudge the input.","A gradient is the vector of all partial derivatives. It points uphill, so training steps the other way.","The chain rule lets you differentiate a long composition one link at a time. That is backpropagation.","Autodiff builds a graph of operations and applies the chain rule automatically."],"callout":["Pitfall","Don't memorize derivative tables. Learn to check any gradient numerically with (f(x+h) \u2212 f(x\u2212h)) / 2h. It catches most bugs."],"projects":[{"n":"Gradient checker","l":"Beginner","d":"Implement numerical gradients and compare them to hand-derived ones for five functions."},{"n":"Gradient descent visualizer","l":"Beginner","d":"Animate gradient descent on a 2D bowl and on the Rosenbrock function, with different learning rates."}],"repos":[{"r":"karpathy/micrograd","d":"A tiny autograd engine in about 100 lines"},{"r":"HIPS/autograd","d":"Automatic differentiation for NumPy code"}],"short":"Calculus"},{"id":"prob","title":"Probability, statistics & information","level":"Beginner","why":"Models output probabilities and losses are measured in bits. You need the vocabulary.","lectures":[{"t":"Statistics 110: Probability (full course)","u":"https://www.youtube.com/playlist?list=PL2SOU6wwxB0uwwH80KTQ6ht66KWxbzTIo","by":"Joe Blitzstein, Harvard"},{"t":"Bayes theorem, the geometry of changing beliefs","u":"https://www.youtube.com/watch?v=HZGCoVF3YvM","by":"3Blue1Brown"}],"papers":[{"t":"A Mathematical Theory of Communication (1948)","u":"https://people.math.harvard.edu/~ctm/home/text/others/shannon/entropy/entropy.pdf","by":"Claude Shannon"}],"reads":[{"t":"Seeing Theory (interactive probability)","u":"https://seeing-theory.brown.edu/","by":"Brown University"},{"t":"Visual Information Theory","u":"https://colah.github.io/posts/2015-09-Visual-Information/","by":"Chris Olah"}],"mins":360,"pre":[],"ideas":["Probability distributions describe uncertainty. Models output distributions, not single answers.","Bayes' rule updates beliefs with evidence. It is the logic behind many ML methods.","Expectation and variance summarize a distribution. Bias and variance in ML come from here.","Entropy and cross-entropy measure surprise in bits. Cross-entropy is the loss nearly every classifier and LLM minimizes."],"callout":["Intuition","Training a language model with cross-entropy means making the true next token as unsurprising as possible."],"projects":[{"n":"Monte Carlo simulator","l":"Beginner","d":"Estimate \u03c0, simulate the Monty Hall problem, and watch the law of large numbers converge."},{"n":"Naive Bayes spam filter","l":"Beginner","d":"Build a spam classifier from word counts using only Bayes' rule."}],"repos":[{"r":"CamDavidsonPilon/Probabilistic-Programming-and-Bayesian-Methods-for-Hackers","d":"Bayesian methods taught through code"}],"short":"Probability"}]},{"id":"classic","title":"Classical machine learning","level":"Beginner","intro":"Before deep learning: the ideas of fitting, generalizing and evaluating. Still what wins on most tabular data.","phase":10,"optional":true,"topics":[{"id":"linreg","title":"Linear regression & gradient descent","level":"Beginner","why":"The simplest model that learns. Every neural net is a bigger version of this loop.","lectures":[{"t":"CS229 Lecture 2: Linear Regression and Gradient Descent","u":"https://www.youtube.com/watch?v=4b4MUYve_U8","by":"Andrew Ng, Stanford"},{"t":"Linear Regression, Clearly Explained","u":"https://www.youtube.com/watch?v=nk2CQITm_eo","by":"StatQuest"},{"t":"Gradient Descent, Step-by-Step","u":"https://www.youtube.com/watch?v=sDv4f4s2SB8","by":"StatQuest"}],"papers":[{"t":"A Few Useful Things to Know About Machine Learning","u":"https://homes.cs.washington.edu/~pedrod/papers/cacm12.pdf","by":"Pedro Domingos"},{"t":"Statistical Modeling: The Two Cultures","u":"https://projecteuclid.org/journals/statistical-science/volume-16/issue-3/Statistical-Modeling--The-Two-Cultures-with-comments-and-a/10.1214/ss/1009213726.full","by":"Leo Breiman"}],"reads":[{"t":"A Visual Introduction to Machine Learning","u":"https://r2d3.us/visual-intro-to-machine-learning-part-1/","by":"R2D3"},{"t":"Linear Regression (interactive)","u":"https://mlu-explain.github.io/linear-regression/","by":"Amazon MLU-Explain"}],"mins":270,"pre":["calc","prob","pyml"],"ideas":["A model is a function with adjustable parameters. Linear regression is the simplest one: y = wx + b.","A loss function scores how wrong the predictions are. Mean squared error is the classic choice.","Gradient descent repeatedly nudges the parameters to reduce the loss.","Train, validation and test splits keep you honest about how well the model really works."],"callout":["Intuition","Every model you meet later, including GPT, trains with this same loop: predict, measure the loss, compute gradients, update."],"projects":[{"n":"Linear regression from scratch","l":"Beginner","d":"Implement gradient descent in NumPy on a housing dataset, then compare against scikit-learn."},{"n":"Learning-rate experiment","l":"Beginner","d":"Plot loss curves for 5 learning rates and find the point where training diverges."}],"repos":[{"r":"scikit-learn/scikit-learn","d":"The standard library for classical ML"},{"r":"ageron/handson-ml3","d":"Notebooks for Hands-On Machine Learning"}],"short":"Linear regression"},{"id":"logreg","title":"Classification & evaluation metrics","level":"Beginner","why":"How a model says yes or no, and how you know whether it is any good.","lectures":[{"t":"Logistic Regression","u":"https://www.youtube.com/watch?v=yIYKR4sgzI8","by":"StatQuest"},{"t":"ROC and AUC, Clearly Explained","u":"https://www.youtube.com/watch?v=4jRBRDbJemM","by":"StatQuest"},{"t":"CS229 Lecture 3: Locally Weighted & Logistic Regression","u":"https://www.youtube.com/watch?v=het9HFqo1TQ","by":"Andrew Ng, Stanford"}],"papers":[{"t":"On Discriminative vs. Generative Classifiers","u":"https://papers.nips.cc/paper/2001/hash/7b7a53e239400a13bd6be6c91c4f6c4e-Abstract.html","by":"Ng & Jordan"}],"reads":[{"t":"Logistic Regression (interactive)","u":"https://mlu-explain.github.io/logistic-regression/","by":"Amazon MLU-Explain"},{"t":"Precision & Recall (interactive)","u":"https://mlu-explain.github.io/precision-recall/","by":"Amazon MLU-Explain"},{"t":"ROC & AUC (interactive)","u":"https://mlu-explain.github.io/roc-auc/","by":"Amazon MLU-Explain"}],"mins":270,"pre":["linreg"],"ideas":["Logistic regression squashes a linear score through a sigmoid to get a probability.","Softmax generalizes this to many classes. It is the same output layer LLMs use.","Accuracy can lie on imbalanced data. Use precision, recall, F1 and ROC-AUC.","A confusion matrix shows exactly which mistakes the model makes."],"callout":["Pitfall","With 99% negatives, a model that always says 'no' gets 99% accuracy. Always check the class balance first."],"projects":[{"n":"Fraud detector","l":"Beginner","d":"Train logistic regression on an imbalanced dataset and tune the threshold for recall."},{"n":"Metrics from scratch","l":"Beginner","d":"Implement precision, recall, F1 and ROC-AUC yourself and match scikit-learn's numbers."}],"repos":[{"r":"scikit-learn/scikit-learn","d":"Reference implementations and great docs"},{"r":"rasbt/machine-learning-book","d":"Code for Raschka's Machine Learning with PyTorch and Scikit-Learn"}],"short":"Classification"},{"id":"trees","title":"Decision trees, random forests & boosting","level":"Beginner","why":"The workhorses of real-world tabular ML.","lectures":[{"t":"Decision and Classification Trees","u":"https://www.youtube.com/watch?v=_L39rN6gz7Y","by":"StatQuest"},{"t":"Random Forests Part 1","u":"https://www.youtube.com/watch?v=J4Wdy0Wc_xQ","by":"StatQuest"},{"t":"Gradient Boost Part 1","u":"https://www.youtube.com/watch?v=3CC4N4z3GJc","by":"StatQuest"}],"papers":[{"t":"Random Forests (2001)","u":"https://link.springer.com/article/10.1023/A:1010933404324","by":"Leo Breiman"},{"t":"XGBoost: A Scalable Tree Boosting System","u":"https://arxiv.org/abs/1603.02754","by":"Chen & Guestrin"},{"t":"Why do tree-based models still outperform deep learning on tabular data?","u":"https://arxiv.org/abs/2207.08815","by":"Grinsztajn et al."}],"reads":[{"t":"Decision Trees (interactive)","u":"https://mlu-explain.github.io/decision-tree/","by":"Amazon MLU-Explain"},{"t":"How to explain gradient boosting","u":"https://explained.ai/gradient-boosting/","by":"Parr & Howard"}],"mins":360,"pre":["logreg","datasql"],"ideas":["A decision tree splits the data with yes/no questions chosen to reduce impurity.","Random forests average many decorrelated trees to cut variance.","Boosting adds trees one after another, each fixing the previous errors.","On tabular data, gradient-boosted trees are still very hard to beat."],"callout":["Intuition","Bagging (forests) reduces variance. Boosting reduces bias. The same trade-off appears again in the next topic."],"projects":[{"n":"Decision tree from scratch","l":"Intermediate","d":"Implement a tree with Gini impurity and recursive splitting. Visualize the learned rules."},{"n":"Kaggle tabular baseline","l":"Beginner","d":"Beat a logistic regression baseline with XGBoost on a real Kaggle dataset."}],"repos":[{"r":"dmlc/xgboost","d":"Scalable gradient boosting"},{"r":"microsoft/LightGBM","d":"Fast gradient boosting framework"}],"short":"Trees & boosting"},{"id":"generalize","title":"Overfitting, bias\u2013variance & regularization","level":"Beginner","why":"The central tension of ML: fitting the data versus generalizing beyond it.","lectures":[{"t":"Machine Learning Fundamentals: Bias and Variance","u":"https://www.youtube.com/watch?v=EuBBz3bI-aA","by":"StatQuest"},{"t":"Machine Learning Fundamentals: Cross Validation","u":"https://www.youtube.com/watch?v=fSytzGwwBVw","by":"StatQuest"},{"t":"Regularization Part 1: Ridge Regression","u":"https://www.youtube.com/watch?v=Q81RR3yKn30","by":"StatQuest"}],"papers":[{"t":"Reconciling modern ML practice and the bias-variance trade-off","u":"https://arxiv.org/abs/1812.11118","by":"Belkin et al."},{"t":"Deep Double Descent","u":"https://arxiv.org/abs/1912.02292","by":"Nakkiran et al."}],"reads":[{"t":"The Bias-Variance Tradeoff (interactive)","u":"https://mlu-explain.github.io/bias-variance/","by":"Amazon MLU-Explain"},{"t":"Double Descent (interactive)","u":"https://mlu-explain.github.io/double-descent/","by":"Amazon MLU-Explain"}],"mins":270,"pre":["linreg"],"ideas":["Overfitting means memorizing the training data instead of learning the pattern.","Bias is error from wrong assumptions. Variance is error from sensitivity to the data.","Regularization (L1, L2, dropout, early stopping) trades a little bias for less variance.","Huge models break the classic U-curve. This is called double descent."],"callout":["Pitfall","Never tune hyperparameters on the test set. Once you look at it to make choices, it stops being a test."],"projects":[{"n":"Polynomial overfitting lab","l":"Beginner","d":"Fit polynomials of degree 1\u201320 and plot train vs. validation error."},{"n":"Reproduce double descent","l":"Intermediate","d":"Train random-feature models of growing width and find the second descent."}],"repos":[{"r":"scikit-learn/scikit-learn","d":"Cross-validation and regularized models"}],"short":"Generalization"},{"id":"unsup","title":"Clustering & dimensionality reduction","level":"Beginner","why":"Finding structure without labels, and seeing high-dimensional data.","lectures":[{"t":"Principal Component Analysis, Step-by-Step","u":"https://www.youtube.com/watch?v=FgakZw6K1QQ","by":"StatQuest"},{"t":"K-means clustering","u":"https://www.youtube.com/watch?v=4b5d3muPQmA","by":"StatQuest"}],"papers":[{"t":"Visualizing Data using t-SNE","u":"https://jmlr.org/papers/v9/vandermaaten08a.html","by":"van der Maaten & Hinton"},{"t":"UMAP: Uniform Manifold Approximation and Projection","u":"https://arxiv.org/abs/1802.03426","by":"McInnes et al."}],"reads":[{"t":"How to Use t-SNE Effectively","u":"https://distill.pub/2016/misread-tsne/","by":"Distill"},{"t":"Principal Component Analysis, explained visually","u":"https://setosa.io/ev/principal-component-analysis/","by":"Setosa"}],"mins":270,"pre":["linalg","prob"],"ideas":["Clustering groups similar points without labels. k-means is the classic algorithm.","PCA finds the directions of most variance and projects onto them.","t-SNE and UMAP make 2D maps of high-dimensional data. They keep neighbours close but distort distances.","Embeddings from neural nets are usually explored with these tools."],"callout":["Pitfall","Cluster sizes and gaps in a t-SNE plot are mostly meaningless. Read 'How to Use t-SNE Effectively' before trusting one."],"projects":[{"n":"Customer segmentation","l":"Beginner","d":"Cluster a retail dataset with k-means and describe each segment."},{"n":"MNIST map","l":"Beginner","d":"Compare PCA, t-SNE and UMAP projections of MNIST side by side."}],"repos":[{"r":"lmcinnes/umap","d":"The reference UMAP implementation"}],"short":"Unsupervised"}]},{"id":"nn","title":"Neural networks from scratch","level":"Beginner \u2192 Intermediate","intro":"From one neuron to training deep networks yourself. Build everything here from scratch at least once.","phase":10,"optional":true,"topics":[{"id":"training","title":"Training deep nets: optimizers, init, normalization","level":"Intermediate","why":"The practical tricks that make deep networks actually train.","lectures":[{"t":"Gradient descent, how neural networks learn","u":"https://www.youtube.com/watch?v=IHZwWFHWa-w","by":"3Blue1Brown"},{"t":"Building makemore Part 3: Activations, Gradients, BatchNorm","u":"https://www.youtube.com/watch?v=P6sfmUTpUmc","by":"Andrej Karpathy"},{"t":"Adam Optimization Algorithm","u":"https://www.youtube.com/watch?v=JXQT_vxqwIs","by":"Andrew Ng, DeepLearning.AI"}],"papers":[{"t":"Adam: A Method for Stochastic Optimization","u":"https://arxiv.org/abs/1412.6980","by":"Kingma & Ba"},{"t":"Batch Normalization","u":"https://arxiv.org/abs/1502.03167","by":"Ioffe & Szegedy"},{"t":"Dropout: A Simple Way to Prevent Overfitting","u":"https://jmlr.org/papers/v15/srivastava14a.html","by":"Srivastava et al."},{"t":"Delving Deep into Rectifiers (He init)","u":"https://arxiv.org/abs/1502.01852","by":"He et al."}],"reads":[{"t":"A Recipe for Training Neural Networks","u":"https://karpathy.github.io/2019/04/25/recipe/","by":"Andrej Karpathy"},{"t":"Why Momentum Really Works","u":"https://distill.pub/2017/momentum/","by":"Gabriel Goh, Distill"},{"t":"An overview of gradient descent optimization algorithms","u":"https://www.ruder.io/optimizing-gradient-descent/","by":"Sebastian Ruder"}],"mins":450,"pre":["backprop"],"ideas":["SGD with momentum and Adam are the default optimizers.","Good initialization keeps activations from exploding or vanishing.","Normalization layers (BatchNorm, LayerNorm) make deep nets stable to train.","Learning-rate schedules and warmup matter as much as the architecture."],"callout":["Pitfall","First overfit a single batch. If your model can't drive the loss near zero on 32 examples, the bug is in your code, not your data."],"projects":[{"n":"Optimizer shoot-out","l":"Intermediate","d":"Train the same net with SGD, momentum, RMSProp and Adam and compare their loss curves."},{"n":"Break it on purpose","l":"Intermediate","d":"Remove normalization, use a bad init, and add a huge learning rate. Log what each does to the activations."}],"repos":[{"r":"google-research/tuning_playbook","d":"Google's guide to tuning deep learning models"},{"r":"karpathy/nn-zero-to-hero","d":"Notebooks for the Zero to Hero series"}],"short":"Training"},{"id":"build","title":"Build it yourself: PyTorch & language models from scratch","level":"Intermediate","why":"Writing the code is where understanding becomes real.","lectures":[{"t":"The spelled-out intro to language modeling: makemore","u":"https://www.youtube.com/watch?v=PaCmpygFfXo","by":"Andrej Karpathy"},{"t":"Building makemore Part 2: MLP","u":"https://www.youtube.com/watch?v=TCH_1BHY58I","by":"Andrej Karpathy"},{"t":"Building makemore Part 4: Becoming a Backprop Ninja","u":"https://www.youtube.com/watch?v=q8SA3rM6ckI","by":"Andrej Karpathy"}],"papers":[{"t":"A Neural Probabilistic Language Model (2003)","u":"https://jmlr.org/papers/v3/bengio03a.html","by":"Bengio et al."},{"t":"PyTorch: An Imperative Style, High-Performance Deep Learning Library","u":"https://arxiv.org/abs/1912.01703","by":"Paszke et al."}],"reads":[{"t":"PyTorch: Learn the Basics","u":"https://pytorch.org/tutorials/beginner/basics/intro.html","by":"PyTorch"},{"t":"Understanding Deep Learning (free book, excellent figures)","u":"https://udlbook.github.io/udlbook/","by":"Simon Prince"},{"t":"Dive into Deep Learning (runnable book)","u":"https://d2l.ai/","by":"Zhang, Lipton, Li, Smola"}],"mins":720,"pre":["training","pyml"],"ideas":["PyTorch's core is tensors, autograd, nn.Module and DataLoader.","A training loop is about 20 lines. Know it by heart.","Character-level language models are the gentlest route to modern LLMs.","Reading other people's clean code is a skill. Practise it."],"callout":["Intuition","Finish makemore Parts 1\u20135 and you'll have written a working language model from scratch. Everything in the Transformer chapter will feel familiar."],"projects":[{"n":"Name generator","l":"Intermediate","d":"Follow makemore to build a bigram model, then an MLP that invents new names."},{"n":"Image classifier end-to-end","l":"Beginner","d":"Fine-tune a pretrained ResNet on your own photo categories with fastai or PyTorch."}],"repos":[{"r":"karpathy/makemore","d":"Character-level language models, step by step"},{"r":"d2l-ai/d2l-en","d":"Runnable deep learning book"},{"r":"fastai/fastbook","d":"The fast.ai book as notebooks"}],"short":"PyTorch & makemore"}]},{"id":"seqvis","title":"Sequences & vision","level":null,"intro":null,"phase":10,"optional":true,"topics":[{"id":"rnn","title":"RNNs & LSTMs","level":"Intermediate","why":"Networks with memory. Mostly replaced by transformers, but the ideas are everywhere.","lectures":[{"t":"Recurrent Neural Networks, Clearly Explained","u":"https://www.youtube.com/watch?v=AsNTP8Kwu80","by":"StatQuest"},{"t":"Long Short-Term Memory (LSTM), Clearly Explained","u":"https://www.youtube.com/watch?v=YCzL96nL7j0","by":"StatQuest"},{"t":"CS231n Lecture 10: Recurrent Neural Networks","u":"https://www.youtube.com/watch?v=6niqTuYFZLQ","by":"Stanford"}],"papers":[{"t":"Long Short-Term Memory (1997)","u":"https://www.bioinf.jku.at/publications/older/2604.pdf","by":"Hochreiter & Schmidhuber"},{"t":"Sequence to Sequence Learning with Neural Networks","u":"https://arxiv.org/abs/1409.3215","by":"Sutskever, Vinyals, Le"}],"reads":[{"t":"The Unreasonable Effectiveness of Recurrent Neural Networks","u":"https://karpathy.github.io/2015/05/21/rnn-effectiveness/","by":"Andrej Karpathy"},{"t":"Understanding LSTM Networks","u":"https://colah.github.io/posts/2015-08-Understanding-LSTMs/","by":"Chris Olah"},{"t":"Attention and Augmented Recurrent Neural Networks","u":"https://distill.pub/2016/augmented-rnns/","by":"Olah & Carter, Distill"}],"mins":360,"pre":["emb","backprop"],"ideas":["An RNN keeps a hidden state that it updates at each time step.","Backprop through time suffers from vanishing and exploding gradients.","LSTM gates control what to remember and what to forget.","Seq2seq means an encoder RNN feeding a decoder RNN. It was the first strong neural translation model."],"callout":["Intuition","RNNs read one word at a time and must squeeze the past into one vector. That bottleneck is exactly what attention removes."],"projects":[{"n":"Char-RNN","l":"Intermediate","d":"Train a character-level LSTM on Shakespeare or your favourite author and sample text."},{"n":"Vanishing gradients demo","l":"Intermediate","d":"Measure the gradient norm over time steps for a plain RNN vs. an LSTM."}],"repos":[{"r":"karpathy/char-rnn","d":"The original char-rnn (Lua/Torch, read for ideas)"}],"short":"RNN & LSTM"},{"id":"cnn","title":"Convolutional neural networks","level":"Intermediate","why":"The architecture that started the deep learning boom in 2012.","lectures":[{"t":"CS231n Lecture 5: Convolutional Neural Networks","u":"https://www.youtube.com/watch?v=bNb2fEVKeEo","by":"Stanford"},{"t":"But what is a convolution?","u":"https://www.youtube.com/watch?v=KuXjwB4LzSA","by":"3Blue1Brown"},{"t":"The moment we stopped understanding AI (AlexNet)","u":"https://www.youtube.com/watch?v=UZDiGooFs54","by":"Welch Labs"}],"papers":[{"t":"Gradient-Based Learning Applied to Document Recognition (LeNet)","u":"http://yann.lecun.com/exdb/publis/pdf/lecun-98.pdf","by":"LeCun et al."},{"t":"ImageNet Classification with Deep CNNs (AlexNet)","u":"https://proceedings.neurips.cc/paper/2012/hash/c399862d3b9d6b76c8436e924a68c45b-Abstract.html","by":"Krizhevsky, Sutskever, Hinton"},{"t":"Deep Residual Learning (ResNet)","u":"https://arxiv.org/abs/1512.03385","by":"He et al."}],"reads":[{"t":"CNN Explainer (interactive)","u":"https://poloclub.github.io/cnn-explainer/","by":"Georgia Tech Polo Club"},{"t":"CS231n notes: Convolutional Networks","u":"https://cs231n.github.io/convolutional-networks/","by":"Stanford CS231n"},{"t":"Conv Nets: A Modular Perspective","u":"https://colah.github.io/posts/2014-07-Conv-Nets-Modular/","by":"Chris Olah"}],"mins":450,"pre":["training"],"ideas":["A convolution slides a small filter over the image and shares its weights everywhere.","Pooling and stride shrink the image while increasing each unit's receptive field.","Residual connections (ResNet) let very deep networks train.","Transfer learning means reusing ImageNet features for your own task."],"callout":["Intuition","Residual connections show up again in every Transformer. Learn them well here."],"projects":[{"n":"CIFAR-10 from scratch","l":"Intermediate","d":"Build a small CNN and reach 85% on CIFAR-10. Then add residual blocks."},{"n":"Filter visualizer","l":"Intermediate","d":"Visualize the first-layer filters and feature maps of a pretrained ResNet."}],"repos":[{"r":"huggingface/pytorch-image-models","d":"timm: hundreds of vision models"},{"r":"pytorch/vision","d":"Datasets, models and transforms for vision"}],"short":"CNNs"},{"id":"vit","title":"Vision transformers & CLIP","level":"Intermediate","why":"Images as sequences of patches, and models that connect pictures to language.","lectures":[{"t":"An Image is Worth 16x16 Words (paper explained)","u":"https://www.youtube.com/watch?v=TrdevFK_am4","by":"Yannic Kilcher"},{"t":"OpenAI CLIP (paper explained)","u":"https://www.youtube.com/watch?v=T9XSU0pKX2E","by":"Yannic Kilcher"}],"papers":[{"t":"An Image is Worth 16x16 Words (ViT)","u":"https://arxiv.org/abs/2010.11929","by":"Dosovitskiy et al."},{"t":"Learning Transferable Visual Models From Natural Language Supervision (CLIP)","u":"https://arxiv.org/abs/2103.00020","by":"Radford et al."},{"t":"Segment Anything","u":"https://arxiv.org/abs/2304.02643","by":"Kirillov et al."}],"reads":[{"t":"CLIP: Connecting text and images","u":"https://openai.com/index/clip/","by":"OpenAI"},{"t":"Feature Visualization","u":"https://distill.pub/2017/feature-visualization/","by":"Olah, Mordvintsev, Schubert, Distill"}],"mins":360,"pre":["cnn","tf"],"ideas":["ViT cuts an image into patches and treats them as tokens.","With enough data, ViTs match or beat CNNs.","CLIP trains image and text encoders so matching pairs end up close together.","Shared image\u2013text embeddings enable zero-shot classification and power image generators."],"callout":["Intuition","Read the Transformer topic (6.1) first. ViT is a Transformer with a different tokenizer."],"projects":[{"n":"Zero-shot classifier","l":"Beginner","d":"Use CLIP to classify your own photos with only text prompts."},{"n":"Tiny ViT","l":"Advanced","d":"Implement a ViT in about 200 lines and train it on CIFAR-10."}],"repos":[{"r":"openai/CLIP","d":"Official CLIP code and weights"},{"r":"lucidrains/vit-pytorch","d":"Clean ViT implementations"},{"r":"facebookresearch/segment-anything","d":"Segment Anything model"}],"short":"ViT & CLIP"}]},{"id":"llmdeep","title":"LLMs in depth","level":null,"intro":null,"phase":10,"optional":true,"topics":[{"id":"scaling","title":"Scaling laws","level":"Advanced","why":"Why bigger models trained on more data get predictably better.","lectures":[{"t":"State of GPT","u":"https://www.youtube.com/watch?v=bZQun8Y4L2A","by":"Andrej Karpathy"},{"t":"Building Large Language Models (CS229 guest lecture)","u":"https://www.youtube.com/watch?v=9vM4p9NN0Ts","by":"Yann Dubois, Stanford"}],"papers":[{"t":"Scaling Laws for Neural Language Models","u":"https://arxiv.org/abs/2001.08361","by":"Kaplan et al."},{"t":"Training Compute-Optimal LLMs (Chinchilla)","u":"https://arxiv.org/abs/2203.15556","by":"Hoffmann et al."},{"t":"Emergent Abilities of Large Language Models","u":"https://arxiv.org/abs/2206.07682","by":"Wei et al."}],"reads":[{"t":"The Bitter Lesson","u":"http://www.incompleteideas.net/IncIdeas/BitterLesson.html","by":"Rich Sutton"},{"t":"The Scaling Hypothesis","u":"https://gwern.net/scaling-hypothesis","by":"Gwern"}],"mins":225,"pre":["pretrain"],"ideas":["Loss falls as a smooth power law in parameters, data and compute.","Chinchilla: for a fixed compute budget, scale data and parameters together.","Some abilities seem to appear suddenly with scale, though this is debated.","The Bitter Lesson: general methods that use compute win in the long run."],"callout":["Intuition","Scaling laws turned AI from guesswork into engineering. Labs predict a big model's loss from small runs before training it."],"projects":[{"n":"Mini scaling law","l":"Advanced","d":"Train 6 tiny GPTs of different sizes, fit a power law, and predict the next size's loss."},{"n":"Chinchilla calculator","l":"Beginner","d":"Build a calculator that gives the compute-optimal model size and token count for a budget."}],"repos":[{"r":"EleutherAI/pythia","d":"Models trained across scales, with checkpoints, for research"}],"short":"Scaling laws"},{"id":"moe","title":"Mixture of Experts","level":"Advanced","why":"Huge models where only a few experts run per token.","lectures":[{"t":"Mistral / Mixtral explained: sliding window, KV cache, MoE","u":"https://www.youtube.com/watch?v=UiX8K-xBUpE","by":"Umar Jamil"},{"t":"Mixture of Experts, Visually Explained","u":"https://www.youtube.com/watch?v=0QQlYR1r6pQ","by":"Jia-Bin Huang"}],"papers":[{"t":"Outrageously Large Neural Networks: Sparsely-Gated MoE","u":"https://arxiv.org/abs/1701.06538","by":"Shazeer et al."},{"t":"Switch Transformers","u":"https://arxiv.org/abs/2101.03961","by":"Fedus, Zoph, Shazeer"},{"t":"Mixtral of Experts","u":"https://arxiv.org/abs/2401.04088","by":"Jiang et al."}],"reads":[{"t":"A Visual Guide to Mixture of Experts","u":"https://newsletter.maartengrootendorst.com/p/a-visual-guide-to-mixture-of-experts","by":"Maarten Grootendorst"},{"t":"Mixture of Experts Explained","u":"https://huggingface.co/blog/moe","by":"Hugging Face"}],"mins":270,"pre":["tf"],"ideas":["An MoE layer has many expert MLPs and a router that picks a few per token.","Total parameters can grow without growing the compute per token.","Load balancing keeps the router from always picking the same experts.","Most frontier open models are now MoE."],"callout":["Intuition","An MoE model is like a big hospital: many specialists, but each patient only sees two of them."],"projects":[{"n":"MoE layer","l":"Advanced","d":"Replace the MLP in nanoGPT with a top-2 MoE layer and log expert usage."},{"n":"Router analysis","l":"Intermediate","d":"Run Mixtral or another open MoE and plot which experts fire for code vs. prose."}],"repos":[{"r":"huggingface/transformers","d":"Reference implementations of MoE models"}],"short":"Mixture of Experts"},{"id":"effattn","title":"Efficient attention & beyond transformers","level":"Advanced","why":"Making attention fast and long-context, and the architectures that challenge it.","lectures":[{"t":"How DeepSeek Rewrote the Transformer (MLA)","u":"https://www.youtube.com/watch?v=0VLAoVGf_74","by":"Welch Labs"},{"t":"How FlashAttention Accelerates Generative AI","u":"https://www.youtube.com/watch?v=gBMO1JZav44","by":"Jia-Bin Huang"}],"papers":[{"t":"FlashAttention","u":"https://arxiv.org/abs/2205.14135","by":"Dao et al."},{"t":"GQA: Grouped-Query Attention","u":"https://arxiv.org/abs/2305.13245","by":"Ainslie et al."},{"t":"Mamba: Linear-Time Sequence Modeling with Selective State Spaces","u":"https://arxiv.org/abs/2312.00752","by":"Gu & Dao"}],"reads":[{"t":"Making Deep Learning Go Brrrr From First Principles","u":"https://horace.io/brrr_intro.html","by":"Horace He"},{"t":"Large Transformer Model Inference Optimization","u":"https://lilianweng.github.io/posts/2023-01-10-inference-optimization/","by":"Lilian Weng"},{"t":"A Visual Guide to Mamba and State Space Models","u":"https://newsletter.maartengrootendorst.com/p/a-visual-guide-to-mamba-and-state","by":"Maarten Grootendorst"}],"mins":450,"pre":["tf","howcomp"],"ideas":["Attention costs O(n\u00b2) in sequence length. Long context is a memory problem.","FlashAttention is exact attention that is IO-aware, so it reads GPU memory far less often.","KV caching, GQA and MLA shrink the memory needed during generation.","State-space models like Mamba scale linearly and challenge the Transformer."],"callout":["Intuition","Most real speed-ups come from moving fewer bytes, not doing fewer FLOPs. Read Horace He's 'brrr' article."],"projects":[{"n":"KV cache","l":"Advanced","d":"Add a KV cache to your nanoGPT and measure the generation speed-up."},{"n":"Serve a model","l":"Intermediate","d":"Serve an open model with vLLM and benchmark throughput as batch size grows."}],"repos":[{"r":"Dao-AILab/flash-attention","d":"Official FlashAttention kernels"},{"r":"state-spaces/mamba","d":"Mamba SSM architecture"},{"r":"vllm-project/vllm","d":"High-throughput LLM serving"}],"short":"Efficient attention"},{"id":"distrib","title":"GPUs & distributed training","short":"Distributed train","level":"Advanced","why":"Large models do not fit or train in time on one GPU, so splitting data, weights and computation across many GPUs is how modern models get built.","mins":900,"pre":["training","howcomp","tf"],"ideas":["Training memory holds weights, gradients, optimizer state and activations. With Adam in mixed precision this is about 16 bytes per parameter before activations, so a 7B model needs over 100 GB.","Data parallelism copies the model to every GPU, gives each a different slice of the batch, then averages gradients with an all-reduce. It scales throughput but not the largest model you can fit.","ZeRO and FSDP shard optimizer state, gradients and weights across data-parallel GPUs and gather each layer only when it is needed. Memory per GPU drops roughly in proportion to the number of GPUs.","Tensor parallelism splits each matrix multiply across GPUs and pipeline parallelism splits layers into stages. Both need fast links, so tensor parallelism usually stays inside one node."],"callout":["Intuition","Every parallelism scheme trades memory for communication. The best layout keeps GPUs busy computing while the next chunk of data moves in the background."],"lectures":[{"t":"Stanford CS336 (Spring 2025) Lecture 7: Parallelism 1","u":"https://www.youtube.com/watch?v=l1RJcDjzK8M","by":"Stanford Online (Tatsunori Hashimoto)"},{"t":"Lecture 48: The Ultra Scale Playbook","u":"https://www.youtube.com/watch?v=1E8GDR8QXKw","by":"GPU MODE"}],"papers":[{"t":"The Ultra-Scale Playbook: Training LLMs on GPU Clusters","u":"https://huggingface.co/spaces/nanotron/ultrascale-playbook","by":"Hugging Face (Nanotron team)"},{"t":"ZeRO: Memory Optimizations Toward Training Trillion Parameter Models","u":"https://arxiv.org/abs/1910.02054","by":"Rajbhandari et al."},{"t":"Megatron-LM: Training Multi-Billion Parameter Language Models Using Model Parallelism","u":"https://arxiv.org/abs/1909.08053","by":"Shoeybi et al."},{"t":"PyTorch FSDP: Experiences on Scaling Fully Sharded Data Parallel","u":"https://arxiv.org/abs/2304.11277","by":"Zhao et al."}],"reads":[{"t":"How to Scale Your Model","u":"https://jax-ml.github.io/scaling-book/","by":"Google DeepMind (Austin et al.)"},{"t":"Data-Parallel Distributed Training of Deep Learning Models","u":"https://siboehm.com/articles/22/data-parallel-training","by":"Simon Boehm"},{"t":"How to Train Really Large Models on Many GPUs?","u":"https://lilianweng.github.io/posts/2021-09-25-train-large/","by":"Lilian Weng"}],"projects":[{"n":"DDP from one GPU to many","l":"Intermediate","d":"Convert a single-GPU nanoGPT training script to PyTorch DDP. Measure throughput scaling from 1 to N GPUs and check that loss curves match at the same global batch size."},{"n":"Memory budget with FSDP","l":"Advanced","d":"Estimate the memory per GPU for a 1B-parameter model under plain DDP, FSDP and FSDP with activation checkpointing. Train it and compare measured peak memory with your estimates."}],"repos":[{"r":"stas00/ml-engineering","d":"Open book on training hardware, networking, debugging and scaling"},{"r":"huggingface/picotron","d":"Minimal, readable implementation of 4D parallelism for learning"},{"r":"microsoft/DeepSpeed","d":"Library implementing ZeRO and other large-scale training optimizations"}]}]},{"id":"media","title":"Speech & multimodal models","level":"Advanced","intro":"Models that hear, speak and see. Covers how audio and images are turned into tokens that transformers can process alongside text.","phase":10,"optional":true,"topics":[{"id":"speech","title":"Speech & audio models (ASR, TTS)","short":"Speech & audio","level":"Advanced","why":"Speech recognition and synthesis power voice interfaces, captioning and audio search, and they show how transformers handle a continuous signal.","mins":810,"pre":["tf","cnn","pretrain"],"ideas":["Audio is a sequence of samples, often 16,000 per second. Models usually convert it to a log-mel spectrogram, a 2D image of energy per frequency band over time, which is shorter and closer to how we hear.","ASR must align many audio frames to few characters without frame labels. CTC solves this by adding a blank symbol and summing over all alignments, while encoder-decoder models like Whisper learn the alignment through attention.","Self-supervised models like wav2vec 2.0 learn speech features from unlabeled audio by masking parts of it and predicting them. Fine-tuning on a few hours of labeled speech then gives strong recognition.","TTS turns text into a spectrogram or audio tokens, then a vocoder turns that into a waveform. Modern systems predict discrete audio codec tokens with a language model, which allows voice cloning from short prompts."],"callout":["Pitfall","Word error rate depends heavily on text normalization. 'Ten dollars' versus '$10' counts as errors unless both sides are normalized the same way, so compare WERs only under one normalizer."],"lectures":[{"t":"CS224S @ Stanford: LLM Based Spoken Language Processing 2025","u":"https://www.youtube.com/watch?v=HqG79i7qyjY","by":"Gridspace (Stanford CS224S)"},{"t":"Understanding the Internals of wav2vec 2.0","u":"https://www.youtube.com/watch?v=Id6HiSJL6fw","by":"Kwanghee Choi"},{"t":"Text-to-Speech & Voice Cloning Course: Neural TTS Revolution","u":"https://www.youtube.com/watch?v=4Lbox-d0UcE","by":"Valerio Velardo (The Sound of AI)"}],"papers":[{"t":"Robust Speech Recognition via Large-Scale Weak Supervision (Whisper)","u":"https://arxiv.org/abs/2212.04356","by":"Radford et al."},{"t":"wav2vec 2.0: Self-Supervised Learning of Speech Representations","u":"https://arxiv.org/abs/2006.11477","by":"Baevski et al."},{"t":"Connectionist Temporal Classification (ICML 2006)","u":"https://www.cs.toronto.edu/~graves/icml_2006.pdf","by":"Graves et al."},{"t":"WaveNet: A Generative Model for Raw Audio","u":"https://arxiv.org/abs/1609.03499","by":"van den Oord et al."}],"reads":[{"t":"Sequence Modeling with CTC","u":"https://distill.pub/2017/ctc/","by":"Awni Hannun (Distill)"},{"t":"Speech Processing for Machine Learning: Filter banks, MFCCs","u":"https://haythamfayek.com/2016/04/21/speech-processing-for-machine-learning.html","by":"Haytham Fayek"},{"t":"Hugging Face Audio Course","u":"https://huggingface.co/learn/audio-course","by":"Hugging Face"}],"projects":[{"n":"Fine-tune Whisper on a new domain","l":"Advanced","d":"Fine-tune Whisper small on a dataset in a new accent or language. Report WER before and after with a fixed normalizer, and inspect the ten worst transcripts."},{"n":"Spectrograms and a keyword spotter","l":"Intermediate","d":"Compute log-mel spectrograms by hand with NumPy and compare with torchaudio. Train a small CNN keyword spotter on Speech Commands and measure accuracy under added noise."}],"repos":[{"r":"openai/whisper","d":"Reference code and weights for Whisper"},{"r":"SYSTRAN/faster-whisper","d":"Whisper reimplemented on CTranslate2 for fast inference"},{"r":"huggingface/audio-transformers-course","d":"Notebooks and text for the Hugging Face audio course"}]},{"id":"multimodal","title":"Multimodal LLMs (vision-language models)","short":"Vision-language","level":"Advanced","why":"Vision-language models let one model read images, charts and screens alongside text, which most real assistants and agents now rely on.","mins":810,"pre":["vit","pretrain","posttrain","emb"],"ideas":["CLIP trains an image encoder and a text encoder so matching image-caption pairs have similar embeddings. Trained on 400M pairs with a contrastive loss, it can classify images zero-shot by comparing them to text prompts.","The common VLM recipe connects a pretrained vision encoder to a pretrained LLM. A small projector maps image patch embeddings into the LLM's token space, so the image becomes a few hundred extra tokens.","Training usually has two stages. First only the projector learns on image-caption pairs to align the spaces, then the model is instruction-tuned on visual question and answer data.","The other design injects image features through cross-attention layers inside the LLM, as Flamingo does. It keeps the text sequence short but changes the LLM's architecture."],"callout":["Pitfall","Image resolution and token count are a hard trade-off. Downscaling a document to fit the encoder can make small text unreadable, which shows up as confident hallucinations."],"lectures":[{"t":"Stanford CS25 V4: From Large Language Models to Large Multimodal Models","u":"https://www.youtube.com/watch?v=cYfKQ6YG9Qo","by":"Stanford Online"},{"t":"OpenAI CLIP: Connecting Text and Images (Paper Explained)","u":"https://www.youtube.com/watch?v=T9XSU0pKX2E","by":"Yannic Kilcher"},{"t":"Vision in the Age of LLMs","u":"https://www.youtube.com/watch?v=0XB7fNS_ONg","by":"Lucas Beyer (ETH Zurich)"}],"papers":[{"t":"Learning Transferable Visual Models From Natural Language Supervision (CLIP)","u":"https://arxiv.org/abs/2103.00020","by":"Radford et al."},{"t":"Visual Instruction Tuning (LLaVA)","u":"https://arxiv.org/abs/2304.08485","by":"Liu et al."},{"t":"Flamingo: a Visual Language Model for Few-Shot Learning","u":"https://arxiv.org/abs/2204.14198","by":"Alayrac et al."},{"t":"BLIP-2: Bootstrapping Language-Image Pre-training","u":"https://arxiv.org/abs/2301.12597","by":"Li et al."}],"reads":[{"t":"Understanding Multimodal LLMs","u":"https://magazine.sebastianraschka.com/p/understanding-multimodal-llms","by":"Sebastian Raschka"},{"t":"Multimodality and Large Multimodal Models","u":"https://huyenchip.com/2023/10/10/multimodal.html","by":"Chip Huyen"},{"t":"Generalized Visual Language Models","u":"https://lilianweng.github.io/posts/2022-06-09-vlm/","by":"Lilian Weng"}],"projects":[{"n":"Zero-shot classification with CLIP","l":"Intermediate","d":"Use OpenCLIP to classify a labeled image dataset zero-shot. Measure how accuracy changes with different prompt templates and with prompt ensembling."},{"n":"Train a tiny VLM","l":"Advanced","d":"Connect a small vision encoder to a small LLM with an MLP projector, following nanoVLM. Train the projector on captions, then instruction-tune, and compare answers on held-out images after each stage."}],"repos":[{"r":"huggingface/nanoVLM","d":"Small, readable PyTorch code to train a vision-la
