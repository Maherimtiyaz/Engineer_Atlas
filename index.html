pe or exfiltrate from inside and record what each limit stopped."}],"repos":[{"r":"ethz-spylab/agentdojo","d":"Benchmark of prompt injection attacks and defences for tool-using agents"},{"r":"anthropic-experimental/sandbox-runtime","d":"OS-level filesystem and network sandbox for agent processes"},{"r":"e2b-dev/E2B","d":"Cloud sandboxes for running agent-generated code"}]},{"id":"ag_computer","title":"Coding, browser & computer-use agents","short":"Coding & computer","level":"Advanced","why":"Agents that write code, drive browsers and operate desktops are the most capable and the hardest to make reliable, and they show every agent engineering lesson at once.","mins":1020,"pre":["ag_tools","ag_context","ag_security","cli"],"ideas":["Coding agents run a loop of gather context, act and verify. They search the repo, edit files, run tests or the type checker, and read the output. A fast, trusted check like a test suite is what makes them work, so invest in the feedback loop before the prompt.","Long tasks span many context windows. A harness that keeps a progress file, a feature list and git commits lets each new session pick up where the last stopped. Asking for small increments with tests beats asking for the whole thing at once.","Browser agents read the page as an accessibility tree or DOM with element ids, a screenshot, or both. DOM-based actions are faster and cheaper; screenshots handle canvas and odd widgets. Most failures come from dynamic pages, pop-ups and losing track of state over many steps.","Computer-use agents see screenshots and return mouse and keyboard actions with pixel coordinates. They work on any GUI but are slow and costly per step, so use an API, CLI or DOM tool where one exists and keep pixels for the long tail. OSWorld showed models far below the 72% human rate when it was released."],"callout":["Intuition","Give the agent the same tools a human engineer would want: a shell, ripgrep, a test runner, git. A small bash-only agent like mini-swe-agent gets close to complex scaffolds on SWE-bench Verified with current models."],"lectures":[{"t":"SWE-agent: A deep dive","u":"https://www.youtube.com/watch?v=RJ6NN8Y-xok","by":"Ofir Press"},{"t":"Claude Agent SDK (full workshop)","u":"https://www.youtube.com/watch?v=TqC1qOfiVcQ","by":"Thariq Shihipar, Anthropic (AI Engineer)"}],"papers":[{"t":"OSWorld: Benchmarking Multimodal Agents in Real Computer Environments","u":"https://arxiv.org/abs/2404.07972","by":"Xie et al., 2024"},{"t":"OpenHands: An Open Platform for AI Software Developers as Generalist Agents","u":"https://arxiv.org/abs/2407.16741","by":"Wang et al., 2024"},{"t":"Computer use tool (docs)","u":"https://platform.claude.com/docs/en/agents-and-tools/tool-use/computer-use-tool","by":"Anthropic"},{"t":"Claude Agent SDK overview","u":"https://code.claude.com/docs/en/agent-sdk/overview","by":"Anthropic"}],"reads":[{"t":"Effective harnesses for long-running agents","u":"https://www.anthropic.com/research/effective-harnesses-for-long-running-agents","by":"Anthropic Engineering"},{"t":"Building agents with the Claude Agent SDK","u":"https://claude.com/resources/articles/building-agents-with-the-claude-agent-sdk","by":"Anthropic"},{"t":"Raising the bar on SWE-bench Verified","u":"https://www.anthropic.com/research/swe-bench-sonnet","by":"Anthropic Engineering"}],"projects":[{"n":"Admin-panel operator","l":"Advanced","d":"The fake shop has a legacy admin web UI with no API for chargebacks. Give the helpdesk agent a browser tool (browser-use, Playwright with the accessibility tree, or computer use) and measure success, steps and cost per task against the same task done through an API tool."},{"n":"Bug-fixing agent for your own repo","l":"Advanced","d":"Seed 20 bugs with failing tests into the helpdesk codebase. Build a coding agent with the Claude Agent SDK or mini-swe-agent that runs in a sandbox, fixes them and opens a branch per fix. Report resolve rate, cost per fix and how often it edited the tests instead of the code."}],"repos":[{"r":"SWE-agent/mini-swe-agent","d":"About 100 lines of Python, bash-only coding agent that scores well on SWE-bench"},{"r":"anthropics/claude-agent-sdk-python","d":"Python SDK for the agent harness behind Claude Code"},{"r":"browser-use/browser-use","d":"Open-source browser agent library with DOM and vision modes"}]},{"id":"ag_voice","title":"Voice & real-time agents","short":"Voice agents","level":"Advanced","why":"Voice agents must answer in under a second, handle interruptions and run tools mid-conversation, which turns every agent design choice into a latency budget.","mins":720,"pre":["ag_state","realtime","costlat"],"ideas":["Most production voice agents are a cascade: voice activity detection, streaming speech-to-text, an LLM, then streaming text-to-speech. Speech-to-speech models cut latency and keep tone, but the cascade is easier to debug, swap parts in and run tools from.","People expect a reply within about a second. Measure voice-to-voice latency from end of user speech to first audio out, and budget it across turn detection, transcription, LLM time to first token and TTS time to first byte. Stream every stage so each starts before the previous one finishes.","Turn-taking is the hard part. A silence threshold alone either cuts people off or feels slow, so newer systems add a small model that predicts end of turn from the words and audio. When the user interrupts, stop audio at once and cut the assistant's message in context to what was actually spoken.","Use WebRTC rather than raw WebSockets for client audio, since it handles packet loss, jitter and echo cancellation. Frameworks like Pipecat and LiveKit Agents give you the pipeline, transports and telephony so you can focus on prompts, tools and evals."],"callout":["Pitfall","Slow tools ruin voice. A 4-second database call is fine in chat and awkward on a phone, so say a short filler line, run tools in parallel, or start slow lookups before the user finishes."],"lectures":[{"t":"How to Build Voice Agents That Don't Fall Apart When You Interrupt","u":"https://www.youtube.com/watch?v=OmyqelTwpOo","by":"Jesse Hall, LiveKit (AI Engineer)"},{"t":"Engineering voice agents: latency, quality, and scale","u":"https://www.youtube.com/watch?v=N7b1PJc7SFc","by":"Rishabh Bhargava, Together AI (AI Engineer)"},{"t":"Pipecat Cloud: Enterprise Voice Agents Built On Open Source","u":"https://www.youtube.com/watch?v=IA4lZjh9sTs","by":"Kwindla Hultman Kramer, Daily (AI Engineer)"}],"papers":[{"t":"Pipecat documentation","u":"https://docs.pipecat.ai/","by":"Pipecat"},{"t":"LiveKit Agents documentation","u":"https://docs.livekit.io/agents/","by":"LiveKit"},{"t":"Moshi: a speech-text foundation model for real-time dialogue","u":"https://arxiv.org/abs/2410.00037","by":"D\u00e9fossez et al., Kyutai, 2024"}],"reads":[{"t":"Voice AI & Voice Agents: An Illustrated Primer","u":"https://voiceaiandvoiceagents.com/","by":"Kwindla Hultman Kramer"},{"t":"Using a transformer to improve end of turn detection","u":"https://livekit.com/blog/using-a-transformer-to-improve-end-of-turn-detection","by":"LiveKit"}],"projects":[{"n":"Helpdesk phone line","l":"Advanced","d":"Put a Pipecat or LiveKit voice front end on the helpdesk agent with streaming STT, LLM and TTS and the same tools. Log per-stage latency and report voice-to-voice p50 and p95 over 50 calls, aiming for under one second at p50."},{"n":"Turn-taking shoot-out","l":"Intermediate","d":"Record 30 test utterances with pauses, fillers and barge-ins. Compare a VAD silence threshold with a semantic turn detector on false cut-offs, response delay and correct handling of interruptions."}],"repos":[{"r":"pipecat-ai/pipecat","d":"Open-source Python framework for real-time voice and multimodal agents"},{"r":"livekit/agents","d":"Framework for real-time voice agents over WebRTC and telephony"},{"r":"pipecat-ai/smart-turn","d":"Open audio model for end-of-turn detection"}]}]},{"id":"product","title":"Build the product","level":"Intermediate","intro":"Take an AI product from a vague idea to a working MVP that real users touch. You will scope it small, design an interface that handles model mistakes, and set up the loop that turns usage into a better product.","phase":6,"optional":false,"topics":[{"id":"spec","title":"From idea to spec: scoping an AI MVP","short":"Idea to spec","level":"Intermediate","why":"Most failed products solve a problem nobody has, so learning to find a real problem and cut it to the smallest useful version saves months of building.","mins":600,"pre":["llmapi","prompt"],"ideas":["Good ideas come from problems you or people near you hit often. Ask who has this problem, how often, and what they do about it today. A painful workaround is the best evidence a problem is real.","In user interviews, ask about the past, not the future. \"Tell me about the last time this happened\" gets facts. \"Would you use this?\" gets polite lies. This is the core rule of The Mom Test.","A one-page spec states the user, the problem, what success looks like in numbers, what is out of scope, and the riskiest assumption. Writing out of scope is what keeps the MVP small.","For each AI part, start with a hosted model API and a prompt before you consider fine-tuning or your own model. Build in-house only the part that is your product's edge, and buy auth, payments, vector search and hosting."],"callout":["Pitfall","An LLM demo that works on five hand-picked inputs feels finished, but it hides the long tail of failures. Put a short list of real, messy user inputs in the spec and treat them as the acceptance test."],"lectures":[{"t":"How to Talk to Users","u":"https://www.youtube.com/watch?v=MT4Ig2uqjTc","by":"Eric Migicovsky, Y Combinator"},{"t":"How to Plan an MVP","u":"https://www.youtube.com/watch?v=1hHMwLxN6EM","by":"Michael Seibel, Y Combinator"},{"t":"How to Get and Evaluate Startup Ideas","u":"https://www.youtube.com/watch?v=Th8JoIan4dg","by":"Jared Friedman, Y Combinator"}],"papers":[{"t":"How to Get Startup Ideas","u":"https://paulgraham.com/startupideas.html","by":"Paul Graham"},{"t":"Do Things that Don't Scale","u":"https://paulgraham.com/ds.html","by":"Paul Graham"},{"t":"Shape Up: Stop Running in Circles and Ship Work that Matters (free book)","u":"https://basecamp.com/shapeup","by":"Ryan Singer, Basecamp"},{"t":"How to plan an MVP (YC Startup Library)","u":"https://www.ycombinator.com/library/6f-how-to-plan-an-mvp","by":"Y Combinator"}],"reads":[{"t":"What We Learned from a Year of Building with LLMs","u":"https://applied-llms.org/","by":"Yan, Bischof, Frye, Husain, Liu, Shankar"},{"t":"Working Backwards: the PR/FAQ process","u":"https://www.workingbackwards.com/concepts/working-backwards-pr-faq-process","by":"Colin Bryar & Bill Carr"},{"t":"Building Effective Agents","u":"https://www.anthropic.com/engineering/building-effective-agents","by":"Anthropic"}],"projects":[{"n":"Ten interviews and a one-pager","l":"Beginner","d":"Interview ten people about a problem you suspect exists, using only past-tense questions. Write a one-page spec with a success metric and an out-of-scope list, and count how many interviewees described a current workaround."},{"n":"Two-week AI MVP","l":"Intermediate","d":"Build the smallest version of the spec with FastAPI, Postgres and a hosted LLM API, and put it in front of three of the people you interviewed. Record which of your 20 real test inputs it handles correctly and what users actually tried to do."}],"repos":[{"r":"fastapi/full-stack-fastapi-template","d":"FastAPI, Postgres and React starter with auth, good base for an MVP"},{"r":"vercel/chatbot","d":"Open source AI chat app template built on the AI SDK"}]},{"id":"aiux","title":"Designing UX for AI features","short":"AI UX","level":"Intermediate","why":"Models are slow, sometimes wrong and hard to predict, so the interface decides whether users trust the feature or give up on it.","mins":600,"pre":["realtime","llmapi","rag","spec"],"ideas":["Response time sets how users feel. Under 0.1 s feels instant, under 1 s keeps the flow, and past 10 s people leave. Streaming tokens and showing progress steps make a 15 s answer feel usable because the first words arrive in under a second.","Set expectations at first contact. Tell users what the feature can and cannot do, show example prompts, and avoid a blank box. Microsoft's 18 guidelines start here because wrong expectations cause most disappointment.","Make the output checkable. Show citations linked to the exact source passage, mark low-confidence parts, and make it cheap to edit, retry or undo. Users trust an answer they can verify more than one that only sounds sure.","Design for failure as a first-class state. Refusals, timeouts, empty retrieval and wrong answers each need a clear message and a next step. For risky actions such as sending email or spending money, have the AI draft and a human approve."],"callout":["Intuition","Treat the model like a fast, junior colleague. You would want to see their sources, review their work before it goes out, and correct them easily. Design the UI around those three actions."],"lectures":[{"t":"Guidelines for Human-AI Interaction with Dr. Saleema Amershi","u":"https://www.youtube.com/watch?v=Kj33wtIMG-Y","by":"Scott Hanselman"},{"t":"Generative Interfaces Beyond Chat","u":"https://www.youtube.com/watch?v=rd-J3hmycQs","by":"Linus Lee, LLMs in Production Conference"},{"t":"Getting Started with the People + AI Guidebook","u":"https://www.youtube.com/watch?v=n3HsvqBJrlY","by":"Google Design"}],"papers":[{"t":"Guidelines for Human-AI Interaction (CHI 2019)","u":"https://www.microsoft.com/en-us/research/publication/guidelines-for-human-ai-interaction/","by":"Amershi et al., Microsoft Research"},{"t":"People + AI Guidebook","u":"https://pair.withgoogle.com/guidebook","by":"Google PAIR"},{"t":"Human Interface Guidelines: Machine learning","u":"https://developer.apple.com/design/human-interface-guidelines/machine-learning","by":"Apple"},{"t":"Response Times: The 3 Important Limits","u":"https://www.nngroup.com/articles/response-times-3-important-limits/","by":"Jakob Nielsen, NN/g"}],"reads":[{"t":"Why Chatbots Are Not the Future","u":"https://wattenberger.com/thoughts/boo-chatbots","by":"Amelia Wattenberger"},{"t":"The Shape of AI: UX patterns for AI design","u":"https://www.shapeof.ai/","by":"Emily Campbell"}],"projects":[{"n":"Streaming answer with citations","l":"Intermediate","d":"Add SSE streaming and inline citations to a RAG feature, where each citation opens the source passage. Measure time to first token versus time to full answer, and ask five users which answers they trusted and why."},{"n":"Failure-state audit","l":"Intermediate","d":"Collect 30 inputs that make your feature refuse, time out, retrieve nothing or answer wrongly. Design and ship a specific message and next action for each failure type, then check that none of the 30 ends in a dead end."}],"repos":[{"r":"vercel/ai","d":"AI SDK: streaming, tool calls and generative UI helpers for TypeScript"},{"r":"assistant-ui/assistant-ui","d":"React components for AI chat with streaming, retries and attachments"},{"r":"microsoft/HAXPlaybook","d":"Microsoft tool for planning AI failure scenarios early"}]},{"id":"flywheel","title":"Feedback loops & data flywheels","short":"Data flywheel","level":"Intermediate","why":"An AI product improves only as fast as you learn from real usage, so capturing feedback and turning it into evals and data is the main engine of quality.","mins":600,"pre":["evals","aiux"],"ideas":["Log every request as a trace: input, retrieved context, prompt version, model output, latency and cost. Without traces you cannot see why a bad answer happened or reproduce it.","Collect both explicit and implicit feedback. Thumbs up or down is sparse. Edits, copies, retries, and abandoned sessions are far more common and often more honest signals of quality.","Error analysis drives everything. Read 50 to 100 traces, write a note on what went wrong in each, then group the notes into failure categories. Fix the biggest category first and turn its examples into eval cases.","The flywheel is: ship, log, review, add failures to the eval set, fix the prompt or retrieval or model, rerun evals, ship again. Good traces with human labels later become fine-tuning or preference data almost for free."],"callout":["Pitfall","An LLM judge you never checked against human labels is a guess. Label a sample yourself, measure how often the judge agrees, and fix the judge before trusting its scores."],"lectures":[{"t":"Why AI evals are the hottest new skill for product builders","u":"https://www.youtube.com/watch?v=BsWxPI9UM4c","by":"Hamel Husain & Shreya Shankar, Lenny's Podcast"},{"t":"Who Validates the Validators? Aligning LLM-Assisted Evaluation with Human Preferences","u":"https://www.youtube.com/watch?v=pkJJNgMYUyM","by":"Shreya Shankar, ACM SIGCHI"}],"papers":[{"t":"Your AI Product Needs Evals","u":"https://hamel.dev/blog/posts/evals/","by":"Hamel Husain"},{"t":"A Field Guide to Rapidly Improving AI Products","u":"https://hamel.dev/blog/posts/field-guide/","by":"Hamel Husain"},{"t":"Who Validates the Validators? (UIST 2024)","u":"https://arxiv.org/abs/2404.12272","by":"Shankar et al."}],"reads":[{"t":"Patterns for Building LLM-based Systems & Products","u":"https://eugeneyan.com/writing/llm-patterns/","by":"Eugene Yan"},{"t":"Creating a LLM-as-a-Judge That Drives Business Results","u":"https://hamel.dev/blog/posts/llm-judge/","by":"Hamel Husain"},{"t":"An LLM-as-Judge Won't Save The Product: Fixing Your Process Will","u":"https://eugeneyan.com/writing/eval-process/","by":"Eugene Yan"}],"projects":[{"n":"Trace review tool","l":"Intermediate","d":"Log every request to Postgres or Langfuse with prompt version and user feedback, then build a simple page to read traces and tag failures. Review 100 traces and report your top three failure categories with counts."},{"n":"Close the loop","l":"Advanced","d":"Turn 50 tagged failures into an eval set, fix the largest failure category, and rerun the evals. Ship the change and compare thumbs-down rate and retry rate for the week before and after."}],"repos":[{"r":"langfuse/langfuse","d":"Open source LLM tracing, user feedback scores, datasets and evals"},{"r":"Arize-ai/phoenix","d":"Open source tracing and evaluation for LLM apps"},{"r":"argilla-io/argilla","d":"Human annotation tool for building eval and training datasets"}]}]},{"id":"deploy","title":"Deploy","level":"Intermediate","intro":"Host your product and its models with infrastructure you can trust.","phase":7,"optional":false,"topics":[{"id":"cloud","title":"Cloud fundamentals & Kubernetes","short":"Cloud & K8s","level":"Intermediate","why":"Cloud platforms and Kubernetes run your containers across many machines and restart, scale and reschedule them for you.","mins":2100,"pre":["docker","lb"],"ideas":["Cloud building blocks are compute (VMs, containers, functions), storage (object stores, block disks, managed databases) and networking (VPCs, load balancers, DNS). Managed services trade money for not running the thing yourself.","Kubernetes is declarative. You write the desired state (three replicas of this image) and controllers loop forever, comparing actual state to desired state and fixing the difference.","A Pod is one or more containers scheduled together. A Deployment manages replicated Pods and rolling updates, and a Service gives them a stable name and load-balanced address.","Readiness probes decide whether a Pod gets traffic; liveness probes decide whether to restart it. Set resource requests so the scheduler can place Pods, and limits so one Pod cannot starve its neighbors."],"callout":["Pitfall","A liveness probe that checks the database will restart every Pod when the database blips, turning a small outage into a large one. Liveness should only check the process itself."],"lectures":[{"t":"Kubernetes Explained in 6 Minutes | k8s Architecture","u":"https://www.youtube.com/watch?v=TlHvYWVUZyc","by":"ByteByteGo"},{"t":"Kubernetes Crash Course for Absolute Beginners","u":"https://www.youtube.com/watch?v=s_o8dwzRlu4","by":"TechWorld with Nana"},{"t":"Kubernetes: The Documentary [PART 1]","u":"https://www.youtube.com/watch?v=BE77h7dmoQU","by":"CultRepo"}],"papers":[{"t":"Kubernetes docs: Concepts","u":"https://kubernetes.io/docs/concepts/","by":"Kubernetes"},{"t":"Large-scale cluster management at Google with Borg","u":"https://research.google/pubs/large-scale-cluster-management-at-google-with-borg/","by":"Verma et al., Google (EuroSys 2015)"},{"t":"Borg, Omega, and Kubernetes","u":"https://research.google/pubs/borg-omega-and-kubernetes/","by":"Burns, Grant, Oppenheimer, Brewer, Wilkes"}],"reads":[{"t":"Configure Liveness, Readiness and Startup Probes","u":"https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/","by":"Kubernetes docs"},{"t":"Kubernetes Failure Stories","u":"https://k8s.af/","by":"Henning Jacobs (curator)"},{"t":"Kubernetes API Basics - Resources, Kinds, and Objects","u":"https://iximiuz.com/en/posts/kubernetes-api-structure-and-terminology/","by":"Ivan Velichko"}],"projects":[{"n":"API on kind","l":"Intermediate","d":"Deploy your API, Postgres and Redis to a local kind cluster with Deployments, Services, ConfigMaps and Secrets. Delete a Pod during load and watch it get replaced; count dropped requests."},{"n":"Autoscaling and probes","l":"Advanced","d":"Add readiness and liveness probes and a HorizontalPodAutoscaler on CPU. Run a load test and record how long scale-up takes and what latency users see meanwhile."}],"repos":[{"r":"kelseyhightower/kubernetes-the-hard-way","d":"Bootstrap Kubernetes by hand to learn every component"},{"r":"kubernetes-sigs/kind","d":"Run Kubernetes clusters in Docker for local testing"}]},{"id":"iac","title":"Infrastructure as code: Terraform & friends","short":"Infra as code","level":"Intermediate","why":"Infrastructure as code describes servers, networks and databases in versioned files, so environments are reproducible, reviewable and easy to rebuild.","mins":900,"pre":["cli","cicd","cloud"],"ideas":["Terraform is declarative: you write the end state you want (one Postgres instance, two subnets) and Terraform works out which API calls create, change or delete resources to get there.","State is Terraform's record of which real resource matches each block in your code. Keep it in a remote backend with locking (S3 plus a lock, Terraform Cloud) so two people never apply against stale or conflicting state.","terraform plan shows the exact diff between code, state and the real world before anything changes. Review the plan in a pull request, then run apply on that same plan, the way you review code before merging.","Modules are reusable groups of resources with inputs and outputs, like functions. GitOps extends the idea: Git holds the desired state, and an automated agent (Atlantis, Argo CD, Flux) keeps the live system in sync with it."],"callout":["Pitfall","Changes made by hand in the cloud console cause drift: the plan then tries to undo them or fails. Make every change through code, and run plan on a schedule to catch drift early."],"lectures":[{"t":"Terraform explained in 15 mins","u":"https://www.youtube.com/watch?v=l5k1ai_GBDE","by":"TechWorld with Nana"},{"t":"Complete Terraform Course: From Beginner to Pro","u":"https://www.youtube.com/watch?v=7xngnjfIlK4","by":"DevOps Directive"},{"t":"What is GitOps, how GitOps works and why it's so useful","u":"https://www.youtube.com/watch?v=f5EpcWp0THw","by":"TechWorld with Nana"}],"papers":[{"t":"What is Terraform? (official intro)","u":"https://developer.hashicorp.com/terraform/intro","by":"HashiCorp docs"},{"t":"Terraform language: State","u":"https://developer.hashicorp.com/terraform/language/state","by":"HashiCorp docs"},{"t":"Terraform language: Modules","u":"https://developer.hashicorp.com/terraform/language/modules","by":"HashiCorp docs"},{"t":"OpenGitOps principles","u":"https://opengitops.dev/","by":"CNCF OpenGitOps"}],"reads":[{"t":"Terraform: a comprehensive guide","u":"https://blog.gruntwork.io/a-comprehensive-guide-to-terraform-b3d32832baca","by":"Yevgeniy Brikman (Gruntwork)"},{"t":"How to manage Terraform state","u":"https://www.gruntwork.io/blog/how-to-manage-terraform-state","by":"Yevgeniy Brikman (Gruntwork)"},{"t":"Terraform best practices","u":"https://www.terraform-best-practices.com/","by":"Anton Babenko"}],"projects":[{"n":"FastAPI stack in Terraform","l":"Intermediate","d":"Write Terraform for a VPC, a managed Postgres and a container service running your API, with remote state and locking. Destroy and recreate it, and time how long a full rebuild takes."},{"n":"Plan-in-PR pipeline","l":"Advanced","d":"Add a GitHub Actions job that posts terraform plan on every pull request and applies only on merge. Make a manual console change and check that a scheduled plan job reports the drift."}],"repos":[{"r":"terraform-aws-modules/terraform-aws-vpc","d":"Widely used community module; a good model of module inputs and outputs"},{"r":"runatlantis/atlantis","d":"Runs terraform plan/apply from pull request comments"},{"r":"argoproj/argo-cd","d":"GitOps continuous delivery for Kubernetes"}]},{"id":"serve","title":"Model serving: APIs, vLLM & Ollama","short":"Model serving","level":"Intermediate","why":"A model only creates value once it answers requests quickly and cheaply, and serving is where latency, cost and reliability are decided.","mins":1200,"pre":["tf","howcomp","docker","cloud","costlat"],"ideas":["Serving wraps a model behind an API: load weights once, accept requests, run inference and return results. Latency is time per request and throughput is requests per second, and batching trades one for the other.","LLM generation has two phases. Prefill processes the whole prompt in parallel and is compute-bound, while decode produces one token at a time and is memory-bandwidth-bound because each step rereads all the weights.","The KV cache stores attention keys and values for past tokens so each decode step only computes the new token. It grows with batch size and context length and often limits how many requests fit on a GPU.","Continuous batching adds and removes requests from the running batch at every step instead of waiting for a full batch to finish. PagedAttention stores the KV cache in fixed-size blocks so memory is not wasted on padding."],"callout":["Pitfall","Benchmarking with one request at a time hides the real behaviour. Measure latency percentiles (p50, p99) under realistic concurrent load."],"lectures":[{"t":"Fast LLM Serving with vLLM and PagedAttention","u":"https://www.youtube.com/watch?v=5ZlavKF_98U","by":"Woosuk Kwon & Zhuohan Li (Anyscale)"},{"t":"Lecture 05: Deployment (FSDL 2022)","u":"https://www.youtube.com/watch?v=W3hKjXg7fXM","by":"Full Stack Deep Learning"},{"t":"vLLM: Easy, Fast, and Cheap LLM Serving for Everyone","u":"https://www.youtube.com/watch?v=9ih0EmcXRHE","by":"Woosuk Kwon & Xiaoxuan Liu / PyTorch Foundation"}],"papers":[{"t":"Efficient Memory Management for LLM Serving with PagedAttention","u":"https://arxiv.org/abs/2309.06180","by":"Kwon et al."},{"t":"Orca: A Distributed Serving System for Transformer-Based Generative Models (OSDI 2022)","u":"https://www.usenix.org/conference/osdi22/presentation/yu","by":"Yu et al."},{"t":"Fast Inference from Transformers via Speculative Decoding","u":"https://arxiv.org/abs/2211.17192","by":"Leviathan et al."},{"t":"FastAPI documentation","u":"https://fastapi.tiangolo.com/","by":"Sebasti\u00e1n Ram\u00edrez"},{"t":"vLLM documentation","u":"https://docs.vllm.ai/en/stable/","by":"vLLM project"}],"reads":[{"t":"Transformer Inference Arithmetic","u":"https://kipp.ly/transformer-inference-arithmetic/","by":"kipply"},{"t":"How continuous batching enables 23x throughput in LLM inference","u":"https://www.anyscale.com/blog/continuous-batching-llm-inference","by":"Anyscale"},{"t":"LLM Inference Performance Engineering: Best Practices","u":"https://www.databricks.com/blog/llm-inference-performance-engineering-best-practices","by":"Databricks"},{"t":"A guide to LLM inference and performance","u":"https://www.baseten.co/blog/llm-transformer-inference-guide/","by":"Baseten"}],"projects":[{"n":"Serve a classifier with FastAPI","l":"Intermediate","d":"Wrap a small PyTorch model in a FastAPI service with request validation and a health check. Load-test it and plot p50 and p99 latency as you add dynamic batching."},{"n":"Benchmark an LLM server","l":"Advanced","d":"Serve a small open LLM with plain Hugging Face generate and then with vLLM. Measure tokens per second, time to first token and memory as concurrency rises from 1 to 64."},{"n":"Local model behind your API","l":"Intermediate","d":"Run a small open model with Ollama in Docker Compose next to your FastAPI service and point the existing client at its OpenAI-compatible endpoint. Compare answer quality on your eval set against the hosted model."}],"repos":[{"r":"vllm-project/vllm","d":"High-throughput LLM inference engine with PagedAttention"},{"r":"sgl-project/sglang","d":"Fast serving framework for LLMs and VLMs with prefix caching"},{"r":"bentoml/BentoML","d":"Framework for packaging models as production API services"},{"r":"ollama/ollama","d":"Run open models locally with a simple CLI and HTTP API"}]},{"id":"serverless","title":"Serverless, edge & GPU platforms","short":"Serverless & edge","level":"Intermediate","why":"Serverless platforms run your code on demand and bill per use, which can remove most ops work for spiky or GPU-heavy workloads if you understand their limits.","mins":600,"pre":["docker","cloud","serve"],"ideas":["A serverless function runs in a sandbox that the platform starts when a request arrives and stops when traffic dies down. You pay per request and per second of compute instead of for idle servers.","A cold start is the delay when no warm sandbox exists: the platform must boot a microVM or container, load your code and run its setup. Small packages, lazy imports, snapshots and a few always-warm instances (provisioned concurrency) shrink it.","Edge runtimes like Cloudflare Workers run JavaScript or WebAssembly in V8 isolates inside one shared process, in data centers near the user. Isolates start in milliseconds but limit CPU time, memory and which libraries you can use.","Serverless GPU platforms (Modal, Replicate, RunPod) scale GPU containers to zero when idle. They fit bursty inference and batch jobs, but loading many gigabytes of weights makes cold starts long, so steady high traffic is often cheaper on reserved GPUs or plain containers."],"callout":["Intuition","Compare cost by utilization. If a GPU would sit busy more than about half the day, a reserved machine usually wins; if it would mostly sit idle, pay-per-second serverless usually wins."],"lectures":[{"t":"Firecracker: Lightweight Virtualization for Serverless Applications (NSDI '20)","u":"https://www.youtube.com/watch?v=cwruf1ERAKM","by":"USENIX"},{"t":"Demystifying and mitigating AWS Lambda cold starts (re:Invent)","u":"https://www.youtube.com/watch?v=-IuopTjj3Qs","by":"Datadog"},{"t":"What the heck is a V8 isolate?","u":"https://www.youtube.com/watch?v=LXv5H8B-h5E","by":"Annie Sexton"}],"papers":[{"t":"Cloud Programming Simplified: A Berkeley View on Serverless Computing","u":"https://arxiv.org/abs/1902.03383","by":"Jonas et al. (UC Berkeley)"},{"t":"Serverless in the Wild: Characterizing and Optimizing the Serverless Workload at a Large Cloud Provider","u":"https://www.usenix.org/conference/atc20/presentation/shahrad","by":"Shahrad et al. (Microsoft Azure, ATC '20)"},{"t":"Firecracker: Lightweight Virtualization for Serverless Applications","u":"https://www.usenix.org/conference/nsdi20/presentation/agache","by":"Agache et al. (AWS, NSDI '20)"},{"t":"How Workers works","u":"https://developers.cloudflare.com/workers/reference/how-workers-works/","by":"Cloudflare docs"}],"reads":[{"t":"Cloud computing without containers","u":"https://blog.cloudflare.com/cloud-computing-without-containers/","by":"Zack Bloom (Cloudflare)"},{"t":"Cold starts in AWS Lambda","u":"https://mikhail.io/serverless/coldstarts/aws/","by":"Mikhail Shilkov"},{"t":"GPU memory snapshots: supercharging sub-second startup","u":"https://modal.com/blog/gpu-mem-snapshots","by":"Modal"}],"projects":[{"n":"Cold-start lab","l":"Intermediate","d":"Deploy the same small API as a Lambda function, a Cloudflare Worker and a container. Measure p50 and p99 latency for the first request after 15 minutes idle versus warm requests."},{"n":"Scale-to-zero LLM endpoint","l":"Advanced","d":"Serve a small open model with vLLM on Modal or RunPod serverless. Record cold-start time, warm tokens per second and cost per 1,000 requests, then compare with an always-on GPU at your expected traffic."}],"repos":[{"r":"modal-labs/modal-examples","d":"Runnable examples of serverless GPU inference, batch jobs and web endpoints"},{"r":"replicate/cog","d":"Packages ML models into standard containers for serving"},{"r":"firecracker-microvm/firecracker","d":"The microVM monitor behind AWS Lambda and Fargate"}]}]},{"id":"ops","title":"Operate: MLOps, LLMOps & AIOps","level":"Advanced","intro":"Run it in production: reliability, model monitoring, LLM tracing and guardrails, and AI for operations.","phase":7,"optional":false,"topics":[{"id":"reliab","title":"Reliability, SLOs & incidents","short":"SLOs & incidents","level":"Intermediate","why":"SLOs turn 'is the service reliable enough' into a number, and good incident practice turns each outage into a lasting fix.","mins":720,"pre":["observ","cicd"],"ideas":["An SLI is a measured ratio of good events, such as the share of requests that succeed in under 300 ms. An SLO is the target for it over a window, such as 99.9% over 28 days.","The error budget is 100% minus the SLO. At 99.9% you may fail 0.1% of requests, about 43 minutes of full outage a month. While budget remains you ship fast; when it runs out you slow down and fix reliability.","Alert on burn rate, not single errors. Page someone when the budget is being spent fast enough to run out within hours, and send a ticket when it is burning slowly.","Incidents need clear roles (an incident commander, a communicator, people fixing). Afterwards, a blameless postmortem asks how the system allowed the failure, because complex systems fail from several small causes lining up."],"callout":["Intuition","100% is the wrong target. Users cannot tell 99.99% from 100% because their own Wi-Fi fails more often, and chasing the last nines stops all feature work."],"lectures":[{"t":"The Art of SLOs (Service Level Objectives)","u":"https://www.youtube.com/watch?v=E3ReKuJ8ewA","by":"Google Cloud Tech"},{"t":"Velocity 2012: Richard Cook, \"How Complex Systems Fail\"","u":"https://www.youtube.com/watch?v=2S0k12uZR14","by":"O'Reilly"}],"papers":[{"t":"Google SRE book: Service Level Objectives","u":"https://sre.google/sre-book/service-level-objectives/","by":"Google"},{"t":"Google SRE workbook: Alerting on SLOs","u":"https://sre.google/workbook/alerting-on-slos/","by":"Google"},{"t":"Google SRE book: Postmortem Culture","u":"https://sre.google/sre-book/postmortem-culture/","by":"Google"},{"t":"How Complex Systems Fail","u":"https://how.complexsystems.fail/","by":"Richard I. Cook"}],"reads":[{"t":"Metastable Failures in Distributed Systems","u":"https://brooker.co.za/blog/2021/05/24/metastable.html","by":"Marc Brooker"},{"t":"Google SRE workbook: Implementing SLOs","u":"https://sre.google/workbook/implementing-slos/","by":"Google"},{"t":"Avoiding fallback in distributed systems","u":"https://aws.amazon.com/builders-library/avoiding-fallback-in-distributed-systems/","by":"Jacob Gabrielson, Amazon Builders' Library"}],"projects":[{"n":"SLOs for your API","l":"Intermediate","d":"Define availability and latency SLIs from your Prometheus metrics, set SLOs, and build multi-window burn-rate alerts. Inject errors and check the page fires at the right time and no sooner."},{"n":"Game day and postmortem","l":"Intermediate","d":"Break something on purpose (kill Redis, fill the disk, add 2 s of database latency) while a load test runs. Write a blameless postmortem with timeline, impact in error budget, and follow-up actions."}],"repos":[{"r":"danluu/post-mortems","d":"Large curated collection of public postmortems"},{"r":"google/slo-generator","d":"Computes SLOs, error budgets and burn rates from metrics backends"}]},{"id":"mlops","title":"MLOps: experiment tracking, CI & monitoring","short":"MLOps","level":"Intermediate","why":"Models degrade silently as data changes, so tracking experiments, testing pipelines and monitoring production are what keep ML systems trustworthy.","mins":1200,"pre":["cli"],"ideas":["Experiment tracking records the code version, data version, config and metrics of every run. Without it you cannot reproduce your best model or explain why a result changed.","ML code needs tests at several levels: unit tests for data transforms, checks on data schema and ranges, and model tests such as minimum accuracy on a fixed slice. CI runs them on every change.","Data drift means inputs in production no longer look like training data. Concept drift means the link between inputs and labels changed. Both lower accuracy without causing any error.","Monitoring tracks inputs, predictions and, when labels arrive, real accuracy. Comparing feature distributions to a training baseline catches drift before users notice."],"callout":["Pitfall","Most production ML failures are data bugs, not model bugs: a renamed column, a unit change or a broken upstream job. Validate data at every boundary."],"lectures":[{"t":"Lecture 02: Development Infrastructure & Tooling (FSDL 2022)","u":"https://www.youtube.com/watch?v=BPYOsDCZbno","by":"Full Stack Deep Learning"},{"t":"Lecture 06: Continual Learning (FSDL 2022)","u":"https://www.youtube.com/watch?v=nra0Tt3a-Oc","by":"Full Stack Deep Learning (Josh Tobin)"}],"papers":[{"t":"Hidden Technical Debt in Machine Learning Systems (NeurIPS 2015)","u":"https://papers.nips.cc/paper/2015/hash/86df7dcfd896fcaf2674f757a2463eba-Abstract.html","by":"Sculley et al."},{"t":"The ML Test Score: A Rubric for ML Production Readiness","u":"https://research.google/pubs/the-ml-test-score-a-rubric-for-ml-production-readiness-and-technical-debt-reduction/","by":"Breck et al. (Google)"},{"t":"Operationalizing Machine Learning: An Interview Study","u":"https://arxiv.org/abs/2209.09125","by":"Shankar et al."},{"t":"Rules of Machine Learning","u":"https://developers.google.com/machine-learning/guides/rules-of-ml","by":"Martin Zinkevich (Google)"}],"reads":[{"t":"Data Distribution Shifts and Monitoring","u":"https://huyenchip.com/2022/02/07/data-distribution-shifts-and-monitoring.html","by":"Chip Huyen"},{"t":"Made With ML: MLOps course","u":"https://madewithml.com/","by":"Goku Mohandas"},{"t":"A Practical Guide to Maintaining Machine Learning in Production","u":"https://eugeneyan.com/writing/practical-guide-to-maintaining-machine-learning/","by":"Eugene Yan"}],"projects":[{"n":"Tracked and tested training pipeline","l":"Intermediate","d":"Add MLflow tracking, data validation checks and a model quality test to a training script, and run them in GitHub Actions. Show that a deliberately broken data file fails CI."},{"n":"Drift simulation","l":"Intermediate","d":"Train a model on one time period of a dataset and replay later periods as production traffic. Plot a drift metric per feature next to accuracy and see how early drift warns of the drop."}],"repos":[{"r":"GokuMohandas/Made-With-ML","d":"Code for the Made With ML course on building and deploying ML"},{"r":"mlflow/mlflow","d":"Open-source experiment tracking, model registry and deployment"},{"r":"evidentlyai/evidently","d":"Library for data drift and model quality reports"}]},{"id":"drift","title":"Model monitoring, drift & retraining","short":"Drift & retraining","level":"Advanced","why":"Models degrade silently when the world changes, so you need monitoring that catches it and a plan for when and how to retrain.","mins":720,"pre":["mlops","observ"],"ideas":["Data drift (covariate shift) means the inputs change, such as new user types or a new upstream format. Concept drift means the link between inputs and the right answer changes, such as fraud patterns adapting. Concept drift hurts accuracy even when inputs look the same.","Labels often arrive late or never, so you monitor proxies: input feature distributions (PSI, KS test, Wasserstein distance), prediction distributions and confidence, and business metrics. Some methods estimate accuracy from calibrated confidence until labels arrive.","A shadow deployment sends real traffic to the new model but only logs its answers, so you can compare it with the live model at no user risk. An A/B test then sends a share of users to it and measures the business metric that matters.","Retraining can run on a schedule, on a drift or performance alert, or when enough new labeled data accumulates. Each new model passes the same offline evaluation and a shadow or canary stage before promotion."],"callout":["Pitfall","Drift alerts on every feature fire constantly because many shifts are harmless. Alert on drift in the features that matter most to the model, and confirm with performance or business metrics before retraining."],"lectures":[{"t":"Data Distribution Shifts and Monitoring (Designing ML Systems reading group)","u":"https://www.youtube.com/watch?v=SXaz1O8qW60","by":"ML Collective"},{"t":"ML Monitoring, Stanford CS329S guest lecture","u":"https://www.youtube.com/watch?v=uVqfYkcodeE","by":"Alessya Visnjic (WhyLabs)"},{"t":"Monitoring: Testing & Deployment","u":"https://www.youtube.com/watch?v=dYqhcXOi7JM","by":"Full Stack Deep Learning"}],"papers":[{"t":"Hidden Technical Debt in Machine Learning Systems (NeurIPS 2015)","u":"https://papers.nips.cc/paper/2015/hash/86df7dcfd896fcaf2674f757a2463eba-Abstract.html","by":"Sculley et al. (Google)"},{"t":"Rules of Machine Learning","u":"https://developers.google.com/machine-learning/guides/rules-of-ml","by":"Martin Zinkevich (Google)"},{"t":"Failing Loudly: An Empirical Study of Methods for Detecting Dataset Shift","u":"https://arxiv.org/abs/1810.11953","by":"Rabanser, G\u00fcnnemann, Lipton"},{"t":"The ML Test Score: A Rubric for ML Production Readiness","u":"https://research.google/pubs/the-ml-test-score-a-rubric-for-ml-production-readiness-and-technical-debt-reduction/","by":"Breck et al. (Google)"}],"reads":[{"t":"Data distribution shifts and monitoring","u":"https://huyenchip.com/2022/02/07/data-distribution-shifts-and-monitoring.html","by":"Chip Huyen"},{"t":"Monitoring machine learning systems","u":"https://madewithml.com/courses/mlops/monitoring/","by":"Goku Mohandas (Made With ML)"},{"t":"What is data drift in ML, and how to detect and handle it","u":"https://www.evidentlyai.com/ml-in-production/data-drift","by":"Evidently AI"}],"projects":[{"n":"Simulated drift dashboard","l":"Intermediate","d":"Train a classifier on one time window of a public dataset, then replay later windows through it. Plot PSI per feature and accuracy over time, and see which drift metrics move before accuracy drops."},{"n":"Shadow and retrain loop","l":"Advanced","d":"Run a retrained model in shadow next to the live one, log both predictions, and promote it only if it wins on delayed labels. Measure how long the full trigger-to-promotion loop takes."}],"repos":[{"r":"evidentlyai/evidently","d":"Drift reports, test suites and monitoring for ML and LLM apps"},{"r":"NannyML/nannyml","d":"Estimates model performance without labels and detects drift"},{"r":"SeldonIO/alibi-detect","d":"Outlier, adversarial and drift detection algorithms"}]},{"id":"llmops","title":"Evals, tracing & guardrails for LLM apps","short":"Evals & tracing","level":"Advanced","why":"LLM output is non-deterministic, so you need evals to know if a change helped, traces to see what happened in production, and guardrails to block bad inputs and outputs.","mins":900,"pre":["testing","observ","ragprod"],"ideas":["Start evals by reading real traces and writing down failure types. Turn each common failure into a test: a code assertion when possible (valid JSON, cites a source, no banned words), an LLM judge only when it is not.","An LLM judge is a model grading outputs against a rubric. Give it a binary pass or fail per criterion, and check its agreement with human labels before trusting it.","Trace every request as nested spans: retrieval, each model call, each tool call, with prompt, response, token counts, latency and cost. The OpenTelemetry GenAI conventions give standard attribute names for these.","Guardrails are checks around the model call: input filters for injection or off-topic requests, output validators for schema, PII and policy, and fallbacks when a check fails. Run cheap checks inline and expensive ones asynchronously."],"callout":["Intuition","Evals are the unit tests and regression suite of an LLM app. Run them in CI on every prompt or model change, the same way you run tests on every code change."],"lectures":[{"t":"Lessons From A Year Building With LLMs","u":"https://www.youtube.com/watch?v=qBHfQT3YtyY","by":"AI Engineer"},{"t":"AI Eval Concepts Explained in 15 Minutes","u":"https://www.youtube.com/watch?v=3rlYBCDK0K4","by":"Hamel Husain"}],"papers":[{"t":"Judging LLM-as-a-Judge with MT-Bench and Chatbot Arena","u":"https://arxiv.org/abs/2306.05685","by":"Zheng et al."},{"t":"Define success criteria and build evaluations","u":"https://docs.claude.com/en/docs/test-and-evaluate/develop-tests","by":"Anthropic docs"},{"t":"OWASP Top 10 for LLM Applications","u":"https://genai.owasp.org/llm-top-10/","by":"OWASP"}],"reads":[{"t":"Your AI Product Needs Evals","u":"https://hamel.dev/blog/posts/evals/","by":"Hamel Husain"},{"t":"Task-Specific LLM Evals that Do & Don't Work","u":"https://eugeneyan.com/writing/evals/","by":"Eugene Yan"},{"t":"What We've Learned From A Year of Building with LLMs","u":"https://applied-llms.org/","by":"Yan, Bischof, Frye, Husain, Liu, Shankar"}],"projects":[{"n":"Eval suite in CI","l":"Advanced","d":"Collect 100 real or synthetic inputs for your RAG endpoint, write code assertions plus one LLM judge, and run them in CI on every prompt change. Measure judge agreement with your own labels on 30 cases."},{"n":"Traced LLM service","l":"Intermediate","d":"Instrument the service with OpenTelemetry spans for retrieval, model and tool calls, sending to Langfuse or Phoenix. Build a view of p95 latency and cost per request, and find the slowest step."}],"repos":[{"r":"langfuse/langfuse","d":"Open-source LLM tracing, prompt management and evals"},{"r":"promptfoo/promptfoo","d":"Config-driven eval and red-teaming runner for CI"},{"r":"open-telemetry/semantic-conventions-genai","d":"OpenTelemetry GenAI span and metric conventions"}]},{"id":"aiops","title":"AIOps: using AI to run production","short":"AIOps","level":"Advanced","why":"AIOps applies statistics, ML and LLMs to metrics, logs and incidents, so a small team can catch problems sooner, page less and find causes faster.","mins":720,"pre":["observ","reliab","agents"],"ideas":["Metric anomaly detection learns what normal looks like, including daily and weekly seasonality, and flags points far from it. Robust methods like seasonal decomposition plus median-based tests (Twitter's S-H-ESD) beat fixed thresholds on metrics that swing through the day.","Log parsing turns raw lines into templates by masking the variable parts, so 'Connection from 10.0.0.5 closed' and the same line with another IP become one event type. Drain does this online with a fixed-depth tree, and counts per template then become metrics you can alert on.","Alert correlation groups alerts that share a time window, a service or a dependency path into one incident. One page for a database outage instead of forty for every caller cuts noise and points toward the root cause.","LLMs can summarize an incident, search past incidents and runbooks, and propose root causes or mitigations, as in Microsoft's and Meta's published systems. Auto-remediation (restart, roll back, scale up) should start with safe, reversible actions, behind guardrails and human approval."],"callout":["Pitfall","An LLM's root-cause guess sounds confident even when it is wrong, and an auto-fix applied to the wrong cause can make an outage worse. Show the evidence behind each suggestion and keep humans approving any action that is not trivially reversible."],"lectures":[{"t":"Anomaly Detection for Data Quality and Metric Shifts at Netflix","u":"https://www.youtube.com/watch?v=C3sbxtRe2Po","by":"AI Council"},{"t":"LISA17: Fast Log Analysis Made Easy by Automatically Parsing Heterogeneous Logs","u":"https://www.youtube.com/watch?v=URQnTPTxBbA","by":"USENIX"},{"t":"SREcon16: Less Alarming Alerts!","u":"https://www.youtube.com/watch?v=CdwfNBVkRps","by":"USENIX"}],"papers":[{"t":"Drain: An Online Log Parsing Approach with Fixed Depth Tree (ICWS 2017)","u":"https://jiemingzhu.github.io/pub/pjhe_icws2017.pdf","by":"He, Zhu, Zheng, Lyu"},{"t":"Automatic Anomaly Detection in the Cloud via Statistical Learning","u":"https://arxiv.org/abs/1704.07706","by":"Hochenbaum, Vallis, Kejariwal (Twitter)"},{"t":"Recommending Root-Cause and Mitigation Steps for Cloud Incidents using Large Language Models (ICSE 2023)","u":"https://arxiv.org/abs/2301.03797","by":"Ahmed et al. (Microsoft)"},{"t":"Automatic Root Cause Analysis via Large Language Models for Cloud Incidents (RCACopilot)","u":"https://arxiv.org/abs/2305.15778","by":"Chen et al. (Microsoft)"}],"reads":[{"t":"Leveraging AI for efficient incident response","u":"https://engineering.fb.com/2024/06/24/data-infrastructure/leveraging-ai-for-efficient-incident-response/","by":"Meta Engineering"},{"t":"The evolution of AIOps at Meta: beyond the buzz","u":"https://atscaleconference.com/the-evolution-of-aiops-at-meta-beyond-the-buzz/","by":"@Scale (Meta)"},{"t":"Monitoring Distributed Systems (Site Reliability Engineering, ch. 6)","u":"https://sre.google/sre-book/monitoring-distributed-systems/","by":"Rob Ewaschuk (Google)"}],"projects":[{"n":"Log template anomaly alerts","l":"Intermediate","d":"Parse a Loghub dataset (for example HDFS) with Drain3, count events per template per minute, and flag templates whose rate jumps. Compare your flags with the dataset's labeled anomalies and report precision and recall."},{"n":"LLM incident copilot","l":"Advanced","d":"Build a tool that takes an alert, pulls recent logs, metrics and matching past postmortems, and asks an LLM for ranked root-cause hypotheses with cited evidence. Score it on 10 replayed incidents by how often the true cause is in the top three."}],"repos":[{"r":"logpai/loghub","d":"Large collection of labeled system log datasets for log analytics research"},{"r":"IBM/Drain3","d":"Production-ready streaming implementation of the Drain log parser"},{"r":"robusta-dev/holmesgpt","d":"Open-source LLM agent that investigates alerts using your observability data"}]}]},{"id":"growth","title":"Distribute: get it to users","level":"Intermediate","intro":"How to get a technical product in front of the right users and turn them into paying customers. Covers launching, choosing channels, open source and docs, measuring what works, and pricing that covers LLM costs.","phase":8,"optional":false,"topics":[{"id":"launch","title":"Launching: go-to-market for builders","short":"Launching","level":"Intermediate","why":"A product nobody hears about earns nothing, so you need a repeatable way to put it in front of the first people who have the problem.","mins":600,"pre":["spec","aiux"],"ideas":["Positioning answers four questions on one screen: who it is for, what problem it solves, what they use today, and why yours is better for them. A landing page that answers these in the first fold converts far better than one that lists features.","Launch early and launch many times. Each launch (Show HN, Product Hunt, a subreddit, a newsletter, a big feature release) is a new chance to be noticed, so a weak first launch costs little.","Communities like Hacker News reward a plain title, a working demo, and a founder who answers every comment for hours. Asking friends to upvote breaks the rules and gets posts penalized.","The first 100 users usually come from things that do not scale: personal outreach, emailing people who complained about the problem online, and onboarding each user by hand. You learn what to fix from these conversations."],"callout":["Pitfall","A launch spike is not traction. Most of the traffic leaves within a day, so judge a launch by how many signups come back the next week."],"lectures":[{"t":"The Best Way To Launch Your Startup (Startup School)","u":"https://www.youtube.com/watch?v=u36A-YTxiOw","by":"Y Combinator"},{"t":"How to Get Your First Customers (Startup School)","u":"https://www.youtube.com/watch?v=hyYCn_kAngI","by":"Y Combinator"},{"t":"How to Get Your First 10 Customers","u":"https://www.youtube.com/watch?v=_FBivfgOvuE","by":"Y Combinator"}],"papers":[{"t":"Do Things that Don't Scale","u":"https://paulgraham.com/ds.html","by":"Paul Graham"},{"t":"Show HN guidelines","u":"https://news.ycombinator.com/showhn.html","by":"Hacker News"},{"t":"How today's fastest growing B2B businesses found their first ten customers","u":"https://www.lennysnewsletter.com/p/how-todays-fastest-growing-b2b-businesses","by":"Lenny Rachitsky"},{"t":"How the biggest consumer apps got their first 1,000 users","u":"https://www.lennysnewsletter.com/p/how-the-biggest-consumer-apps-got","by":"Lenny Rachitsky"}],"reads":[{"t":"How to launch a dev tool on Hacker News","u":"https://www.markepear.dev/blog/dev-tool-hacker-news-launch","by":"Jakub Czakon (markepear)"},{"t":"How we got our first 1,000 users","u":"https://newsletter.posthog.com/p/how-we-got-our-first-1000-users","by":"James Hawkins (PostHog)"},{"t":"How to get the first 10 paying customers for your devtool company","u":"https://posthog.com/blog/first-10-paying-customers","by":"PostHog"}],"projects":[{"n":"Landing page with waitlist and analytics","l":"Beginner","d":"Ship a one-page site with a clear positioning headline, a demo GIF, a waitlist form stored in Postgres, and page analytics. Drive 200 visitors from two sources and measure signup rate per source."},{"n":"Run a real launch","l":"Intermediate","d":"Write a launch checklist, then post a Show HN (or a niche subreddit) with a working demo and reply to every comment for the first six hours. Record visits, signups, and how many signups are active one week later."}],"repos":[{"r":"onwidget/astrowind","d":"Astro + Tailwind template for fast landing pages and blogs"},{"r":"nextjs/saas-starter","d":"Next.js SaaS starter with auth, Stripe and a marketing page"},{"r":"HackerNews/API","d":"Official Hacker News API, useful for tracking your post's rank and comments"}]},{"id":"channels","title":"Distribution channels: SEO, content & communities","short":"Channels","level":"Intermediate","why":"Growth comes from one or two channels that fit your product and audience, so picking and testing channels on purpose beats doing a little of everything.","mins":600,"pre":["launch"],"ideas":["The Bullseye framework from Traction says to brainstorm all 19 channels, run cheap tests on the three most promising, then put nearly all effort into the one that works. At any stage one channel usually drives most growth.","SEO works when a page answers a query people already search, the page loads fast, and other sites link to it. Search engines crawl links, index page text, and rank by relevance plus authority, so clear titles, headings and internal links matter.","Programmatic SEO generates many pages from a dataset, such as one page per integration or per city. It works only when each page has unique useful data; thin template pages get ignored or penalized.","Building in public and technical content (postmortems, benchmarks, how-we-built-it posts) earn trust with developers. In communities, give useful answers first; people only click your link once they recognize your name."],"callout":["Intuition","Channels decay. Andrew Chen's law of shitty clickthroughs says every channel's response rate falls as more people copy it, so early and odd channels often work best."],"lectures":[{"t":"How to Get Users and Grow","u":"https://www.youtube.com/watch?v=T9ikpoF2GH0","by":"Gustaf Alstr\u00f6mer, Y Combinator"},{"t":"SEO Basics: What is SEO and Why is it Important?","u":"https://www.youtube.com/watch?v=btwC4zmewss","by":"Ahrefs"},{"t":"How Google Search crawls pages","u":"https://www.youtube.com/watch?v=JuK7NnfyEuc","by":"Google Search Central"}],"papers":[{"t":"SEO Starter Guide","u":"https://developers.google.com/search/docs/fundamentals/seo-starter-guide","by":"Google Search Central"},{"t":"In-depth guide to how Google Search works","u":"https://developers.google.com/search/docs/fundamentals/how-search-works","by":"Google Search Central"},{"t":"The Bullseye Framework for Getting Traction (excerpt from Traction)","u":"https://brianbalfour.com/essays/traction-the-bullseye-framework","by":"Brian Balfour"},{"t":"SEO: The Beginner's Guide","u":"https://ahrefs.com/seo","by":"Ahrefs"}],"reads":[{"t":"Strategic SEO for Startups","u":"https://www.kalzumeus.com/2010/01/24/startup-seo/","by":"Patrick McKenzie"},{"t":"The law of shitty clickthroughs","u":"https://andrewchen.com/the-law-of-shitty-clickthroughs/","by":"Andrew Chen"},{"t":"Learn In Public","u":"https://www.swyx.io/learn-in-public","by":"swyx"},{"t":"Programmatic SEO, Explained for Beginners","u":"https://ahrefs.com/blog/programmatic-seo/","by":"Ahrefs"}],"projects":[{"n":"Bullseye channel test","l":"Beginner","d":"List all 19 Traction channels for your product, pick three, and run a one-week test of each for under $50 (a post, a small ad, a community answer). Compare cost and time per signup and pick one channel."},{"n":"Programmatic SEO pages","l":"Intermediate","d":"Generate 30 to 100 pages from real data your product has (for example one page per model, integration, or dataset) with unique content, a sitemap, and internal links. Track indexed pages and impressions in Search Console for a month."}],"repos":[{"r":"withastro/starlight","d":"Astro docs and content site framework with good SEO defaults"},{"r":"onwidget/astrowind","d":"Astro template with blog, sitemap and SEO metadata built in"}]},{"id":"oss","title":"Open source & developer relations as distribution","short":"OSS & DevRel","level":"Intermediate","why":"For developer products, a public repo, great docs and helpful community work are often the main way people find, trust and adopt you.","mins":600,"pre":["launch","cli"],"ideas":["Open core gives away the product a single developer needs and charges for what teams and companies need: hosting, SSO, audit logs, scale and support. The free part spreads adoption; the paid part matches the buyer's budget.","Docs are marketing for developers. A quickstart that gets someone to a working result in five minutes does more than any ad, and the Di\u00e1taxis split (tutorials, how-to guides, reference, explanation) keeps docs usable as they grow.","Developer experience is the time and confusion between finding your tool and getting value. Measure it: time to first API call, install errors, and where people drop off in the quickstart.","GitHub stars come from launches, a clear README with a demo, and being listed where developers browse. Stars are a weak signal; weekly active installs, issues opened and contributors tell you more."],"callout":["Pitfall","Open source does not market itself. Projects grow when maintainers write, launch, answer issues fast and make the first run easy."],"lectures":[{"t":"How To Start A Dev Tools Company (Startup School)","u":"https://www.youtube.com/watch?v=z1aKRhRnVNk","by":"Y Combinator"},{"t":"Is Open Source the ultimate bottom-up growth strategy? (James Hawkins, PostHog)","u":"https://www.youtube.com/watch?v=kQk-PRYqpbM","by":"Scaling DevTools Podcast"},{"t":"RFS: Commercial open source companies","u":"https://www.youtube.com/watch?v=Q2X2kAJajs4","by":"Y Combinator"}],"papers":[{"t":"Open Source Guides: Finding users for your project","u":"https://opensource.guide/finding-users/","by":"GitHub"},{"t":"Di\u00e1taxis: a systematic approach to technical documentation","u":"https://diataxis.fr/","by":"Daniele Procida"},{"t":"PostHog Handbook: How we get users","u":"https://posthog.com/handbook/how-we-get-users","by":"PostHog"},{"t":"Open Source: From Community to Commercialization","u":"https://a16z.com/open-source-from-community-to-commercialization/","by":"a16z"}],"reads":[{"t":"How we monetized our open source devtool","u":"https://posthog.com/blog/open-source-business-models","by":"PostHog"},{"t":"How to seed, grow, and scale Developer Relations","u":"https://posthog.com/blog/seed-grow-scale-devrel","by":"PostHog"},{"t":"Developer marketing guide (by a dev tool startup CMO)","u":"https://www.markepear.dev/blog/developer-marketing-guide","by":"Jakub Czakon (markepear)"}],"projects":[{"n":"Five-minute quickstart","l":"Beginner","d":"Rewrite your project's README and docs as a quickstart, a how-to and a reference page. Watch three developers try it without help and time how long they take to get a first result."},{"n":"Open-source a core piece","l":"Intermediate","d":"Extract a useful part of your product (an SDK, CLI or eval tool) into a public repo with a license, demo GIF and contributing guide, then launch it. Track stars, installs, issues and how many visitors reach your paid product."}],"repos":[{"r":"PostHog/posthog","d":"Open-core product analytics company with a public monorepo"},{"r":"PostHog/posthog.com","d":"Source of PostHog's website, docs and public handbook"},{"r":"github/opensource.guide","d":"Community guides on starting and growing open source projects"}]},{"id":"analytics","title":"Product analytics & experimentation","short":"Analytics & A/B","level":"Intermediate","why":"Measuring activation, retention and experiments tells you whether changes actually help users, instead of guessing from launch spikes and opinions.","mins":720,"pre":["launch","datasql"],"ideas":["Activation is the first moment a new user gets real value, such as running a first query that returns an answer. Find it by checking which early actions best predict that a user is still around weeks later.","A retention cohort groups users by signup week and plots the share still active in each later week. If the curve flattens above zero you have a core of users who stay; if it slopes to zero, growth will not compound.","A North Star metric counts the value users get (for example weekly answered questions), not revenue or signups. Funnels then show where people drop between steps, so you fix the biggest leak first.","An A/B test randomly splits users and compares a metric. Fix the sample size before starting and do not stop when the p-value first dips under 0.05, because peeking many times makes false wins very likely."],"callout":["Pitfall","Most ideas fail to move the metric when tested; at large companies only about a third of experiments win. With few users, test big changes, because small effects need huge samples to detect."],"lectures":[{"t":"The ultimate guide to A/B testing (Ronny Kohavi)","u":"https://www.youtube.com/watch?v=hEzpiDuYFoE","by":"Lenny's Podcast"},{"t":"How To Keep Your Users (Startup School)","u":"https://www.youtube.com/watch?v=VNxBZ7ka5J0","by":"Y Combinator"},{"t":"How to Set KPIs and Goals","u":"https://www.youtube.com/watch?v=lL6GdUHIBsM","by":"Adora Cheung, Y Combinator"}],"papers":[{"t":"How Not To Run an A/B Test","u":"https://www.evanmiller.org/how-not-to-run-an-ab-test.html","by":"Evan Miller"},{"t":"Controlled experiments on the web: survey and practical guide","u":"https://exp-platform.com/Documents/GuideControlledExperiments.pdf","by":"Kohavi, Longbotham, Sommerfield, Henne"},{"t":"Trustworthy Online Controlled Experiments (book site)","u":"https://experimentguide.com/","by":"Kohavi, Tang, Xu"},{"t":"North Star Playbook","u":"https://amplitude.com/books/north-star","by":"Amplitude"}],"reads":[{"t":"What is good retention","u":"https://www.lennysnewsletter.com/p/what-is-good-retention-issue-29","by":"Lenny Rachitsky"},{"t":"How we found our activation metric (and how you can too)","u":"https://posthog.com/product-engineers/activation-metrics","by":"PostHog"},{"t":"A software engineer's guide to A/B testing","u":"https://posthog.com/product-engineers/ab-testing-guide-for-engineers","by":"PostHog"},{"t":"A/B test sample size calculator","u":"https://www.evanmiller.org/ab-testing/sample-size.html","by":"Evan Miller"}],"projects":[{"n":"Event tracking and cohort chart","l":"Beginner","d":"Instrument signup, activation and key actions as events in Postgres or PostHog, then write SQL for a weekly retention cohort table and a signup-to-activation funnel. Find the step with the biggest drop."},{"n":"A/B test done right","l":"Intermediate","d":"Pick one change (onboarding copy or a default setting), compute the needed sample size up front, randomize by user id with a feature flag, and analyze only at the planned end. Also run an A/A test to confirm the split is fair."}],"repos":[{"r":"PostHog/posthog","d":"Open-source product analytics, funnels, cohorts and experiments"},{"r":"growthbook/growthbook","d":"Open-source feature flags and A/B testing with a stats engine"},{"r":"plausible/analytics","d":"Lightweight privacy-friendly web analytics you can self-host"}]},{"id":"pricing","title":"Pricing & monetization for AI products","short":"Pricing","level":"Intermediate","why":"AI products carry real per-request costs, so pricing must cover inference spend and still match how customers see value.","mins":600,"pre":["costlat","analytics"],"ideas":["Seat pricing charges per user and is easy to predict. Usage pricing charges per unit (tokens, requests, documents) and tracks cost, but bills can surprise customers; many AI products mix a base plan with included credits and overage.","Unit economics for an LLM product: cost per active user is roughly requests per user times tokens per request times price per token, plus hosting. Gross margin is (price minus that cost) divided by price, and heavy users can push it negative.","A free tier is a marketing cost. Cap it by usage, not by time alone, so curious users can reach value while a few heavy free users cannot run up your inference bill.","Stripe Billing models products, prices, customers and subscriptions; usage is reported as meter events and billed each period. Your app should trust webhooks (payment succeeded, subscription updated) as the source of truth for who has access."],"callout":["Intuition","Developers usually underprice. Patrick McKenzie's advice is to charge more, price by the value to the customer, and offer a higher tier, since a few large customers often bring most revenue."],"lectures":[{"t":"Startup Pricing 101","u":"https://www.youtube.com/watch?v=jwXlo9gy_k4","by":"Kevin Hale, Y Combinator"},{"t":"Pricing your AI product: Lessons from 400+ companies","u":"https://www.youtube.com/watch?v=NR85H55eYkM","by":"Madhavan Ramanujam, Lenny's Podcast"},{"t":"Mastering AI Pricing","u":"https://www.youtube.com/watch?v=CrqPcIZOOXA","by":"Mayank Pant (Stripe), AI Engineer"}],"papers":[{"t":"Pricing low-touch SaaS (Stripe Atlas guide)","u":"https://stripe.com/guides/atlas/saas-pricing","by":"Patrick McKenzie"},{"t":"Usage-based billing","u":"https://docs.stripe.com/billing/subscriptions/usage-based","by":"Stripe docs"},{"t":"Using webhooks with subscriptions","u":"https://docs.stripe.com/billing/subscriptions/webhooks","by":"Stripe docs"},{"t":"The New Business of AI (and How It's Different From Traditional Software)","u":"https://a16z.com/the-new-business-of-ai-and-how-its-different-from-traditional-software/","by":"a16z"}],"reads":[{"t":"Doubling SaaS Revenue By Changing The Pricing Model","u":"https://www.kalzumeus.com/2012/08/13/doubling-saas-revenue/","by":"Patrick McKenzie"},{"t":"The state of AI pricing at 40 leading startups","u":"https://growthunhinged.com/p/how-ai-apps-make-money","by":"Kyle Poyar"},{"t":"The Black Arts of SaaS Pricing","u":"https://training.kalzumeus.com/newsletters/archive/saas_pricing","by":"Patrick McKenzie"}],"projects":[{"n":"Unit economics model","l":"Beginner","d":"Build a spreadsheet or notebook from your real logs: tokens per request, requests per user per month, model prices and hosting. Compute cost per user and gross margin for light, median and heavy users under two price plans."},{"n":"Stripe metered billing","l":"Intermediate","d":"Add Stripe Checkout, a subscription with included credits plus metered overage, and a webhook handler in FastAPI that grants and revokes access. Test upgrade, failed payment and cancel flows in test mode and check invoices match usage."}],"repos":[{"r":"stripe-samples/subscription-use-cases","d":"Stripe's reference code for fixed, per-seat and usage-based subscriptions"},{"r":"getlago/lago","d":"Open-source metering and usage-based billing"},{"r":"openmeterio/openmeter","d":"Open-source usage metering for AI and API products"}]}]},{"id":"next","title":"Distributed systems & enterprise","level":"Advanced","intro":"Consistency, replication, system design and the requirements of bigger customers.","phase":9,"optional":false,"topics":[{"id":"consist","title":"Consistency, CAP & consensus","short":"CAP & consensus","level":"Advanced","why":"When data lives on several machines, you must choose what readers may see during failures, and consensus is how machines agree despite them.","mins":1200,"pre":["txn","concur","internet"],"ideas":["Linearizability means the system behaves like one copy: once a write is acknowledged, every later read sees it. Eventual consistency only promises replicas converge if writes stop, so a read may return old data.","CAP says that during a network partition a system must either refuse some requests (stay consistent) or answer with possibly stale data (stay available). Outside partitions the real trade-off is consistency versus latency.","Consensus gets a group of nodes to agree on a sequence of values even if a minority crash. With 2f+1 nodes it tolerates f failures, because any two majorities overlap in at least one node that remembers the last decision.","Raft elects a leader with randomized timeouts. The leader appends commands to its log, replicates them, and commits an entry once a majority has stored it; a new leader must have every committed entry, so nothing committed is lost."],"callout":["Pitfall","Clocks on different machines drift and jump. Never decide which write came last by comparing wall-clock timestamps from different servers; use a single leader, version numbers or logical clocks."],"lectures":[{"t":"Raft lecture (Raft user study)","u":"https://www.youtube.com/watch?v=YbZ3zDzDnrw","by":"Diego Ongaro"},{"t":"Distributed Systems 6.1: Consensus","u":"https://www.youtube.com/watch?v=rN6ma561tak","by":"Martin Kleppmann"},{"t":"Lecture 6: Fault Tolerance: Raft (1)","u":"https://www.youtube.com/watch?v=64Zp3tzNbpE","by":"MIT 6.824: Distributed Systems"}],"papers":[{"t":"In Search of an Understandable Consensus Algorithm (Raft)","u":"https://raft.github.io/raft.pdf","by":"Diego Ongaro & John Ousterhout"},{"t":"Paxos Made Simple","u":"https://lamport.azurewebsites.net/pubs/paxos-simple.pdf","by":"Leslie Lamport"},{"t":"CAP Twelve Years Later: How the \"Rules\" Have Changed","u":"https://www.infoq.com/articles/cap-twelve-years-later-how-the-rules-have-changed/","by":"Eric Brewer"},{"t":"Distributed Systems lecture notes (Cambridge)","u":"https://www.cl.cam.ac.uk/teaching/2122/ConcDisSys/dist-sys-notes.pdf","by":"Martin Kleppmann"}],"reads":[{"t":"The Secret Lives of Data: Raft (interactive)","u":"https://thesecretlivesofdata.com/raft/","by":"Ben Johnson"},{"t":"Please stop calling databases CP or AP","u":"https://martin.kleppmann.com/2015/05/11/please-stop-calling-databases-cp-or-ap.html","by":"Martin Kleppmann"},{"t":"Consistency Models (map)","u":"https://jepsen.io/consistency","by":"Kyle Kingsbury, Jepsen"}],"projects":[{"n":"Raft in Python","l":"Advanced","d":"Implement leader election and log replication for 3-5 nodes over asyncio TCP or HTTP. Kill the leader and partition nodes, and check that no committed entry is ever lost or reordered."},{"n":"Maelstrom challenges","l":"Advanced","d":"Solve the Maelstrom/Gossip Glomers workloads (broadcast, counters, a key-value store) and let its Jepsen-style checker find consistency bugs under injected partitions."}],"repos":[{"r":"etcd-io/raft","d":"Production Raft library behind etcd and CockroachDB"},{"r":"hashicorp/raft","d":"Readable Go Raft implementation used by Consul"},{"r":"jepsen-io/maelstrom","d":"Workbench for writing toy distributed systems and testing them"}]},{"id":"replication","title":"Replication & sharding","short":"Replication","level":"Advanced","why":"Replication copies data for availability and read scale, and sharding splits data so one database no longer has to hold or serve everything.","mins":900,"pre":["consist","indexes","nosql"],"ideas":["Single-leader replication sends all writes to one primary, which streams its log to followers. Asynchronous followers lag, so a user may write then read stale data from a replica; route a user's reads to the primary right after their own writes.","Synchronous replication waits for a follower before acknowledging, which avoids data loss on failover but adds latency and stalls if the follower is down. Most setups make one follower synchronous and the rest async.","Leaderless systems like Dynamo write to N replicas and wait for W acknowledgements, and read from R. If R + W > N, every read overlaps a node with the latest write, and conflicting versions are reconciled later.","Sharding splits rows by a key. Hash partitioning spreads load evenly but breaks range scans; range partitioning keeps ranges together but can create hot shards. Pick a key, like tenant id, so most queries hit one shard."],"callout":["Pitfall","Shard late. Cross-shard joins, transactions and unique constraints become your problem, and resharding is painful. A bigger Postgres with read replicas goes much further than most teams expect."],"lectures":[{"t":"Distributed Systems 5.1: Replication","u":"https://www.youtube.com/watch?v=mBUCF1WGI_I","by":"Martin Kleppmann"},{"t":"Lecture 4: Primary-Backup Replication","u":"https://www.youtube.com/watch?v=M_teob23ZzY","by":"MIT 6.824: Distributed Systems"},{"t":"7 Must-know Strategies to Scale Your Database","u":"https://www.youtube.com/watch?v=_1IKwnbscQU","by":"ByteByteGo"}],"papers":[{"t":"Dynamo: Amazon's Highly Available Key-value Store","u":"https://www.allthingsdistributed.com/files/amazon-dynamo-sosp2007.pdf","by":"DeCandia et al., Amazon (SOSP 2007)"},{"t":"PostgreSQL docs: High Availability, Load Balancing, and Replication","u":"https://www.postgresql.org/docs/current/high-availability.html","by":"PostgreSQL"},{"t":"Eventually Consistent","u":"https://www.allthingsdistributed.com/2008/12/eventually_consistent.html","by":"Werner Vogels"}],"reads":[{"t":"Herding elephants: Lessons learned from sharding Postgres at Notion","u":"https://www.notion.com/blog/sharding-postgres-at-notion","by":"Garrett Fidalgo, Notion"},{"t":"How Figma's Databases Team Lived to Tell the Scale","u":"https://www.figma.com/blog/how-figmas-databases-team-lived-to-tell-the-scale/","by":"Sammy Steele, Figma"},{"t":"Principles of Sharding for Relational Databases","u":"https://www.citusdata.com/blog/2017/08/09/principles-of-sharding-for-relational-databases/","by":"Craig Kerstiens, Citus Data"}],"projects":[{"n":"Read replica with lag","l":"Intermediate","d":"Set up Postgres streaming replication in Docker Compose and route API reads to the replica. Measure replication lag under write load and fix read-your-writes for the user who just wrote."},{"n":"Tenant-sharded API","l":"Advanced","d":"Split your data across two or three Postgres instances by hashed tenant id with a routing layer in the API. Then add a shard and write a migration that moves tenants with no lost writes."}],"repos":[{"r":"citusdata/citus","d":"Postgres extension for distributed tables and sharding"},{"r":"vitessio/vitess","d":"Sharding system for MySQL built at YouTube"}]},{"id":"sysdesign","title":"System design practice","short":"System design","level":"Advanced","why":"System design is combining caches, queues, databases and replication into one architecture that meets stated scale and reliability needs, and explaining the trade-offs.","mins":2400,"pre":["caching","queues","lb","replication","events","reliab"],"ideas":["Start with requirements: the core features, then numbers like daily users, reads versus writes, data size and latency targets. These decide almost everything else, so get them before drawing boxes.","Do rough estimates. 1 million requests a day is about 12 per second on average, and peaks are often 5-10x the average. Knowing that memory is about 100x faster than an SSD read and a cross-region round trip is about 100 ms tells you what will be slow.","Draw the simple version first (client, load balancer, stateless API, one database) and then fix the bottlenecks you can name: a cache for hot reads, a queue for slow writes, replicas or shards when one database is not enough.","Every choice is a trade-off. Say what you gain and what you give up, such as staleness for speed with a cache, or complexity for scale with sharding, and how you would know in production if it was the wrong call."],"callout":["Pitfall","Designing for Google scale on day one adds Kafka, microservices and sharding to a problem one Postgres box could serve. Match the design to the numbers you estimated."],"lectures":[{"t":"System Design Interview: A Step-By-Step Guide","u":"https://www.youtube.com/watch?v=i7twT3x5yv8","by":"ByteByteGo"},{"t":"How to Answer Any System Design Interview (The Delivery Framework)","u":"https://www.youtube.com/watch?v=FkLAEAcQXcc","by":"Hello Interview"},{"t":"Scaling Instagram Infrastructure","u":"https://www.youtube.com/watch?v=hnpzNAPiC0E","by":"InfoQ"}],"papers":[{"t":"On Designing and Deploying Internet-Scale Services","u":"https://www.usenix.org/legacy/event/lisa07/tech/full_papers/hamilton/hamilton.pdf","by":"James Hamilton (LISA 2007)"},{"t":"Google SRE book (free online)","u":"https://sre.google/sre-book/table-of-contents/","by":"Google"},{"t":"Workload isolation using shuffle-sharding","u":"https://aws.amazon.com/builders-library/workload-isolation-using-shuffle-sharding/","by":"Colm MacC\u00e1rthaigh, Amazon Builders' Library"}],"reads":[{"t":"Latency Numbers Every Programmer Should Know (interactive)","u":"https://colin-scott.github.io/personal_website/research/interactive_latency.html","by":"Colin Scott"},{"t":"System Design in a Hurry","u":"https://www.hellointerview.com/learn/system-design/in-a-hurry/introduction","by":"Hello Interview"},{"t":"How Discord Stores Trillions of Messages","u":"https://discord.com/blog/how-discord-stores-trillions-of-messages","by":"Bo Ingram, Discord"}],"projects":[{"n":"Design and build a URL shortener","l":"Intermediate","d":"Write a one-page design for 100M redirects a day with estimates, then build it on your FastAPI stack with Redis caching and a Postgres store. Load test to check your estimates for QPS and cache hit rate."},{"n":"Weekly design review","l":"Advanced","d":"Each week design one classic system (news feed, chat, rate limiter, ticket booking) on paper with numbers and trade-offs, then compare to a published case study and note what you missed."}],"repos":[{"r":"donnemartin/system-design-primer","d":"The classic free system design study guide"},{"r":"ByteByteGoHq/system-design-101","d":"Visual explanations of system design concepts"},{"r":"binhnguy
