<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>Engineer's Atlas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,500;7..72,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: quiet reader. Left index (grouped, numbered), one reading column (~68ch), right "on this page" at wide widths. Hairlines, no cards. */
:root{
  --bg:#fafaf8; --fg:#24262b; --muted:#6c707a; --faint:#a3a7ae; --line:#e6e6e1; --hover:#f0f0ec; --accent:#2f6f73; --accent-weak:#e3efef; --done:#3d7a4f;
  --serif:"Literata",Georgia,"Times New Roman",serif; --sans:"IBM Plex Sans",system-ui,-apple-system,sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --fs:17px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17181b;--fg:#cfcfca;--muted:#8d9098;--faint:#5d6068;--line:#2a2c31;--hover:#202227;--accent:#7fb8b9;--accent-weak:#1f2d2e;--done:#7fb88e;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17181b;--fg:#cfcfca;--muted:#8d9098;--faint:#5d6068;--line:#2a2c31;--hover:#202227;--accent:#7fb8b9;--accent-weak:#1f2d2e;--done:#7fb88e;color-scheme:dark}
/* Reader's own choice wins over system */
:root[data-read="light"]{--bg:#fafaf8;--fg:#24262b;--muted:#6c707a;--faint:#a3a7ae;--line:#e6e6e1;--hover:#f0f0ec;--accent:#2f6f73;--accent-weak:#e3efef;--done:#3d7a4f;color-scheme:light}
:root[data-read="paper"]{--bg:#f3ead8;--fg:#3a3126;--muted:#7a6a55;--faint:#ad9d86;--line:#e0d4bd;--hover:#ece0c8;--accent:#8a5a2b;--accent-weak:#eadbc0;--done:#5b7a3a;color-scheme:light}
:root[data-read="night"]{--bg:#17181b;--fg:#cfcfca;--muted:#8d9098;--faint:#5d6068;--line:#2a2c31;--hover:#202227;--accent:#7fb8b9;--accent-weak:#1f2d2e;--done:#7fb88e;color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font:15px/1.6 var(--sans);-webkit-font-smoothing:antialiased;transition:background .2s,color .2s}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
button{font:inherit;color:inherit}
.shell{display:grid;grid-template-columns:272px minmax(0,1fr);min-height:100%}
/* index */
.index{position:sticky;top:env(safe-area-inset-top,0px);height:calc(100vh - env(safe-area-inset-top,0px));overflow:auto;border-right:1px solid var(--line);padding:22px 14px 40px max(18px,env(safe-area-inset-left,0px));font-size:13.5px}
.logo{display:flex;align-items:baseline;gap:8px;font:600 15px var(--sans);letter-spacing:-.01em;padding:0 8px 14px}
.logo small{font:400 11px var(--mono);color:var(--muted)}
.find{width:100%;font:13.5px var(--sans);padding:7px 10px;border:1px solid var(--line);background:transparent;color:var(--fg);border-radius:6px;margin-bottom:14px}
.find::placeholder{color:var(--faint)}
.navtop a,.part a{display:flex;gap:10px;align-items:baseline;padding:4px 8px;border-radius:5px;color:var(--muted)}
.navtop a:hover,.part a:hover{background:var(--hover);color:var(--fg)}
.navtop a[aria-current="page"],.part a[aria-current="page"]{color:var(--fg);background:var(--hover);font-weight:500}
.navtop{margin-bottom:16px}
.part{margin-bottom:14px}
.part h3{font:500 10.5px var(--mono);text-transform:uppercase;letter-spacing:.09em;color:var(--faint);margin:0 0 4px;padding:0 8px;display:flex;justify-content:space-between}
.part ol{list-style:none;margin:0;padding:0}
.part .n{font:400 11px var(--mono);color:var(--faint);min-width:26px}
.part .tick{margin-left:auto;color:var(--done);font-size:11px}
/* top strip */
.strip{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));font-size:13px;color:var(--muted)}
.crumb{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumb a:hover{color:var(--fg)}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:transparent;padding:4px 10px;cursor:pointer;color:var(--muted);font-size:12.5px}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--hover);color:var(--fg)}
.menu{display:none;border:1px solid var(--line);background:transparent;border-radius:6px;padding:4px 10px;cursor:pointer}
/* reading column */
.page{display:grid;grid-template-columns:minmax(0,1fr) 200px;gap:48px;padding-block:44px 96px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));max-width:1080px}
.page.wide{grid-template-columns:minmax(0,1fr)}
article{max-width:68ch;min-width:0}
.page.wide article{max-width:none}
.eyebrow{font:500 11.5px var(--mono);text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:0 0 10px}
h1{font:600 clamp(28px,4vw,38px)/1.15 var(--sans);letter-spacing:-.022em;margin:0 0 14px;text-wrap:balance}
.lede{font:400 calc(var(--fs) + 1px)/1.65 var(--serif);color:var(--muted);margin:0 0 18px}
.meta{display:flex;flex-wrap:wrap;gap:6px 18px;font:400 12.5px var(--mono);color:var(--muted);padding-bottom:22px;border-bottom:1px solid var(--line);margin-bottom:8px;align-items:center}
.meta label{display:flex;gap:6px;align-items:center;cursor:pointer;color:var(--fg)}
.meta input{accent-color:var(--done);width:15px;height:15px}
h2{font:600 19px/1.3 var(--sans);letter-spacing:-.01em;margin:44px 0 14px;scroll-margin-top:70px;display:flex;gap:12px;align-items:baseline}
h2 .sn{font:400 12px var(--mono);color:var(--faint)}
.prose{font:400 var(--fs)/1.75 var(--serif)}
.prose p{margin:0 0 1em}
.ideas{margin:0;padding:0;list-style:none;counter-reset:i}
.ideas li{counter-increment:i;display:grid;grid-template-columns:30px 1fr;padding:8px 0;border-top:1px solid var(--line)}
.ideas li:first-child{border-top:0}
.ideas li::before{content:counter(i,decimal-leading-zero);font:400 12px/2.2 var(--mono);color:var(--faint)}
.note{border-left:2px solid var(--accent);padding:4px 0 4px 16px;margin:20px 0 0;font:400 calc(var(--fs) - 1px)/1.7 var(--serif)}
.note b{display:block;font:500 11px var(--mono);text-transform:uppercase;letter-spacing:.09em;color:var(--accent);margin-bottom:2px}
.list{list-style:none;margin:0;padding:0}
.list li{border-top:1px solid var(--line)}
.list li:last-child{border-bottom:1px solid var(--line)}
.list a{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 16px;padding:11px 4px;align-items:baseline}
.list a:hover{background:var(--hover)}
.list .t{font:500 15px/1.4 var(--sans)}
.list a:hover .t{color:var(--accent)}
.list .b{grid-column:1;font-size:13px;color:var(--muted)}
.list .d{grid-row:1/span 2;grid-column:2;font:400 11px var(--mono);color:var(--faint);align-self:center}
.proj{display:grid;gap:0}
.proj div{border-top:1px solid var(--line);padding:12px 4px}
.proj div:last-child{border-bottom:1px solid var(--line)}
.proj h4{margin:0 0 3px;font:500 15px var(--sans);display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.proj p{margin:0;font:400 calc(var(--fs) - 1.5px)/1.65 var(--serif);color:var(--muted)}
.proj a.from{font:400 12px var(--mono);color:var(--accent)}
.lv{font:400 10.5px var(--mono);text-transform:uppercase;letter-spacing:.07em;color:var(--muted);border:1px solid var(--line);border-radius:3px;padding:0 5px}
.fits{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;gap:10px;align-items:center;font-size:13.5px}
.fits .col{display:grid;gap:6px;min-width:0}
.fits .col.mid{justify-items:center}
.fits .hd{font:400 10.5px var(--mono);text-transform:uppercase;letter-spacing:.09em;color:var(--faint)}
.fits a,.fits span.me{border:1px solid var(--line);border-radius:5px;padding:5px 9px;display:block;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fits a:hover{border-color:var(--accent);color:var(--accent)}
.fits span.me{border-color:var(--fg);font-weight:500;text-align:center}
.fits .arr{color:var(--faint)}
.fits .none{color:var(--faint);font-size:12.5px}
.pager{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:56px;border-top:1px solid var(--line);padding-top:18px}
.pager a{display:grid;gap:2px;padding:6px 0}
.pager a span{font:400 11px var(--mono);color:var(--faint);text-transform:uppercase;letter-spacing:.08em}
.pager a b{font-weight:500}
.pager a:hover b{color:var(--accent)}
.pager .next{text-align:right}
aside.toc{position:sticky;top:76px;align-self:start;font-size:12.5px}
aside.toc h5{font:500 10.5px var(--mono);text-transform:uppercase;letter-spacing:.09em;color:var(--faint);margin:0 0 8px}
aside.toc a{display:block;padding:3px 0 3px 10px;border-left:1px solid var(--line);color:var(--muted)}
aside.toc a:hover,aside.toc a.on{color:var(--fg);border-left-color:var(--fg)}
/* map */
.mapwrap{overflow-x:auto;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:18px 0 8px}
.map{display:block}
.map .edge{fill:none;stroke:var(--line);stroke-width:1.2}
.map .edge.hot{stroke:var(--accent);stroke-width:1.8}
.map .node rect{fill:var(--bg);stroke:var(--faint);stroke-width:1}
.map .node text{fill:var(--fg);font:500 12px var(--sans)}
.map .node .cn{fill:var(--faint);font:400 9.5px var(--mono)}
.map .node.done rect{fill:var(--accent-weak);stroke:var(--done)}
.map .node.hot rect{stroke:var(--accent);stroke-width:1.8}
.map .node.dim{opacity:.35}
.map .node{cursor:pointer}
.map .tier{fill:var(--faint);font:400 10px var(--mono)}
.legend{font-size:12.5px;color:var(--muted);display:flex;gap:18px;flex-wrap:wrap}
.legend i{display:inline-block;width:12px;height:12px;border:1px solid var(--faint);border-radius:3px;vertical-align:-2px;margin-right:6px}
.legend i.d{background:var(--accent-weak);border-color:var(--done)}
.chapters{list-style:none;margin:0;padding:0;counter-reset:c}
.chapters li{border-top:1px solid var(--line);padding:14px 0;display:grid;grid-template-columns:44px 1fr auto;gap:4px 12px;align-items:baseline}
.chapters li:last-child{border-bottom:1px solid var(--line)}
.chapters .n{font:400 12px var(--mono);color:var(--faint)}
.chapters b{font:500 16px var(--sans)}
.chapters b a:hover{color:var(--accent)}
.chapters p{grid-column:2;margin:0;font:400 calc(var(--fs) - 2px)/1.6 var(--serif);color:var(--muted)}
.chapters .pc{font:400 12px var(--mono);color:var(--muted)}
.stats{display:flex;gap:28px;flex-wrap:wrap;font:400 12px var(--mono);color:var(--muted);margin:6px 0 4px}
.stats b{display:block;font:500 22px var(--sans);color:var(--fg);letter-spacing:-.02em}
.day{margin-top:36px}
.day h2{margin-top:0}
.empty{color:var(--muted);font:400 var(--fs)/1.7 var(--serif)}
.filter{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 4px}
.filter button{border:1px solid var(--line);background:transparent;border-radius:5px;padding:4px 10px;cursor:pointer;color:var(--muted);font-size:13px}
.filter button[aria-pressed="true"]{color:var(--fg);border-color:var(--fg)}
.mapgrid{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:28px;align-items:start;margin-top:14px}
.mapgrid .mapwrap{margin:0}
.map .node.sel rect{stroke:var(--fg);stroke-width:2}
.legend i.s{border-color:var(--accent);border-width:2px}
.pathpanel{position:sticky;top:70px;border-left:1px solid var(--line);padding-left:20px;font-size:13.5px;max-height:calc(100vh - 100px);overflow:auto}
.pathpanel h5{font:500 10.5px var(--mono);text-transform:uppercase;letter-spacing:.09em;color:var(--faint);margin:0 0 6px}
.pp-title{display:block;font:600 16px/1.3 var(--sans);margin-bottom:4px}
.pp-sum,.pp-empty{color:var(--muted);margin:0 0 12px;font:400 calc(var(--fs) - 3px)/1.6 var(--serif)}
.pp{list-style:none;margin:0;padding:0;position:relative}
.pp::before{content:"";position:absolute;left:11px;top:8px;bottom:8px;border-left:1px dashed var(--line)}
.pp a{display:grid;grid-template-columns:24px 1fr auto;gap:8px;padding:4px 0;align-items:baseline;position:relative}
.pp a:hover span:nth-child(2){color:var(--accent)}
.pp .pn{font:400 10.5px var(--mono);color:var(--faint);background:var(--bg);text-align:center}
.pp .pt{font:400 10.5px var(--mono);color:var(--faint)}
.pp li.ok span:nth-child(2){color:var(--muted);text-decoration:line-through;text-decoration-color:var(--faint)}
.pp li.ok .pt{color:var(--done)}
.pp li.target a{font-weight:600}
.pp-next{display:flex;flex-wrap:wrap;gap:6px}
.pp-next a{border:1px solid var(--line);border-radius:5px;padding:3px 8px;font-size:12.5px}
.pp-next a:hover{border-color:var(--accent);color:var(--accent)}
.pp-open{display:inline-block;margin-top:16px;color:var(--accent);font-weight:500}
.fitnote{margin:12px 0 0;font:400 calc(var(--fs) - 2px)/1.6 var(--serif);color:var(--muted)}
.fitnote a{color:var(--accent)}
.studyfirst{font-family:var(--mono);font-size:11.5px;color:var(--accent)}
.caps .steps{margin:8px 0 6px;padding-left:20px;font:400 calc(var(--fs) - 2px)/1.6 var(--serif)}
.caps .uses{font:400 12px var(--mono)!important;color:var(--faint)!important}
.caps .uses a{color:var(--accent)}
@media (max-width:1180px){.mapgrid{grid-template-columns:1fr}.pathpanel{order:-1;position:static;border-left:0;border-top:1px solid var(--line);padding:16px 0 0;max-height:none}}
.phasehd{font:600 11px var(--sans);color:var(--fg);margin:18px 8px 8px;padding-top:12px;border-top:1px solid var(--line)}
.phasehd:first-of-type{border-top:0;padding-top:0}
.focusnote{margin:0 8px 10px;font-size:12.5px;color:var(--muted)}
.focusnote button{border:0;background:none;color:var(--accent);padding:0;cursor:pointer;font-size:12.5px}
.focusbtn{border:1px solid var(--line);background:transparent;border-radius:6px;padding:4px 10px;cursor:pointer;color:var(--muted);font-size:12.5px}
.focusbtn[aria-pressed="true"]{color:var(--bg);background:var(--fg);border-color:var(--fg)}
.map .node.ctx rect{stroke-dasharray:3 3;fill:transparent}
.map .node.ctx text{fill:var(--muted)}
.legend i.c{border-style:dashed}
.phasebar{display:flex;gap:6px;margin:26px 0 18px;align-items:flex-end}
.seg2{flex:1;height:44px;border:1px solid var(--line);border-radius:4px;position:relative;overflow:hidden;display:flex;align-items:flex-end;justify-content:center}
.seg2 i{position:absolute;left:0;right:0;bottom:0;background:var(--accent-weak)}
.seg2 span{position:relative;font:400 11px var(--mono);color:var(--muted);padding-bottom:4px}
.seg2.now{border-color:var(--fg)}
.seg2.now span{color:var(--fg);font-weight:500}
.continue{border-left:2px solid var(--accent);padding:6px 0 6px 18px;display:grid;gap:6px;max-width:68ch}
.continue a{display:grid;gap:2px}
.continue a b{font:600 20px/1.3 var(--sans);letter-spacing:-.01em}
.continue a:hover b{color:var(--accent)}
.continue a span{font:400 calc(var(--fs) - 1px)/1.6 var(--serif);color:var(--muted)}
.continue .muted{font:400 12px var(--mono);color:var(--faint)}
.phases{list-style:none;margin:28px 0 0;padding:0;display:grid;gap:30px}
.phase .ph-hd{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:12px;align-items:baseline}
.ph-n{font:500 13px var(--mono);color:var(--faint)}
.phase.now .ph-n{color:var(--accent)}
.ph-t b{display:block;font:600 18px/1.3 var(--sans)}
.ph-t span{font:400 calc(var(--fs) - 2px)/1.55 var(--serif);color:var(--muted)}
.ph-s{font:400 11.5px var(--mono);color:var(--muted);white-space:nowrap}
.phase .bar{height:3px;background:var(--line);margin:10px 0 6px 52px;border-radius:2px;overflow:hidden}
.phase .bar i{display:block;height:100%;background:var(--done)}
.ph-topics{list-style:none;margin:0 0 0 52px;padding:0}
.ph-topics a{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;padding:5px 0;border-bottom:1px solid var(--line);align-items:baseline;font-size:14px}
.ph-topics a:hover span:nth-child(2){color:var(--accent)}
.ph-topics .pn,.ph-topics .pt{font:400 11px var(--mono);color:var(--faint)}
.ph-topics li.ok span:nth-child(2){color:var(--muted)}
.ph-topics li.ok .pt{color:var(--done)}
.ph-topics li.cur a{font-weight:600}
.ph-topics li.cur .pt{color:var(--accent)}
.phase.later .ph-topics,.phase.done .ph-topics{display:none}
.phase.later .ph-hd,.phase.opt .ph-hd{opacity:.75}
.phase.later:hover .ph-topics,.phase.done:hover .ph-topics{display:block}
.milestone{margin:10px 0 0 52px;display:flex;gap:10px;flex-wrap:wrap;align-items:baseline;font-size:13.5px}
.milestone span{font:500 10.5px var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--accent)}
.milestone a{color:var(--accent)}
@media (max-width:860px){.phase .bar,.ph-topics,.milestone{margin-left:0}.phase .ph-hd{grid-template-columns:32px minmax(0,1fr)}.ph-s{grid-column:2}}
.continue.alongside{margin-top:14px;border-left-color:var(--faint)}
.method h3{font:600 16px var(--sans);margin:28px 0 8px}
.method ul,.method ol{font:400 var(--fs)/1.7 var(--serif);padding-left:22px}
.method li{margin:3px 0}
.method .warn li::marker{content:"✕  ";color:var(--faint)}
.secchip{color:var(--accent)}
.lang{font:500 10px var(--mono);text-transform:uppercase;letter-spacing:.06em;border:1px solid var(--line);border-radius:3px;padding:0 4px}
.lang.ar{color:var(--accent);border-color:var(--accent)}
.ph-note{margin:6px 0 4px 52px;display:grid;gap:4px;font:400 calc(var(--fs) - 3px)/1.55 var(--serif);color:var(--muted)}
.ph-note b{font:500 10.5px var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--accent);margin-right:8px}
@media (max-width:860px){.ph-note{margin-left:0}}
.tt-det{margin:8px 0 0 52px}.tt-det summary{cursor:pointer;font:500 12px var(--mono);color:var(--accent);padding:4px 0}
.tt{width:100%;border-collapse:collapse;font-size:13.5px;margin:8px 0 4px}
.tt th{text-align:left;font:500 10.5px var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--faint);border-bottom:1px solid var(--line);padding:6px 8px 6px 0}
.tt td{border-bottom:1px solid var(--line);padding:7px 10px 7px 0;vertical-align:top;font:400 calc(var(--fs) - 2.5px)/1.55 var(--serif)}
.tt td:first-child{font:500 12.5px var(--sans);white-space:nowrap;color:var(--fg)}
.tt td.n{font:400 12px var(--mono);color:var(--muted);text-align:right;width:44px}
.tt tr.tot td{color:var(--muted);border-bottom:0}
.tt-wk-h{font:500 10.5px var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--faint);margin:12px 0 4px}
.tt-wk{margin:0;padding-left:20px;font:400 calc(var(--fs) - 2.5px)/1.6 var(--serif);color:var(--muted)}
@media (max-width:860px){.tt-det{margin-left:0}.tt td:first-child{white-space:normal}}.method a{color:var(--accent);text-decoration:underline;text-underline-offset:3px}
.trks{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px;margin:22px 0}
.trk{border:1px solid var(--line);border-radius:8px;padding:18px;display:grid;gap:8px;align-content:start}
.trk.on{border-color:var(--accent)}
.trk b{font:600 19px var(--sans)}
.trk p{margin:0;font:400 calc(var(--fs) - 1.5px)/1.6 var(--serif);color:var(--muted)}
.trk ol{margin:4px 0;padding-left:20px;font-size:13px;color:var(--muted)}
.trkbtn{justify-self:start;border:1px solid var(--accent);color:var(--accent);background:transparent;border-radius:6px;padding:6px 12px;cursor:pointer}
.muted{color:var(--muted)}
.tt a{color:var(--accent);text-decoration:underline;text-underline-offset:3px}
.tree-tools{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:10px 0}
.tree-tools button{border:1px solid var(--line);background:transparent;color:var(--fg);border-radius:6px;padding:5px 11px;cursor:pointer;font-size:13px}
.tree-tools button:hover{border-color:var(--accent);color:var(--accent)}
.tree-hint{font-size:13px;color:var(--muted);margin-left:6px}
.tree-hint a{color:var(--accent)}
.tree-wrap{height:calc(100vh - 230px);min-height:420px;border:1px solid var(--line);border-radius:8px;overflow:hidden;touch-action:none;cursor:grab;background:var(--bg)}
.tree-wrap:active{cursor:grabbing}
.tree-svg{width:100%;height:100%;display:block}
.tree-svg .tl{fill:none;stroke:var(--line);stroke-width:1.3}
.tree-svg .td{fill:none;stroke-width:1.8}
.tree-svg .td.pre{stroke:var(--accent)}
.tree-svg .td.unl{stroke:var(--accent);stroke-dasharray:5 4;opacity:.8}
.tree-svg .tn rect{fill:var(--bg);stroke:var(--line)}
.tree-svg .tn text{fill:var(--fg);font:500 12px var(--sans)}
.tree-svg .tn.grp rect{fill:var(--hover);stroke:var(--faint)}
.tree-svg .tn.grp text{font-weight:600}
.tree-svg .tn .tg{fill:var(--accent);font:600 13px var(--mono)}
.tree-svg .tn .tk{fill:var(--done)}
.tree-svg .tn.done rect{fill:var(--accent-weak);stroke:var(--done)}
.tree-svg .tn.sel rect{stroke:var(--fg);stroke-width:2}
.tree-svg .tn.pre rect,.tree-svg .tn.unl rect{stroke:var(--accent);stroke-width:1.6}
.tree-svg .tn{cursor:pointer}
@media (max-width:860px){.tree-wrap{height:70vh}}

.scrim{display:none}
@media (max-width:1100px){.page{grid-template-columns:minmax(0,1fr)}aside.toc{display:none}}
@media (max-width:860px){
  .shell{grid-template-columns:1fr}
  .index{position:fixed;left:0;top:0;bottom:0;width:min(300px,86vw);height:auto;z-index:40;background:var(--bg);transform:translateX(-105%);transition:transform .2s;padding-top:calc(22px + env(safe-area-inset-top,0px))}
  .index.open{transform:none}
  .scrim.open{display:block;position:fixed;inset:0;z-index:35;background:rgba(0,0,0,.25)}
  .menu{display:block}
  .page{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 72px}
  .fits{grid-template-columns:1fr;justify-items:stretch}.fits .arr{transform:rotate(90deg);justify-self:center}.fits .col.mid{justify-items:stretch}
  .strip .lbl{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

<script>const DATA={"chapters":[{"id":"found","title":"Computing foundations","level":"Beginner","intro":"How a computer runs your code, the data structures you'll use daily, and the tools of the trade.","phase":0,"optional":false,"topics":[{"id":"howcomp","title":"How computers work: CPU, memory & GPUs","short":"How computers work","level":"Beginner","why":"Knowing what the CPU, memory and caches do with your program lets you predict which code is fast and which is slow.","mins":900,"pre":[],"ideas":["A CPU repeats one loop: fetch an instruction from memory, decode it, execute it, then move to the next. Everything else, including Python, eventually becomes this stream of simple instructions.","Python source is compiled to bytecode, and the CPython interpreter runs that bytecode in a loop written in C. Each bytecode step costs many machine instructions, which is why pure Python loops are slow next to C or NumPy.","Memory is a hierarchy. Registers take under a nanosecond, L1 cache about 1 ns, main RAM about 100 ns, an SSD read about 100 microseconds and a cross-region network round trip about 100 ms.","Caches load memory in 64-byte lines, so code that walks memory in order is fast and code that jumps around randomly misses the cache. Data layout often matters more than instruction count."],"callout":["Intuition","Keep the latency numbers in your head as orders of magnitude. One network call costs as much time as millions of in-memory operations, so you should count round trips before you count loops."],"lectures":[{"t":"How do CPUs Work? The Engineering that Runs the Digital World","u":"https://www.youtube.com/watch?v=16zrEPOsIcI","by":"Branch Education"},{"t":"Why do CPUs Need Caches?","u":"https://www.youtube.com/watch?v=6JpLD3PUAZk","by":"Computerphile"},{"t":"Machine Code Explained","u":"https://www.youtube.com/watch?v=8VsiYWW9r48","by":"Computerphile"}],"papers":[{"t":"15-213 Introduction to Computer Systems (CS:APP course page)","u":"https://www.cs.cmu.edu/~213/","by":"Bryant & O'Hallaron, CMU"},{"t":"What Every Programmer Should Know About Memory","u":"https://akkadia.org/drepper/cpumemory.pdf","by":"Ulrich Drepper"},{"t":"nand2tetris: build a computer from first principles","u":"https://www.nand2tetris.org/","by":"Nisan & Schocken"},{"t":"What Every Programmer Should Know About Memory","u":"https://people.freebsd.org/~lstewart/articles/cpumemory.pdf","by":"Ulrich Drepper"},{"t":"CUDA Programming Guide","u":"https://docs.nvidia.com/cuda/cuda-programming-guide/","by":"NVIDIA"}],"reads":[{"t":"Putting the \"You\" in CPU","u":"https://cpu.land/","by":"Lexi Mattick (Hack Club)"},{"t":"Gallery of Processor Cache Effects","u":"https://igoro.com/archive/gallery-of-processor-cache-effects/","by":"Igor Ostrovsky"},{"t":"Python behind the scenes #1: how the CPython VM works","u":"https://tenthousandmeters.com/blog/python-behind-the-scenes-1-how-the-cpython-vm-works/","by":"Victor Skvortsov"},{"t":"Making Deep Learning Go Brrrr From First Principles","u":"https://horace.io/brrr_intro.html","by":"Horace He"}],"projects":[{"n":"Latency ladder benchmark","l":"Beginner","d":"Write a Python script that times a dict lookup, a file read, a local HTTP request and a DNS lookup, repeated 1,000 times each. Plot the medians on a log scale and compare them to the published latency numbers."},{"n":"Cache-friendly vs cache-hostile","l":"Intermediate","d":"Sum a large NumPy array in order, then with a random index permutation, and measure the gap. Use dis.dis on a small Python function and count how many bytecode steps one loop iteration takes."},{"n":"Measure the memory hierarchy","l":"Beginner","d":"Sum an array in row order and in column order, and with random access, at sizes from 4 KB to 1 GB. Plot time per element and find where L1, L2, L3 and RAM boundaries show up."}],"repos":[{"r":"hackclub/putting-the-you-in-cpu","d":"Source of cpu.land, a readable tour of how programs run on Linux"},{"r":"python/cpython","d":"Read Python/ceval.c to see the bytecode evaluation loop"},{"r":"codecrafters-io/build-your-own-x","d":"Guides to rebuild interpreters, emulators and other systems from scratch"},{"r":"srush/GPU-Puzzles","d":"Puzzles that teach GPU programming in Python with Numba"}]},{"id":"dsa","title":"Data structures & complexity","short":"Data structures","level":"Beginner","why":"Choosing the right structure turns slow endpoints into fast ones, and Big-O gives you a shared way to reason about how code scales with data.","mins":2400,"pre":["howcomp"],"ideas":["Big-O describes how work grows as input grows. An O(n) scan over a million rows does a million steps, while an O(log n) tree lookup does about 20.","A Python list is a dynamic array. Indexing and appending are O(1) on average, but inserting at the front or checking `x in list` is O(n) because elements must be shifted or scanned.","A hash table (Python dict and set) hashes the key to pick a slot, so lookups are O(1) on average. The cost is extra memory and no ordering by key.","Balanced trees and B-trees keep keys sorted, so they support range queries and ordered iteration in O(log n). Database indexes are B-trees for exactly this reason."],"callout":["Pitfall","Big-O hides constants and memory effects. For small n a linear scan over a compact list can beat a hash lookup, so measure before you rewrite."],"lectures":[{"t":"Lecture 2: Data Structures and Dynamic Arrays (MIT 6.006)","u":"https://www.youtube.com/watch?v=CHhwJjR0mZA","by":"MIT OpenCourseWare"},{"t":"Lecture 4: Hashing (MIT 6.006)","u":"https://www.youtube.com/watch?v=Nu8YGneFCWE","by":"MIT OpenCourseWare"},{"t":"Big-O: How Code Slows as Data Grows","u":"https://www.youtube.com/watch?v=duvZ-2UK0fc","by":"Ned Batchelder, PyCon 2018"}],"papers":[{"t":"MIT 6.006 Introduction to Algorithms (Spring 2020)","u":"https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-spring-2020/","by":"MIT OpenCourseWare"},{"t":"Algorithms (free textbook)","u":"https://jeffe.cs.illinois.edu/teaching/algorithms/","by":"Jeff Erickson"},{"t":"Python TimeComplexity","u":"https://wiki.python.org/moin/TimeComplexity","by":"Python Wiki"},{"t":"Open Data Structures (free textbook)","u":"https://opendatastructures.org/","by":"Pat Morin"}],"reads":[{"t":"Big O (interactive)","u":"https://samwho.dev/big-o/","by":"Sam Rose"},{"t":"Hashing (interactive)","u":"https://samwho.dev/hashing/","by":"Sam Rose"},{"t":"VisuAlgo","u":"https://visualgo.net/en","by":"Steven Halim, NUS"},{"t":"Python TimeComplexity","u":"https://wiki.python.org/moin/TimeComplexity","by":"Python Wiki"}],"projects":[{"n":"Build a hash map","l":"Beginner","d":"Implement a hash map with open addressing and resizing in Python. Measure average probe length as the load factor rises from 0.5 to 0.95."},{"n":"In-memory leaderboard","l":"Intermediate","d":"Build a leaderboard that supports add score, top-k and rank-of-user using a dict plus a sorted structure or heap. Benchmark each operation at 10k, 100k and 1M users and check the growth matches your Big-O estimate."},{"n":"Build a hash map from scratch","l":"Beginner","d":"Write a hash table with open addressing and resizing. Plot average lookup time against load factor and see where it degrades."}],"repos":[{"r":"TheAlgorithms/Python","d":"Readable Python implementations of classic algorithms and structures"},{"r":"jwasham/coding-interview-university","d":"A structured study plan covering core data structures"}]},{"id":"os","title":"Operating systems: processes, threads & memory","short":"Operating systems","level":"Intermediate","why":"Your server is a process managed by the kernel, so processes, threads, virtual memory and system calls explain crashes, memory limits and container behavior.","mins":1500,"pre":["howcomp"],"ideas":["A process is a running program with its own virtual address space, open files and at least one thread. The kernel isolates processes, so one crashing does not corrupt another.","Threads in one process share memory but each has its own stack and registers. The scheduler switches between them many times a second, which is how one core appears to run many things.","Virtual memory gives every process the illusion of a private address space. The MMU translates addresses through page tables, and pages that are not in RAM cause a page fault the kernel handles.","Programs ask the kernel for anything privileged (files, sockets, memory, new processes) through system calls like open, read, mmap, fork and exec. Each call crosses into kernel mode and costs far more than a normal function call."],"callout":["Intuition","A container is not a virtual machine. It is a normal Linux process with namespaces that limit what it can see and cgroups that limit what it can use."],"lectures":[{"t":"6.S081 Lecture 1: Introduction and Examples (xv6)","u":"https://www.youtube.com/watch?v=L6YqHxYHa7A","by":"MIT 6.S081, Robert Morris"},{"t":"What's Virtual Memory?","u":"https://www.youtube.com/watch?v=5lFnKYCZT5o","by":"Computerphile"},{"t":"Containers From Scratch","u":"https://www.youtube.com/watch?v=8fi7uSYlOdc","by":"Liz Rice, GOTO 2018"}],"papers":[{"t":"Operating Systems: Three Easy Pieces","u":"https://pages.cs.wisc.edu/~remzi/OSTEP/","by":"Remzi and Andrea Arpaci-Dusseau"},{"t":"OSTEP: The Abstraction of the Process","u":"https://pages.cs.wisc.edu/~remzi/OSTEP/cpu-intro.pdf","by":"Arpaci-Dusseau"},{"t":"xv6: a simple, Unix-like teaching operating system","u":"https://pdos.csail.mit.edu/6.828/2023/xv6/book-riscv-rev3.pdf","by":"Cox, Kaashoek, Morris (MIT)"},{"t":"syscalls(2) Linux manual page","u":"https://man7.org/linux/man-pages/man2/syscalls.2.html","by":"man7.org"}],"reads":[{"t":"What happens when you start a process on Linux?","u":"https://jvns.ca/blog/2016/10/04/exec-will-eat-your-brain/","by":"Julia Evans"},{"t":"How much memory is my process using?","u":"https://jvns.ca/blog/2016/12/03/how-much-memory-is-my-process-using-/","by":"Julia Evans"},{"t":"Measuring context switching and memory overheads for Linux threads","u":"https://eli.thegreenplace.net/2018/measuring-context-switching-and-memory-overheads-for-linux-threads/","by":"Eli Bendersky"}],"projects":[{"n":"Tiny shell","l":"Intermediate","d":"Write a shell in Python using os.fork, os.execvp and os.waitpid that supports pipes and redirects. Use strace -f on it to watch the system calls each command makes."},{"n":"Memory under the microscope","l":"Intermediate","d":"Start a Python process that allocates growing lists and watch RSS and VSZ in /proc/<pid>/status. Run it in Docker with a memory limit and observe what the OOM killer does when it is exceeded."}],"repos":[{"r":"mit-pdos/xv6-riscv","d":"A small teaching kernel you can read end to end"},{"r":"remzi-arpacidusseau/ostep-projects","d":"Hands-on projects that accompany the OSTEP book"}]},{"id":"concur","title":"Concurrency & async I/O","short":"Concurrency","level":"Intermediate","why":"Backends spend most of their time waiting on networks and disks, and concurrency lets one server handle thousands of those waits at once.","mins":900,"pre":["os"],"ideas":["Concurrency is structuring a program to deal with many things at once. Parallelism is doing many things at the same instant on several cores. An async server is concurrent on one core.","In CPython the GIL lets only one thread run Python bytecode at a time. Threads still help for I/O because the GIL is released while waiting, but CPU-heavy work needs processes or native code.","An event loop asks the OS (epoll on Linux) which sockets are ready, then runs the coroutine waiting on each one. A coroutine gives up control only at await, so one blocking call freezes every request.","Shared mutable state needs coordination. Locks prevent two tasks from interleaving a read-modify-write, and structured concurrency (asyncio.TaskGroup) makes sure child tasks finish or are cancelled with their parent."],"callout":["Pitfall","Calling a blocking library such as requests or time.sleep inside an async def handler stalls the whole event loop. Use an async client, or run the call in a thread with asyncio.to_thread."],"lectures":[{"t":"Build Your Own Async","u":"https://www.youtube.com/watch?v=Y4Gt3Xjd7G8","by":"David Beazley"},{"t":"Thinking In Coroutines","u":"https://www.youtube.com/watch?v=l4Nn-y9ktd4","by":"\u0141ukasz Langa, PyCon 2016"},{"t":"Understanding the Python GIL","u":"https://www.youtube.com/watch?v=Obt-vMVdM8s","by":"David Beazley"}],"papers":[{"t":"A conceptual overview of asyncio","u":"https://docs.python.org/3/howto/a-conceptual-overview-of-asyncio.html","by":"Python documentation"},{"t":"OSTEP: Concurrency and Threads / Event-based Concurrency","u":"https://pages.cs.wisc.edu/~remzi/OSTEP/threads-events.pdf","by":"Arpaci-Dusseau"},{"t":"The C10K problem","u":"http://www.kegel.com/c10k.html","by":"Dan Kegel"},{"t":"PEP 703: Making the GIL Optional in CPython","u":"https://peps.python.org/pep-0703/","by":"Sam Gross"}],"reads":[{"t":"What Color is Your Function?","u":"https://journal.stuffwithstuff.com/2015/02/01/what-color-is-your-function/","by":"Bob Nystrom"},{"t":"Notes on structured concurrency, or: Go statement considered harmful","u":"https://vorpus.org/blog/notes-on-structured-concurrency-or-go-statement-considered-harmful/","by":"Nathaniel J. Smith"},{"t":"I'm not feeling the async pressure","u":"https://lucumr.pocoo.org/2020/1/1/async-pressure/","by":"Armin Ronacher"}],"projects":[{"n":"Three ways to fetch 500 URLs","l":"Beginner","d":"Fetch 500 URLs from a local test server sequentially, with a ThreadPoolExecutor and with asyncio plus httpx. Compare wall time, peak memory and how each behaves when you cap concurrency with a semaphore."},{"n":"Event loop from scratch","l":"Advanced","d":"Write a minimal event loop on top of the selectors module that runs generator-based coroutines and serves a TCP echo server. Load test it and compare to the same server on asyncio."}],"repos":[{"r":"python-trio/trio","d":"Async library that introduced structured concurrency to Python"},{"r":"MagicStack/uvloop","d":"Fast drop-in asyncio event loop built on libuv"},{"r":"agronholm/anyio","d":"Structured concurrency layer used by Starlette and FastAPI"}]},{"id":"cli","title":"Linux, Git & the command line","short":"Linux, Git, shell","level":"Beginner","why":"ML work happens on remote Linux machines under version control, so the shell and Git are the daily interface to your code and compute.","mins":720,"pre":[],"ideas":["The shell runs programs and connects them with pipes. 'cat log | grep loss | tail -n 5' sends each program's output into the next, so small tools combine into big ones.","Everything has permissions, an owner and a path. Environment variables like PATH decide which program runs when you type a name, which explains most 'command not found' errors.","Git stores snapshots of your files as commits, each pointing to its parent. A branch is just a movable name for one commit, so creating one is cheap.","Merging joins two lines of history, and rebasing replays your commits on top of another branch. Both rely on the commit graph, so reading 'git log --graph' clears up most confusion."],"callout":["Pitfall","Never commit large datasets, model weights or secrets to Git. History keeps them forever, even after you delete the file. Use .gitignore from the start."],"lectures":[{"t":"Lecture 1: Course Overview + The Shell (2020)","u":"https://www.youtube.com/watch?v=Z56Jmr9Z34Q","by":"Missing Semester (MIT)"},{"t":"Lecture 2: Shell Tools and Scripting (2020)","u":"https://www.youtube.com/watch?v=kgII-YWo3Zw","by":"Missing Semester (MIT)"},{"t":"Lecture 6: Version Control (git) (2020)","u":"https://www.youtube.com/watch?v=2sjqTHE0zok","by":"Missing Semester (MIT)"}],"papers":[{"t":"The Missing Semester of Your CS Education","u":"https://missing.csail.mit.edu/","by":"MIT CSAIL"},{"t":"Pro Git (free book)","u":"https://git-scm.com/book/en/v2","by":"Scott Chacon & Ben Straub"}],"reads":[{"t":"Git from the Bottom Up","u":"https://jwiegley.github.io/git-from-the-bottom-up/","by":"John Wiegley"},{"t":"Confusing git terminology","u":"https://jvns.ca/blog/2023/11/01/confusing-git-terminology/","by":"Julia Evans"},{"t":"Learn Git Branching (interactive)","u":"https://learngitbranching.js.org/","by":"Peter Cottle"}],"projects":[{"n":"Log-parsing one-liners","l":"Beginner","d":"Take a training log and use grep, awk, sort and uniq to extract the best validation loss and count warnings. Then write the same thing as a reusable bash script with arguments."},{"n":"Break and fix a repo","l":"Beginner","d":"Create a repo, make conflicting changes on two branches, merge them and resolve the conflict, then undo a bad commit with revert and recover a lost one with reflog. Draw the commit graph after each step."}],"repos":[{"r":"jlevy/the-art-of-command-line","d":"A dense one-page guide to the command line"},{"r":"missing-semester/missing-semester","d":"Source and notes for the Missing Semester course"}]},{"id":"lang","title":"Python for engineering","short":"Python","level":"Beginner","why":"Python is the course language, and writing idiomatic, typed and well packaged Python is what makes a service easy to change and safe to deploy.","mins":1800,"pre":[],"ideas":["Python names are labels bound to objects, not boxes holding values. Assigning a list to a second name shares it, which is why mutable default arguments and shared dicts cause surprising bugs.","Type hints do nothing at runtime by themselves, but mypy or pyright check them before you deploy. Frameworks like FastAPI and Pydantic also read them to validate input and generate docs.","Iterators and generators produce values lazily, so you can stream a large file or query result with constant memory. Context managers (with) guarantee cleanup such as closing a connection, even on errors.","Pin dependencies in a lockfile and use one tool for environments, such as uv. Reproducible installs mean the code you tested is the code that runs in production."],"callout":["Pitfall","A default like def f(items=[]) creates one list when the function is defined, and every call shares it. Use None and create the list inside the function."],"lectures":[{"t":"Transforming Code into Beautiful, Idiomatic Python","u":"https://www.youtube.com/watch?v=OSGv2VnC0go","by":"Raymond Hettinger, PyCon 2013"},{"t":"Stop Writing Classes","u":"https://www.youtube.com/watch?v=o9pEzgHorH0","by":"Jack Diederich, PyCon 2012"},{"t":"So you want to be a Python expert?","u":"https://www.youtube.com/watch?v=cKPlPJyQrt4","by":"James Powell, PyData Seattle 2017"}],"papers":[{"t":"The Python Tutorial","u":"https://docs.python.org/3/tutorial/","by":"Python documentation"},{"t":"Python Data Model","u":"https://docs.python.org/3/reference/datamodel.html","by":"Python documentation"},{"t":"Static Typing with Python","u":"https://typing.python.org/en/latest/","by":"Python typing council"},{"t":"uv documentation","u":"https://docs.astral.sh/uv/","by":"Astral"}],"reads":[{"t":"Python Names and Values","u":"https://nedbatchelder.com/text/names1.html","by":"Ned Batchelder"},{"t":"Loop Like A Native","u":"https://nedbatchelder.com/text/iter.html","by":"Ned Batchelder"},{"t":"Python Application Dependency Management","u":"https://hynek.me/articles/python-app-deps-2018/","by":"Hynek Schlawack"}],"projects":[{"n":"Project skeleton","l":"Beginner","d":"Create the course service repo with uv, ruff, mypy in strict mode and a pre-commit hook. Make CI fail on a type error and confirm a fresh clone installs the exact same versions."},{"n":"Streaming log analyzer","l":"Intermediate","d":"Write a CLI that reads a multi-GB access log with generators and reports top paths and p95 latency. Compare peak memory to a version that reads the whole file into a list."}],"repos":[{"r":"astral-sh/uv","d":"Fast Python package and project manager"},{"r":"astral-sh/ruff","d":"Fast Python linter and formatter"},{"r":"python/mypy","d":"The reference static type checker for Python"}]}]},{"id":"practice","title":"Engineering practice","level":"Beginner","intro":"Habits that make you effective on a team from the first week.","phase":0,"optional":false,"topics":[{"id":"se_git","title":"Git workflow, code review & collaboration","short":"Git & code review","level":"Intermediate","why":"Most engineering work happens in shared repositories, so clean history, small changes and good reviews decide how fast a team can move safely.","mins":720,"pre":["cli"],"ideas":["Git stores snapshots as a graph of commits, and a branch is just a movable pointer to one commit. Once you see that, rebase, reset and cherry-pick become operations on pointers instead of magic.","Trunk-based development means everyone merges small changes into main at least daily, behind feature flags if needed. Long-lived branches drift apart and turn merges into risky events.","A good commit message has a short imperative subject and a body that explains why. Conventional Commits adds a type prefix like feat: or fix: so tools can build changelogs and pick version numbers.","Code review exists to keep the codebase healthy and spread knowledge. Google's guide says to approve a change once it clearly improves the code, even if it is not perfect, and to keep reviews fast."],"callout":["Intuition","Review time grows faster than change size. A 50-line pull request gets a careful read, while a 1,000-line one gets a skim and a rubber stamp."],"lectures":[{"t":"So You Think You Know Git","u":"https://www.youtube.com/watch?v=aolI_Rz0ZqY","by":"Scott Chacon, FOSDEM 2024"},{"t":"How to Do Code Reviews Like a Human","u":"https://www.youtube.com/watch?v=0t4_MfHgb_A","by":"Michael Lynch, PyGotham 2018"},{"t":"Continuous Integration vs Feature Branch Workflow","u":"https://www.youtube.com/watch?v=v4Ijkq6Myfc","by":"Dave Farley, Modern Software Engineering"}],"papers":[{"t":"Pro Git (free book)","u":"https://git-scm.com/book/en/v2","by":"Scott Chacon & Ben Straub"},{"t":"Google Engineering Practices: Code Review","u":"https://google.github.io/eng-practices/review/","by":"Google"},{"t":"Conventional Commits 1.0.0","u":"https://www.conventionalcommits.org/en/v1.0.0/","by":"Conventional Commits"},{"t":"Trunk Based Development","u":"https://trunkbaseddevelopment.com/","by":"Paul Hammant"}],"reads":[{"t":"Patterns for Managing Source Code Branches","u":"https://martinfowler.com/articles/branching-patterns.html","by":"Martin Fowler"},{"t":"How to Write a Git Commit Message","u":"https://cbea.ms/git-commit/","by":"Chris Beams"},{"t":"How to Do Code Reviews Like a Human","u":"https://mtlynch.io/human-code-reviews-1/","by":"Michael Lynch"}],"projects":[{"n":"Git surgery drills","l":"Beginner","d":"Create a throwaway repo and practice interactive rebase, splitting a commit, recovering a deleted branch with reflog and bisecting a planted bug. Time how long bisect takes over 200 commits."},{"n":"Team workflow setup","l":"Intermediate","d":"Set up a repo with branch protection, required CI, a PR template, commitlint and a changelog generated from Conventional Commits. Run it for two weeks and track median PR size and time to merge."}],"repos":[{"r":"k88hudson/git-flight-rules","d":"What to do when things go wrong in Git"},{"r":"google/eng-practices","d":"Source of Google's code review guides"},{"r":"conventional-changelog/commitlint","d":"Lint commit messages against Conventional Commits"}]},{"id":"se_debug","title":"Debugging & profiling production systems","short":"Debug & profile","level":"Intermediate","why":"When a service is slow or wrong in production, a systematic method and the right profiler find the cause in minutes instead of days.","mins":900,"pre":["os","lang"],"ideas":["Debugging is the scientific method: reproduce the bug, form a hypothesis, run the cheapest test that could prove it wrong, and repeat. Binary search over commits, inputs or code paths halves the search space each step.","Brendan Gregg's USE method checks every resource for Utilization, Saturation and Errors. Walking CPU, memory, disk and network this way rules out whole classes of problems quickly.","A sampling profiler like py-spy or perf records the call stack many times a second. A flame graph stacks those samples so the widest boxes are the functions that used the most time.","Production debugging leans on evidence you already collected: logs, metrics, traces and core dumps. Ask what changed recently, since most incidents follow a deploy or config change."],"callout":["Pitfall","Guessing and changing code before you can reproduce the bug often hides it instead of fixing it. Write down what you observed and what you ruled out as you go."],"lectures":[{"t":"Lecture 7: Debugging and Profiling","u":"https://www.youtube.com/watch?v=l812pUnKxME","by":"MIT Missing Semester"},{"t":"Visualizing Performance: The Developers' Guide to Flame Graphs","u":"https://www.youtube.com/watch?v=VMpTU15rIZY","by":"Brendan Gregg, YOW! 2022"},{"t":"Linux Performance Analysis in 60 seconds","u":"https://www.youtube.com/watch?v=ZdVpKx6Wmc8","by":"Brendan Gregg"}],"papers":[{"t":"The USE Method","u":"https://www.brendangregg.com/usemethod.html","by":"Brendan Gregg"},{"t":"Flame Graphs","u":"https://www.brendangregg.com/flamegraphs.html","by":"Brendan Gregg"},{"t":"Effective Troubleshooting (SRE book, chapter 12)","u":"https://sre.google/sre-book/effective-troubleshooting/","by":"Google SRE"}],"reads":[{"t":"A debugging manifesto","u":"https://jvns.ca/blog/2022/12/08/a-debugging-manifesto/","by":"Julia Evans"},{"t":"The Pocket Guide to Debugging","u":"https://wizardzines.com/zines/debugging-guide/","by":"Julia Evans"},{"t":"CPU Utilization is Wrong","u":"https://www.brendangregg.com/blog/2017-05-09/cpu-utilization-is-wrong.html","by":"Brendan Gregg"}],"projects":[{"n":"Profile a slow endpoint","l":"Beginner","d":"Add a deliberately slow endpoint to a small web app (N+1 queries, JSON in a loop). Profile it under load with py-spy, read the flame graph, fix the hot spot and report p50 and p99 latency before and after."},{"n":"Incident game day","l":"Intermediate","d":"Have a friend or script inject one of: a memory leak, a lock contention bug, a full disk or a DNS failure into a running service. Diagnose it with USE checks and logs only, and write a timeline of each hypothesis you tested."}],"repos":[{"r":"benfred/py-spy","d":"Sampling profiler for running Python processes"},{"r":"brendangregg/FlameGraph","d":"The original flame graph scripts"},{"r":"plasma-umass/scalene","d":"CPU, GPU and memory profiler for Python"}]}]},{"id":"net","title":"Networking & the web","level":"Beginner \u2192 Intermediate","intro":"How bytes get from a client to your server and back, and the protocols and API styles built on top. This is the ground every backend request walks on.","phase":0,"optional":false,"topics":[{"id":"internet","title":"How the internet works: TCP/IP & DNS","short":"TCP/IP & DNS","level":"Beginner","why":"Every request starts with a DNS lookup and a TCP connection, so knowing these layers helps you debug timeouts, latency and \"it works on my machine\" bugs.","mins":720,"pre":["os"],"ideas":["IP moves packets between machines by address, hop by hop, with no promise they arrive or arrive in order. Routers only look at the destination address to pick the next hop.","TCP builds a reliable, ordered byte stream on top of IP. It numbers bytes, resends lost segments and slows down when the network is congested. Setting up a connection costs a three-way handshake, one full round trip.","UDP sends single datagrams with no connection or retransmission. It suits DNS queries and real-time media, and QUIC builds its own reliability on top of it.","DNS maps names to addresses through a hierarchy: a resolver asks a root server, then the TLD server, then the domain's authoritative server, and caches each answer for its TTL."],"callout":["Pitfall","DNS changes are not instant. Resolvers keep the old answer until its TTL expires, so lower the TTL well before a migration, not during it."],"lectures":[{"t":"Internet Primer (CS50 Shorts)","u":"https://www.youtube.com/watch?v=04GztBlVo_s","by":"CS50"},{"t":"What is the TCP 3-Way Handshake and Why Backend Engineers should understand it","u":"https://www.youtube.com/watch?v=bW_BILl7n0Y","by":"Hussein Nasser"},{"t":"how DNS works!","u":"https://www.youtube.com/watch?v=kV1u701wxgg","by":"Julia Evans"}],"papers":[{"t":"High Performance Browser Networking: Building Blocks of TCP","u":"https://hpbn.co/building-blocks-of-tcp/","by":"Ilya Grigorik"},{"t":"Beej's Guide to Network Programming","u":"https://beej.us/guide/bgnet/","by":"Brian \"Beej\" Hall"},{"t":"RFC 9293: Transmission Control Protocol","u":"https://www.rfc-editor.org/rfc/rfc9293","by":"IETF"},{"t":"RFC 1034: Domain Names, Concepts and Facilities","u":"https://www.rfc-editor.org/rfc/rfc1034","by":"Paul Mockapetris, IETF"}],"reads":[{"t":"The Internet explained from first principles","u":"https://explained-from-first-principles.com/internet/","by":"Kaspar Etter"},{"t":"Implement DNS in a weekend","u":"https://implement-dns.wizardzines.com/","by":"Julia Evans"},{"t":"SYN packet handling in the wild","u":"https://blog.cloudflare.com/syn-packet-handling-in-the-wild/","by":"Marek Majkowski, Cloudflare"}],"projects":[{"n":"DNS resolver from scratch","l":"Intermediate","d":"Write a DNS resolver in Python that builds query packets by hand, sends them over UDP and follows referrals from a root server. Compare its answers and timing to dig."},{"n":"Watch a request in Wireshark","l":"Beginner","d":"Capture a curl request to your own API with tcpdump or Wireshark. Label the DNS query, the TCP handshake, the data packets and the FIN, and measure each phase's time."}],"repos":[{"r":"alex/what-happens-when","d":"A detailed walk through what happens when you type a URL and press enter"},{"r":"jvns/dns-weekend","d":"Code that accompanies Implement DNS in a weekend"},{"r":"beejjorgensen/bgnet","d":"Source of Beej's Guide with socket examples"}]},{"id":"http","title":"HTTP, HTTPS & TLS","short":"HTTP & TLS","level":"Beginner","why":"HTTP is the language your API speaks, and TLS is what keeps it private, so their details shape caching, performance and security.","mins":720,"pre":["internet"],"ideas":["An HTTP request is a method, a path, headers and an optional body. The response is a status code, headers and a body. Methods have rules: GET is safe, and PUT and DELETE are idempotent, so clients may retry them.","Status codes form classes. 2xx means success, 3xx means look elsewhere, 4xx means the client sent something wrong and 5xx means the server failed. Clients and proxies make decisions on the class.","HTTP/1.1 sends one request at a time per connection. HTTP/2 multiplexes many streams over one TCP connection, and HTTP/3 runs over QUIC on UDP so one lost packet does not stall every stream.","TLS 1.3 uses one round trip to agree on keys with Diffie-Hellman and to prove the server's identity with a certificate signed by a trusted CA. After that, every byte is encrypted and integrity-checked."],"callout":["Intuition","Caching headers are part of your API. Cache-Control, ETag and Vary decide whether a CDN or browser can skip calling your server at all."],"lectures":[{"t":"Hyper Text Transfer Protocol Crash Course: HTTP 1.0, 1.1, HTTP/2, HTTP/3","u":"https://www.youtube.com/watch?v=0OrmKCB0UrQ","by":"Hussein Nasser"},{"t":"TLS Handshake Explained","u":"https://www.youtube.com/watch?v=86cQJ0MMses","by":"Computerphile"},{"t":"HTTP/2","u":"https://www.youtube.com/watch?v=r2f8tloYJY0","by":"Daniel Stenberg, GOTO 2015"}],"papers":[{"t":"RFC 9110: HTTP Semantics","u":"https://www.rfc-editor.org/rfc/rfc9110","by":"IETF"},{"t":"RFC 9113: HTTP/2","u":"https://www.rfc-editor.org/rfc/rfc9113","by":"IETF"},{"t":"RFC 8446: TLS 1.3","u":"https://www.rfc-editor.org/rfc/rfc8446","by":"Eric Rescorla, IETF"},{"t":"MDN: HTTP","u":"https://developer.mozilla.org/en-US/docs/Web/HTTP","by":"Mozilla"}],"reads":[{"t":"The Illustrated TLS 1.3 Connection: Every Byte Explained","u":"https://tls13.xargs.org/","by":"Michael Driscoll"},{"t":"How to Think About HTTP Status Codes","u":"https://www.mnot.net/blog/2017/05/11/status_codes","by":"Mark Nottingham"},{"t":"HTTP/3 explained","u":"https://http3-explained.haxx.se/","by":"Daniel Stenberg"}],"projects":[{"n":"HTTP/1.1 server on raw sockets","l":"Intermediate","d":"Write an HTTP/1.1 server with the socket module that parses requests, supports keep-alive and serves files with ETag and Cache-Control. Check it with curl -v and measure requests per second with and without keep-alive."},{"n":"TLS in front of your API","l":"Beginner","d":"Put your API behind Caddy or nginx with a local certificate from mkcert. Use curl -w to measure DNS, connect, TLS and first-byte times for HTTP/1.1 and HTTP/2."}],"repos":[{"r":"python-hyper/h11","d":"A small, readable HTTP/1.1 state machine in pure Python"},{"r":"encode/httpx","d":"Python HTTP client with HTTP/2 and async support"},{"r":"curl/curl","d":"The reference HTTP client; its verbose output is a learning tool"}]},{"id":"apis","title":"API design: REST, GraphQL & gRPC","short":"API design","level":"Intermediate","why":"An API is a long-lived contract with other teams and customers, so good design choices save years of painful versioning and support.","mins":720,"pre":["http"],"ideas":["Resource-oriented REST APIs model nouns (users, orders) with standard methods on them. Clients learn one pattern and reuse it everywhere, which beats a custom verb for each action.","Plan for change from day one. Adding optional fields is safe. Removing or renaming fields breaks clients, so use versioning or additive change, and remember that clients depend on every observable behavior.","Make retries safe. Idempotency keys let a client resend a POST after a timeout without charging a card twice, and cursor-based pagination stays correct while rows are inserted.","GraphQL lets clients ask for exactly the fields they need through one endpoint, which suits varied frontends. gRPC uses Protocol Buffers over HTTP/2 for compact, typed, streaming calls between services."],"callout":["Pitfall","Offset pagination (?page=500) gets slower as the offset grows and skips or repeats rows when data changes. Use a cursor based on a stable sort key instead."],"lectures":[{"t":"How To Design A Good API and Why it Matters","u":"https://www.youtube.com/watch?v=aAb7hSCtvGw","by":"Joshua Bloch, Google TechTalks"},{"t":"The principles behind great API design","u":"https://www.youtube.com/watch?v=IEe-5VOv0Js","by":"Stripe Sessions 2019"},{"t":"Top 6 Most Popular API Architecture Styles","u":"https://www.youtube.com/watch?v=4vLxWqE94l4","by":"ByteByteGo"}],"papers":[{"t":"Google Cloud API Design Guide","u":"https://cloud.google.com/apis/design","by":"Google"},{"t":"AIP-158: Pagination","u":"https://google.aip.dev/158","by":"Google API Improvement Proposals"},{"t":"gRPC: Core concepts, architecture and lifecycle","u":"https://grpc.io/docs/what-is-grpc/core-concepts/","by":"gRPC authors"},{"t":"Learn GraphQL","u":"https://graphql.org/learn/","by":"GraphQL Foundation"}],"reads":[{"t":"Designing robust and predictable APIs with idempotency","u":"https://stripe.com/blog/idempotency","by":"Brandur Leach, Stripe"},{"t":"APIs as infrastructure: future-proofing Stripe with versioning","u":"https://stripe.com/blog/api-versioning","by":"Brandur Leach, Stripe"},{"t":"Implementing Stripe-like Idempotency Keys in Postgres","u":"https://brandur.org/idempotency-keys","by":"Brandur Leach"}],"projects":[{"n":"Design the course API","l":"Intermediate","d":"Write an OpenAPI spec for a notes service with resources, cursor pagination, filtering and an Idempotency-Key header on POST. Implement it in FastAPI and prove a retried POST creates only one note."},{"n":"Same service, three styles","l":"Advanced","d":"Expose one read operation as REST, GraphQL (Strawberry) and gRPC. Compare payload size, latency and how a client discovers the schema in each."}],"repos":[{"r":"microsoft/api-guidelines","d":"Microsoft's REST API guidelines"},{"r":"zalando/restful-api-guidelines","d":"Detailed, opinionated REST and event API guidelines"},{"r":"strawberry-graphql/strawberry","d":"Type-hint based GraphQL library for Python"}]},{"id":"realtime","title":"Real-time: WebSockets, SSE & streaming","short":"Real-time","level":"Intermediate","why":"Chat, live dashboards and streamed LLM tokens all need the server to push data as it happens instead of waiting to be asked.","mins":480,"pre":["http","concur"],"ideas":["Polling asks the server repeatedly and wastes requests. Long polling holds a request open until data arrives. Both are simple but add latency and load.","Server-Sent Events keep one HTTP response open and send text events down it. The browser reconnects automatically and resends the last event ID, so SSE fits one-way feeds like token streams.","A WebSocket starts as an HTTP request with an Upgrade header, then becomes a full-duplex framed channel on the same TCP connection. Use it when the client must also send frequent messages.","Long-lived connections change scaling. Each one holds memory and a socket, load balancers need longer idle timeouts, and to broadcast across many servers you need a pub/sub layer such as Redis."],"callout":["Pitfall","Proxies and load balancers often close idle connections after 60 seconds. Send heartbeats (SSE comments or WebSocket pings) and make clients reconnect and resume cleanly."],"lectures":[{"t":"WebSockets Crash Course: Handshake, Use-cases, Pros & Cons and more","u":"https://www.youtube.com/watch?v=2Nt-ZrNP22A","by":"Hussein Nasser"},{"t":"Server-Sent Events Crash Course","u":"https://www.youtube.com/watch?v=4HlNv1qpZFY","by":"Hussein Nasser"}],"papers":[{"t":"RFC 6455: The WebSocket Protocol","u":"https://www.rfc-editor.org/rfc/rfc6455","by":"IETF"},{"t":"HTML Standard: Server-sent events","u":"https://html.spec.whatwg.org/multipage/server-sent-events.html","by":"WHATWG"},{"t":"High Performance Browser Networking: WebSocket","u":"https://hpbn.co/websocket/","by":"Ilya Grigorik"},{"t":"MDN: Using server-sent events","u":"https://developer.mozilla.org/en-US/docs/Web/API/Server-sent_events/Using_server-sent_events","by":"Mozilla"}],"reads":[{"t":"Server-Sent Events: the alternative to WebSockets you should be using","u":"https://germano.dev/sse-websockets/","by":"Germano Gabbianelli"},{"t":"Real-time Messaging","u":"https://slack.engineering/real-time-messaging/","by":"Slack Engineering"},{"t":"How Figma's multiplayer technology works","u":"https://www.figma.com/blog/how-figmas-multiplayer-technology-works/","by":"Evan Wallace, Figma"}],"projects":[{"n":"Streaming endpoint","l":"Beginner","d":"Add an SSE endpoint to your FastAPI service that streams progress events from a slow job. Test reconnection by killing the connection and checking that Last-Event-ID resumes the stream."},{"n":"Multi-server chat","l":"Advanced","d":"Build a WebSocket chat room in FastAPI, run two instances behind nginx and fan messages out through Redis pub/sub. Measure message latency and memory per connection at 1,000 clients."}],"repos":[{"r":"python-websockets/websockets","d":"Well documented WebSocket library for Python"},{"r":"sysid/sse-starlette","d":"Server-Sent Events support for Starlette and FastAPI"},{"r":"centrifugal/centrifugo","d":"Scalable real-time messaging server worth studying"}]}]},{"id":"server","title":"Building servers","level":"Beginner \u2192 Intermediate","intro":"Write, structure and test a Python web service. You will build one FastAPI service here and keep extending it through the rest of the course.","phase":1,"optional":false,"topics":[{"id":"framework","title":"Web frameworks & the request lifecycle","short":"Web frameworks","level":"Beginner","why":"A framework turns raw HTTP into function calls, and knowing each step of the request lifecycle tells you where to put auth, logging, database sessions and error handling.","mins":1200,"pre":["lang","http"],"ideas":["A Python web stack has layers. A server like Uvicorn handles sockets and HTTP parsing, then calls your app through the ASGI interface with a scope, a receive function and a send function.","Middleware wraps the whole app, so each request passes through it on the way in and the response on the way out. It suits cross-cutting work like request IDs, timing, CORS and compression.","Routing matches the method and path to a handler. FastAPI then resolves dependencies (database session, current user), validates inputs and serializes the return value into JSON.","Lifespan events run once at startup and shutdown. Create shared resources like connection pools there, not per request, and close them cleanly when the process stops."],"callout":["Pitfall","In FastAPI a plain def handler runs in a thread pool, but an async def handler runs on the event loop. A blocking call inside async def stalls every other request."],"lectures":[{"t":"CS50x 2024 Lecture 9: Flask","u":"https://www.youtube.com/watch?v=-aqUek49iL8","by":"CS50, Harvard"},{"t":"Intro to FastAPI","u":"https://www.youtube.com/watch?v=L0LvciAGiCU","by":"Sebasti\u00e1n Ram\u00edrez, PiterPy"},{"t":"How to Write Deployment-friendly Applications","u":"https://www.youtube.com/watch?v=wuCpCkrfeMs","by":"Hynek Schlawack, PyCon 2018"}],"papers":[{"t":"FastAPI Tutorial: User Guide","u":"https://fastapi.tiangolo.com/tutorial/","by":"Sebasti\u00e1n Ram\u00edrez"},{"t":"ASGI Specification","u":"https://asgi.readthedocs.io/en/latest/specs/main.html","by":"Django Software Foundation"},{"t":"PEP 3333: Python Web Server Gateway Interface","u":"https://peps.python.org/pep-3333/","by":"Phillip J. Eby"},{"t":"Starlette Middleware","u":"https://starlette.dev/middleware/","by":"Encode / Starlette"}],"reads":[{"t":"Let's Build A Web Server. Part 1","u":"https://ruslanspivak.com/lsbaws-part1/","by":"Ruslan Spivak"},{"t":"Concurrency and async / await","u":"https://fastapi.tiangolo.com/async/","by":"FastAPI docs"},{"t":"Concurrent Servers: Part 1","u":"https://eli.thegreenplace.net/2017/concurrent-servers-part-1-introduction/","by":"Eli Bendersky"}],"projects":[{"n":"Raw ASGI app","l":"Intermediate","d":"Write a tiny ASGI app with no framework that routes two paths and returns JSON, and run it under Uvicorn. Add a middleware that logs method, path, status and duration."},{"n":"Course service v1","l":"Beginner","d":"Build the notes API in FastAPI with routers, a lifespan-managed database pool and a request ID middleware. Load test with a sync and an async handler that both sleep, and compare throughput."}],"repos":[{"r":"fastapi/fastapi","d":"The framework used through this course"},{"r":"Kludex/starlette","d":"The ASGI toolkit FastAPI is built on; small enough to read"},{"r":"zhanymkanov/fastapi-best-practices","d":"Practical conventions for structuring FastAPI projects"}]},{"id":"validation","title":"Validation, errors & API contracts","short":"Validation","level":"Intermediate","why":"Validating input at the edge and returning consistent errors keeps bad data out of your database and makes your API predictable for clients.","mins":600,"pre":["framework","apis"],"ideas":["Parse, don't validate: convert raw input into a typed object once, at the boundary. Inner code then receives a model that is already correct and never re-checks strings.","Pydantic models declare fields, types and constraints. FastAPI uses them to reject bad requests with a 422, and to generate an OpenAPI schema that clients can use to build SDKs.","Separate input, storage and output models. A response model that whitelists fields stops you from leaking a password hash or internal ID by accident.","Return errors in one consistent shape, such as RFC 9457 Problem Details, with a stable machine-readable type and a human message. Map domain exceptions to status codes in one handler, not in every route."],"callout":["Pitfall","Returning a 500 with a stack trace for bad input leaks internals and hides the real problem. Client mistakes should be 4xx with a clear message, and only server bugs should be 5xx."],"lectures":[{"t":"How Pydantic V2 leverages Rust's Superpowers","u":"https://www.youtube.com/watch?v=pWZw7hYoRVU","by":"Samuel Colvin, PyCon US"},{"t":"Boundaries","u":"https://www.youtube.com/watch?v=eOYal8elnZk","by":"Gary Bernhardt"},{"t":"Representing Problem Details in HTTP APIs: An Introduction to RFC 7807","u":"https://www.youtube.com/watch?v=UNdUjBqsUqg","by":"Erik Wilde"}],"papers":[{"t":"RFC 9457: Problem Details for HTTP APIs","u":"https://www.rfc-editor.org/rfc/rfc9457","by":"IETF"},{"t":"Pydantic: Models","u":"https://docs.pydantic.dev/latest/concepts/models/","by":"Pydantic"},{"t":"OpenAPI Specification","u":"https://spec.openapis.org/oas/latest.html","by":"OpenAPI Initiative"},{"t":"FastAPI: Handling Errors","u":"https://fastapi.tiangolo.com/tutorial/handling-errors/","by":"FastAPI docs"}],"reads":[{"t":"Parse, don't validate","u":"https://lexi-lambda.github.io/blog/2019/11/05/parse-don-t-validate/","by":"Alexis King"},{"t":"Hyrum's Law","u":"https://www.hyrumslaw.com/","by":"Hyrum Wright"},{"t":"Evolving HTTP APIs","u":"https://www.mnot.net/blog/2012/12/04/api-evolution","by":"Mark Nottingham"}],"projects":[{"n":"Contract-first errors","l":"Intermediate","d":"Add separate create, update and read models to the notes API and a global handler that returns RFC 9457 errors. Write tests that send malformed payloads and assert the exact error shape."},{"n":"Fuzz your schema","l":"Intermediate","d":"Run Schemathesis against your OpenAPI spec and fix every 500 it finds. Track how many distinct failures you fix and which validation rules were missing."}],"repos":[{"r":"pydantic/pydantic","d":"Data validation using Python type hints"},{"r":"schemathesis/schemathesis","d":"Property-based API testing from OpenAPI schemas"},{"r":"python-jsonschema/jsonschema","d":"JSON Schema validation for Python"}]},{"id":"testing","title":"Testing backends","short":"Testing","level":"Intermediate","why":"Good tests let you refactor and deploy with confidence, and a fast reliable suite is what makes continuous delivery possible.","mins":900,"pre":["framework","validation"],"ideas":["Unit tests check one piece of logic in milliseconds. Integration tests check your code against real dependencies like Postgres. A few end-to-end tests check whole user flows. Most bugs in backends live at the integration seams.","pytest fixtures build what a test needs (an app client, a database transaction) and tear it down after. Wrapping each test in a rolled-back transaction keeps tests isolated and fast.","Mock only what you do not own and cannot run, such as a payment provider. Mocking your own database or classes ties tests to implementation details, and they break on every refactor.","Property-based testing generates many inputs from a description and shrinks failures to a minimal case. It finds edge cases like empty strings, unicode and huge numbers that hand-written examples miss."],"callout":["Intuition","Test behavior through public interfaces, such as HTTP calls to your API, not private functions. Then you can rewrite the inside freely while the tests still pass."],"lectures":[{"t":"Outside-In TDD","u":"https://www.youtube.com/watch?v=6zQAu23bKF8","by":"Harry Percival, PyCon 2016"},{"t":"TDD, Where Did It All Go Wrong","u":"https://www.youtube.com/watch?v=EZ05e7EMOLM","by":"Ian Cooper, DevTernity"},{"t":"Stop Writing Tests!","u":"https://www.youtube.com/watch?v=tiy031EoDXo","by":"Zac Hatfield-Dodds, PyCon AU 2020"}],"papers":[{"t":"pytest: How to use fixtures","u":"https://docs.pytest.org/en/stable/how-to/fixtures.html","by":"pytest"},{"t":"FastAPI: Testing","u":"https://fastapi.tiangolo.com/tutorial/testing/","by":"FastAPI docs"},{"t":"Software Engineering at Google, Ch. 12: Unit Testing","u":"https://abseil.io/resources/swe-book/html/ch12.html","by":"Winters, Manshreck, Wright"},{"t":"Testcontainers for Python","u":"https://testcontainers-python.readthedocs.io/en/latest/","by":"Testcontainers"}],"reads":[{"t":"The Practical Test Pyramid","u":"https://martinfowler.com/articles/practical-test-pyramid.html","by":"Ham Vocke"},{"t":"\"Don't Mock What You Don't Own\" in 5 Minutes","u":"https://hynek.me/articles/what-to-mock-in-5-mins/","by":"Hynek Schlawack"},{"t":"Testing Without Mocks: A Pattern Language","u":"https://jamesshore.com/v2/projects/nullables/testing-without-mocks","by":"James Shore"}],"projects":[{"n":"Test suite for the course service","l":"Intermediate","d":"Add pytest tests for the notes API using httpx's ASGI transport and a real Postgres from Testcontainers, with each test inside a rolled-back transaction. Keep the full suite under 10 seconds and report coverage."},{"n":"Property tests for pagination","l":"Advanced","d":"Use Hypothesis to generate random inserts and page sizes, and assert that walking all cursor pages returns every row exactly once. Note any bug it finds and the shrunk input that showed it."}],"repos":[{"r":"pytest-dev/pytest","d":"The standard Python test framework"},{"r":"HypothesisWorks/hypothesis","d":"Property-based testing for Python"},{"r":"cosmicpython/code","d":"Example code from Architecture Patterns with Python, with layered tests"}]}]},{"id":"data","title":"Databases","level":"Beginner \u2192 Intermediate","intro":"Most backend bugs and slowdowns end up in the database. This chapter covers modeling data in PostgreSQL, making queries fast, keeping concurrent writes correct, picking other datastores, and changing schemas safely from Python.","phase":1,"optional":false,"topics":[{"id":"sql","title":"Relational modeling & SQL","short":"SQL & modeling","level":"Beginner","why":"Relational modeling is how you turn a messy domain into tables with keys and constraints, and SQL is how you ask questions of them, so almost every backend depends on it.","mins":1500,"pre":["dsa"],"ideas":["A relation is a set of rows with the same columns. A primary key identifies each row, and a foreign key stores another row's key so the database can enforce that the link is real.","Normalization means storing each fact once. If a customer's email lives in one row instead of in every order, an update cannot leave two copies that disagree.","SQL is declarative. You describe the result you want with SELECT, JOIN, WHERE and GROUP BY, and the query planner decides how to fetch it.","Constraints such as NOT NULL, UNIQUE, CHECK and foreign keys are rules the database enforces on every write. They catch bugs that application code misses when two requests race."],"callout":["Pitfall","A JOIN on a one-to-many relationship repeats the parent row once per child. Summing a parent column after such a join silently counts it many times."],"lectures":[{"t":"F2023 #01 - Relational Model & Algebra","u":"https://www.youtube.com/watch?v=XGMoq-D_mao","by":"CMU Database Group (Andy Pavlo)"},{"t":"F2023 #02 - Modern SQL","u":"https://www.youtube.com/watch?v=n9S4Ibh5O0E","by":"CMU Database Group (Andy Pavlo)"},{"t":"More Than a Query Language: SQL in the 21st Century","u":"https://www.youtube.com/watch?v=MnEDHFOqqno","by":"Markus Winand (Devoxx)"}],"papers":[{"t":"A Relational Model of Data for Large Shared Data Banks (1970)","u":"https://www.seas.upenn.edu/~zives/03f/cis550/codd.pdf","by":"E. F. Codd"},{"t":"PostgreSQL Tutorial","u":"https://www.postgresql.org/docs/current/tutorial.html","by":"PostgreSQL Global Development Group"},{"t":"CMU 15-445/645 Intro to Database Systems (course site)","u":"https://15445.courses.cs.cmu.edu/fall2024/","by":"Carnegie Mellon University"}],"reads":[{"t":"A Simple Guide to Five Normal Forms in Relational Database Theory","u":"https://www.bkent.net/Doc/simple5.htm","by":"William Kent"},{"t":"Select Star SQL (interactive book)","u":"https://selectstarsql.com/","by":"Zi Chong Kao"},{"t":"Modern SQL","u":"https://modern-sql.com/","by":"Markus Winand"}],"projects":[{"n":"Schema for the course API","l":"Beginner","d":"Design the PostgreSQL schema for the service you build through this course (users, projects, tasks, comments) with keys and constraints. Load sample data and write 10 queries using joins, GROUP BY and window functions."},{"n":"Constraint stress test","l":"Intermediate","d":"Write a script that fires invalid and concurrent inserts at your schema (duplicate emails, orphan rows, negative amounts). Record which bad writes the database rejects and which slip through without each constraint."}],"repos":[{"r":"dbcli/pgcli","d":"Postgres CLI with autocompletion and syntax highlighting"},{"r":"jOOQ/sakila","d":"Classic sample DVD-rental database to practice queries on"}]},{"id":"indexes","title":"Indexes & query performance","short":"Indexes & EXPLAIN","level":"Intermediate","why":"Indexes decide whether a query touches ten rows or ten million, and reading query plans is how you find out which one is happening.","mins":900,"pre":["sql","dsa"],"ideas":["An index is a sorted copy of some columns plus pointers to rows. A B+tree keeps it balanced so a lookup takes about log n page reads instead of a full table scan.","Column order in a composite index matters. An index on (tenant_id, created_at) serves filters on tenant_id alone or on both, but not on created_at alone.","EXPLAIN shows the plan the database picked and EXPLAIN ANALYZE runs it and shows real row counts and timings. Big gaps between estimated and actual rows point to stale statistics or a bad plan.","Every index speeds some reads and slows every write, because inserts and updates must change each index too. Add indexes for real query patterns, not for every column."],"callout":["Intuition","Think of a phone book sorted by last name then first name. Finding all Smiths is fast, finding everyone named John is a full read."],"lectures":[{"t":"F2023 #08 - B+Tree Indexes","u":"https://www.youtube.com/watch?v=5gXn5fLkbM0","by":"CMU Database Group (Andy Pavlo)"},{"t":"Database Indexing Explained (with PostgreSQL)","u":"https://www.youtube.com/watch?v=-qNSXK7s7_w","by":"Hussein Nasser"},{"t":"A beginners guide to EXPLAIN ANALYZE","u":"https://www.youtube.com/watch?v=31EmOKBP1PY","by":"Michael Christofides"}],"papers":[{"t":"Use The Index, Luke: SQL Indexing and Tuning (free online book)","u":"https://use-the-index-luke.com/","by":"Markus Winand"},{"t":"Organization and Maintenance of Large Ordered Indices (1972)","u":"https://infolab.usc.edu/csci585/Spring2010/den_ar/indexing.pdf","by":"R. Bayer, E. McCreight"},{"t":"PostgreSQL docs: Indexes","u":"https://www.postgresql.org/docs/current/indexes.html","by":"PostgreSQL Global Development Group"},{"t":"PostgreSQL docs: Using EXPLAIN","u":"https://www.postgresql.org/docs/current/using-explain.html","by":"PostgreSQL Global Development Group"}],"reads":[{"t":"B-trees and database indexes (interactive)","u":"https://planetscale.com/blog/btrees-and-database-indexes","by":"Ben Dicken (PlanetScale)"},{"t":"Explaining the unexplainable","u":"https://www.depesz.com/2013/04/16/explaining-the-unexplainable/","by":"Hubert 'depesz' Lubaczewski"},{"t":"Let's Build a Simple Database","u":"https://cstack.github.io/db_tutorial/","by":"Connor Stack"}],"projects":[{"n":"Index lab on a million rows","l":"Intermediate","d":"Load 1M+ tasks into your schema and time 5 common API queries before and after adding indexes. Record the EXPLAIN ANALYZE plans and the write slowdown each index adds."},{"n":"Slow query hunt","l":"Intermediate","d":"Enable pg_stat_statements on your service, run a load script, and fix the top 3 queries by total time. Report the before and after p95 latency."}],"repos":[{"r":"cmu-db/bustub","d":"CMU teaching DBMS; implement a B+tree index yourself"},{"r":"ankane/pghero","d":"Postgres dashboard that flags missing and unused indexes"}]},{"id":"txn","title":"Transactions, isolation & locking","short":"Transactions","level":"Intermediate","why":"Transactions let many requests change data at once without corrupting it, and knowing what each isolation level does and does not protect against prevents a
