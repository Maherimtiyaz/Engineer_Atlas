uct features all depend on data moved and cleaned reliably from where it is created to where it is used.","mins":1440,"pre":["sql","datasql","queues","events"],"ideas":["ETL extracts data from sources, transforms it and loads it into a warehouse. ELT loads raw data first and transforms it inside the warehouse with SQL, which is the common pattern today with tools like dbt.","A batch pipeline processes a bounded chunk of data, such as one day, on a schedule. Make each run idempotent by overwriting a whole partition, so reruns and backfills give the same result.","An orchestrator like Airflow or Dagster runs tasks as a DAG, handling schedules, dependencies, retries and backfills. Dagster models the data assets you produce rather than only the tasks.","Streaming processes events continuously as they arrive, often from Kafka. Events show up late and out of order, so stream processors group them into windows by event time and use watermarks to decide when a window is complete."],"callout":["Intuition","Treat each partition of a table like the output of a pure function of its inputs. If rerunning yesterday's job can change today's numbers in surprising ways, the pipeline is not idempotent."],"lectures":[{"t":"Functional Data Engineering: A Set of Best Practices","u":"https://www.youtube.com/watch?v=4Spo2QRTz1k","by":"Maxime Beauchemin, Lyft"},{"t":"Turning the database inside out with Apache Samza","u":"https://www.youtube.com/watch?v=fU9hR3kiOK0","by":"Martin Kleppmann, Strange Loop"},{"t":"What is dbt?","u":"https://www.youtube.com/watch?v=rItxGK0cYj8","by":"dbt Labs"}],"papers":[{"t":"The Dataflow Model","u":"https://www.vldb.org/pvldb/vol8/p1792-Akidau.pdf","by":"Akidau et al., VLDB 2015"},{"t":"Airflow core concepts","u":"https://airflow.apache.org/docs/apache-airflow/stable/core-concepts/overview.html","by":"Apache Airflow"},{"t":"What is dbt?","u":"https://docs.getdbt.com/docs/introduction","by":"dbt Labs"},{"t":"Kafka Streams documentation","u":"https://kafka.apache.org/documentation/streams/","by":"Apache Kafka"}],"reads":[{"t":"Streaming 101: The world beyond batch","u":"https://www.oreilly.com/radar/the-world-beyond-batch-streaming-101/","by":"Tyler Akidau"},{"t":"Functional Data Engineering: a modern paradigm for batch data processing","u":"https://maximebeauchemin.medium.com/functional-data-engineering-a-modern-paradigm-for-batch-data-processing-2327ec32c42a","by":"Maxime Beauchemin"}],"projects":[{"n":"Daily batch ELT","l":"Intermediate","d":"Pull a public dataset (for example NYC taxi trips) into DuckDB or Postgres each day with Dagster or Airflow, then model it with dbt including tests. Run a 30-day backfill twice and confirm row counts and checksums match."},{"n":"Streaming aggregates","l":"Advanced","d":"Produce synthetic click events into Kafka with random delays, and compute per-minute counts with event-time windows. Compare results to a batch recount and measure how lateness settings change accuracy and latency."}],"repos":[{"r":"DataTalksClub/data-engineering-zoomcamp","d":"Free 9-week data engineering course with code"},{"r":"dagster-io/dagster","d":"Asset-based data orchestrator"},{"r":"dbt-labs/dbt-core","d":"SQL transformations with tests and lineage"}]}]},{"id":"llmcore","title":"How LLMs work","level":"Intermediate","intro":"Enough depth to reason about model behaviour, cost and limits, without a research detour.","phase":3,"optional":false,"topics":[{"id":"mlp","title":"Neurons, layers & what a network is","level":"Beginner","why":"The basic building block of modern AI.","lectures":[{"t":"But what is a neural network?","u":"https://www.youtube.com/watch?v=aircAruvnKk","by":"3Blue1Brown"},{"t":"The Essential Main Ideas of Neural Networks","u":"https://www.youtube.com/watch?v=CqOfi41LfDw","by":"StatQuest"}],"papers":[{"t":"Deep learning (Nature review, 2015)","u":"https://www.nature.com/articles/nature14539","by":"LeCun, Bengio, Hinton"}],"reads":[{"t":"Neural Networks and Deep Learning, Ch. 1","u":"http://neuralnetworksanddeeplearning.com/chap1.html","by":"Michael Nielsen"},{"t":"A visual proof that neural nets can compute any function","u":"http://neuralnetworksanddeeplearning.com/chap4.html","by":"Michael Nielsen"},{"t":"TensorFlow Playground (train a net in your browser)","u":"https://playground.tensorflow.org/","by":"Google"}],"mins":360,"pre":[],"ideas":["A neuron is a weighted sum plus a non-linearity. Layers stack many neurons.","Without non-linearities, any stack of layers collapses into a single linear function.","Enough hidden units can approximate almost any function (universal approximation).","Depth lets networks reuse features hierarchically: edges, then shapes, then objects."],"callout":["Intuition","Play with TensorFlow Playground for 20 minutes before reading anything else in this chapter."],"projects":[{"n":"MNIST in NumPy","l":"Beginner","d":"Train a 2-layer MLP on MNIST with no framework and reach 97%."},{"n":"Spiral classifier","l":"Beginner","d":"Classify the two-spirals dataset and visualize the decision boundary as you add neurons."}],"repos":[{"r":"mnielsen/neural-networks-and-deep-learning","d":"Code for Nielsen's free book"},{"r":"karpathy/micrograd","d":"A neural net library small enough to read in one sitting"}],"short":"Neural nets"},{"id":"backprop","title":"Backpropagation","level":"Beginner","why":"How a network figures out which weights to blame for an error.","lectures":[{"t":"Backpropagation, intuitively","u":"https://www.youtube.com/watch?v=Ilg3gGewQ5U","by":"3Blue1Brown"},{"t":"Backpropagation calculus","u":"https://www.youtube.com/watch?v=tIeHLnjs5U8","by":"3Blue1Brown"},{"t":"CS231n Lecture 4: Backpropagation and Neural Networks","u":"https://www.youtube.com/watch?v=d14TUNcbn1k","by":"Stanford"}],"papers":[{"t":"Learning representations by back-propagating errors (1986)","u":"https://www.nature.com/articles/323533a0","by":"Rumelhart, Hinton, Williams"}],"reads":[{"t":"How the backpropagation algorithm works","u":"http://neuralnetworksanddeeplearning.com/chap2.html","by":"Michael Nielsen"},{"t":"CS231n notes: Backprop intuitions","u":"https://cs231n.github.io/optimization-2/","by":"Stanford CS231n"}],"mins":600,"pre":["mlp"],"ideas":["Backprop is the chain rule applied backwards through the computation graph.","Each node only needs its local derivative and the gradient flowing in from above.","One forward pass plus one backward pass computes the gradient for every weight.","Frameworks like PyTorch do this automatically with autograd."],"callout":["Intuition","Karpathy's micrograd video is the single best investment in this whole path. Code along, don't just watch."],"projects":[{"n":"Rebuild micrograd","l":"Intermediate","d":"Write your own autograd engine with +, *, tanh and a tiny MLP, without looking at the original."},{"n":"Manual backprop","l":"Intermediate","d":"Derive and code the backward pass of a 2-layer net by hand, then check it against PyTorch."}],"repos":[{"r":"karpathy/micrograd","d":"The original tiny autograd engine"},{"r":"tinygrad/tinygrad","d":"A small but real deep learning framework"}],"short":"Backprop"},{"id":"emb","title":"Word embeddings","level":"Intermediate","why":"Turning words into vectors where meaning becomes geometry.","lectures":[{"t":"Word Embedding and Word2Vec, Clearly Explained","u":"https://www.youtube.com/watch?v=viZrOnJclY0","by":"StatQuest"},{"t":"CS224N Lecture 1: Intro and Word Vectors","u":"https://www.youtube.com/watch?v=rmVRLeJRkl4","by":"Christopher Manning, Stanford"}],"papers":[{"t":"Efficient Estimation of Word Representations (word2vec)","u":"https://arxiv.org/abs/1301.3781","by":"Mikolov et al."},{"t":"Distributed Representations of Words and Phrases","u":"https://arxiv.org/abs/1310.4546","by":"Mikolov et al."},{"t":"GloVe: Global Vectors for Word Representation","u":"https://nlp.stanford.edu/pubs/glove.pdf","by":"Pennington, Socher, Manning"}],"reads":[{"t":"The Illustrated Word2vec","u":"https://jalammar.github.io/illustrated-word2vec/","by":"Jay Alammar"},{"t":"Deep Learning, NLP, and Representations","u":"https://colah.github.io/posts/2014-07-NLP-RNNs-Representations/","by":"Chris Olah"}],"mins":360,"pre":["mlp"],"ideas":["An embedding maps a discrete token to a dense vector.","word2vec learns vectors by predicting neighbouring words.","Similar meanings end up close together, and some relations become vector arithmetic.","Every LLM begins with an embedding table."],"callout":["Intuition","king \u2212 man + woman \u2248 queen is the famous demo. The important part is that meaning becomes geometry you can compute with."],"projects":[{"n":"word2vec from scratch","l":"Intermediate","d":"Train skip-gram with negative sampling on a small corpus and explore nearest neighbours."},{"n":"Semantic search","l":"Beginner","d":"Embed 1,000 sentences with sentence-transformers and build a search box."}],"repos":[{"r":"stanfordnlp/GloVe","d":"Official GloVe code"},{"r":"UKPLab/sentence-transformers","d":"Sentence embeddings made easy"}],"short":"Embeddings"},{"id":"attn","title":"Attention","level":"Intermediate","why":"Letting a model look back at the most relevant parts of its input.","lectures":[{"t":"Attention for Neural Networks, Clearly Explained","u":"https://www.youtube.com/watch?v=PSs6nxngL6k","by":"StatQuest"},{"t":"Attention in transformers, step-by-step","u":"https://www.youtube.com/watch?v=eMlx5fFNoYc","by":"3Blue1Brown"}],"papers":[{"t":"Neural Machine Translation by Jointly Learning to Align and Translate","u":"https://arxiv.org/abs/1409.0473","by":"Bahdanau, Cho, Bengio"},{"t":"Effective Approaches to Attention-based NMT","u":"https://arxiv.org/abs/1508.04025","by":"Luong, Pham, Manning"}],"reads":[{"t":"Visualizing A Neural Machine Translation Model","u":"https://jalammar.github.io/visualizing-neural-machine-translation-mechanics-of-seq2seq-models-with-attention/","by":"Jay Alammar"},{"t":"Attention? Attention!","u":"https://lilianweng.github.io/posts/2018-06-24-attention/","by":"Lilian Weng"}],"mins":360,"pre":[],"ideas":["Attention lets each output look at all inputs and weigh them by relevance.","Query, key and value: score every query against every key, softmax, then mix the values.","Attention weights are interpretable as alignments.","Self-attention applies this to a sequence attending to itself."],"callout":["Intuition","Attention is a soft, differentiable dictionary lookup. The query asks, the keys match, the values answer."],"projects":[{"n":"Attention heatmaps","l":"Intermediate","d":"Add Bahdanau attention to a seq2seq model and plot the alignment matrix."},{"n":"Explore BERT's attention","l":"Beginner","d":"Use bertviz to inspect attention heads on your own sentences."}],"repos":[{"r":"jessevig/bertviz","d":"Visualize attention in Transformer models"}],"short":"Attention"},{"id":"tf","title":"The Transformer architecture","level":"Intermediate","why":"Attention, stacked. The core of GPT, Claude, Gemini and most vision models.","lectures":[{"t":"Transformers, the tech behind LLMs","u":"https://www.youtube.com/watch?v=wjZofJX0v4M","by":"3Blue1Brown"},{"t":"Let's build GPT: from scratch, in code, spelled out","u":"https://www.youtube.com/watch?v=kCc8FmEb1nY","by":"Andrej Karpathy"},{"t":"Attention Is All You Need (paper explained)","u":"https://www.youtube.com/watch?v=iDulhoQ2pro","by":"Yannic Kilcher"}],"papers":[{"t":"Attention Is All You Need","u":"https://arxiv.org/abs/1706.03762","by":"Vaswani et al."},{"t":"RoFormer: Rotary Position Embedding","u":"https://arxiv.org/abs/2104.09864","by":"Su et al."}],"reads":[{"t":"The Illustrated Transformer","u":"https://jalammar.github.io/illustrated-transformer/","by":"Jay Alammar"},{"t":"The Annotated Transformer (paper as runnable code)","u":"https://nlp.seas.harvard.edu/annotated-transformer/","by":"Harvard NLP"},{"t":"Transformer Explainer (interactive)","u":"https://poloclub.github.io/transformer-explainer/","by":"Georgia Tech Polo Club"}],"mins":1200,"pre":["attn"],"ideas":["A Transformer block is multi-head self-attention plus an MLP, each with a residual connection and LayerNorm.","Positional information comes from position encodings (sinusoidal, learned or rotary).","Causal masking turns it into a next-token predictor (GPT). Bidirectional attention gives BERT.","Everything runs in parallel across the sequence, which is why Transformers scale on GPUs."],"callout":["Intuition","Code it. Karpathy's 'Let's build GPT' plus The Annotated Transformer is the path. Watching alone won't make it stick."],"projects":[{"n":"GPT from scratch","l":"Advanced","d":"Follow 'Let's build GPT' and train a character-level model on Tiny Shakespeare."},{"n":"Attention unit tests","l":"Intermediate","d":"Implement multi-head attention and test it against torch.nn.MultiheadAttention."}],"repos":[{"r":"karpathy/nanoGPT","d":"The simplest fast repo for training GPTs"},{"r":"harvardnlp/annotated-transformer","d":"The paper, line by line, as code"},{"r":"karpathy/minGPT","d":"Minimal, educational GPT"}],"short":"Transformer"},{"id":"tok","title":"Tokenization","level":"Intermediate","why":"Why models struggle to spell and count letters. The hidden first step of every LLM.","lectures":[{"t":"Let's build the GPT Tokenizer","u":"https://www.youtube.com/watch?v=zduSFxRajkE","by":"Andrej Karpathy"}],"papers":[{"t":"Neural Machine Translation of Rare Words with Subword Units (BPE)","u":"https://arxiv.org/abs/1508.07909","by":"Sennrich, Haddow, Birch"},{"t":"SentencePiece","u":"https://arxiv.org/abs/1808.06226","by":"Kudo & Richardson"}],"reads":[{"t":"Hugging Face LLM Course: Tokenizers","u":"https://huggingface.co/learn/llm-course/chapter6/1","by":"Hugging Face"},{"t":"Tiktokenizer (see how text gets tokenized)","u":"https://tiktokenizer.vercel.app/","by":"Community tool"}],"mins":360,"pre":["tf"],"ideas":["LLMs see tokens, not characters. Byte-pair encoding (BPE) merges frequent pairs into tokens.","Tokenization explains odd failures: spelling, arithmetic, non-English text.","Vocabulary size trades sequence length against embedding-table size.","Special tokens mark chat roles, the end of text, and tool calls."],"callout":["Pitfall","When an LLM can't count the r's in 'strawberry', that's usually a tokenization artefact, not a reasoning failure."],"projects":[{"n":"BPE from scratch","l":"Intermediate","d":"Implement BPE training and encoding, then compare your output with tiktoken."},{"n":"Token cost explorer","l":"Beginner","d":"Compare token counts for the same text in English, Hindi and code."}],"repos":[{"r":"karpathy/minbpe","d":"Minimal BPE tokenizer"},{"r":"openai/tiktoken","d":"Fast BPE tokenizer used by OpenAI models"},{"r":"huggingface/tokenizers","d":"Fast tokenizers in Rust"}],"short":"Tokenization"},{"id":"pretrain","title":"Pretraining: BERT, GPT & friends","level":"Intermediate","why":"Predict the next token on the internet, at scale. Most of the capability comes from here.","lectures":[{"t":"Intro to Large Language Models","u":"https://www.youtube.com/watch?v=zjkBMFhNj_g","by":"Andrej Karpathy"},{"t":"Deep Dive into LLMs like ChatGPT","u":"https://www.youtube.com/watch?v=7xTGNNLPyMI","by":"Andrej Karpathy"},{"t":"Let's reproduce GPT-2 (124M)","u":"https://www.youtube.com/watch?v=l8pRSuU81PU","by":"Andrej Karpathy"}],"papers":[{"t":"Improving Language Understanding by Generative Pre-Training (GPT-1)","u":"https://cdn.openai.com/research-covers/language-unsupervised/language_understanding_paper.pdf","by":"Radford et al."},{"t":"BERT","u":"https://arxiv.org/abs/1810.04805","by":"Devlin et al."},{"t":"Language Models are Unsupervised Multitask Learners (GPT-2)","u":"https://cdn.openai.com/better-language-models/language_models_are_unsupervised_multitask_learners.pdf","by":"Radford et al."},{"t":"Language Models are Few-Shot Learners (GPT-3)","u":"https://arxiv.org/abs/2005.14165","by":"Brown et al."},{"t":"LLaMA: Open and Efficient Foundation Language Models","u":"https://arxiv.org/abs/2302.13971","by":"Touvron et al."}],"reads":[{"t":"The Illustrated GPT-2","u":"https://jalammar.github.io/illustrated-gpt2/","by":"Jay Alammar"},{"t":"The Illustrated BERT","u":"https://jalammar.github.io/illustrated-bert/","by":"Jay Alammar"},{"t":"nanoGPT (the simplest GPT training repo)","u":"https://github.com/karpathy/nanoGPT","by":"Andrej Karpathy"},{"t":"Stanford CS336: Language Modeling from Scratch","u":"https://cs336.stanford.edu/","by":"Stanford"}],"mins":1200,"pre":["tf","tok"],"ideas":["Pretraining means next-token prediction on trillions of tokens of text.","Data quality and filtering matter as much as the architecture.","BERT (masked, bidirectional) is for understanding. GPT (causal) is for generation.","A base model is a document completer. It isn't an assistant until post-training."],"callout":["Intuition","Watch 'Intro to LLMs' first for the map, then 'Deep Dive into LLMs' for the full pipeline. Reproduce GPT-2 when you're ready."],"projects":[{"n":"Reproduce GPT-2 small","l":"Advanced","d":"Follow 'Let's reproduce GPT-2' with llm.c or nanoGPT on a rented GPU."},{"n":"Train a tiny story model","l":"Intermediate","d":"Pretrain a 10M-parameter model on TinyStories and sample from it."}],"repos":[{"r":"rasbt/LLMs-from-scratch","d":"Build a ChatGPT-like LLM step by step"},{"r":"karpathy/llm.c","d":"LLM training in plain C/CUDA"},{"r":"karpathy/nanochat","d":"Full-stack ChatGPT clone, from training to UI"}],"short":"Pretraining"},{"id":"posttrain","title":"Post-training: instruction tuning, RLHF & DPO","level":"Advanced","why":"How a raw text predictor becomes a helpful assistant.","lectures":[{"t":"RLHF explained, with PPO","u":"https://www.youtube.com/watch?v=qGyFrqc34yc","by":"Umar Jamil"},{"t":"Direct Preference Optimization explained","u":"https://www.youtube.com/watch?v=hvGa5Mba4c8","by":"Umar Jamil"}],"papers":[{"t":"Deep RL from Human Preferences","u":"https://arxiv.org/abs/1706.03741","by":"Christiano et al."},{"t":"Training LMs to Follow Instructions with Human Feedback (InstructGPT)","u":"https://arxiv.org/abs/2203.02155","by":"Ouyang et al."},{"t":"Constitutional AI: Harmlessness from AI Feedback","u":"https://arxiv.org/abs/2212.08073","by":"Bai et al., Anthropic"},{"t":"Direct Preference Optimization","u":"https://arxiv.org/abs/2305.18290","by":"Rafailov et al."}],"reads":[{"t":"Illustrating RLHF","u":"https://huggingface.co/blog/rlhf","by":"Hugging Face"},{"t":"RLHF: Reinforcement Learning from Human Feedback","u":"https://huyenchip.com/2023/05/02/rlhf.html","by":"Chip Huyen"},{"t":"The RLHF Book (free)","u":"https://rlhfbook.com/","by":"Nathan Lambert"}],"mins":900,"pre":["pretrain"],"ideas":["Supervised fine-tuning (SFT) on demonstrations teaches the assistant format.","RLHF trains a reward model on human preferences, then optimizes the policy with PPO.","DPO skips the reward model and optimizes directly on preference pairs.","Constitutional AI replaces much of the human feedback with AI feedback guided by principles."],"callout":["Intuition","Pretraining gives the model knowledge. Post-training gives it manners and judgment."],"projects":[{"n":"SFT a small model","l":"Intermediate","d":"Fine-tune a 0.5\u20131B model on an instruction dataset with TRL."},{"n":"DPO run","l":"Advanced","d":"Run DPO on a preference dataset and compare outputs before and after."}],"repos":[{"r":"huggingface/trl","d":"SFT, DPO, PPO and GRPO trainers"},{"r":"allenai/open-instruct","d":"Open post-training recipes"},{"r":"eric-mitchell/direct-preference-optimization","d":"Reference DPO implementation"}],"short":"RLHF & DPO"},{"id":"reason","title":"Reasoning models & test-time compute","level":"Advanced","why":"Models that think before they answer, trained with reinforcement learning.","lectures":[{"t":"CME295 Lecture 6: LLM Reasoning","u":"https://www.youtube.com/watch?v=nU2a2lm6vDE","by":"Stanford"},{"t":"GRPO Explained: the RL algorithm behind DeepSeek-R1","u":"https://www.youtube.com/watch?v=UGHHJYTmA8s","by":"Paper Explained"},{"t":"Parables on the Power of Planning in AI","u":"https://www.youtube.com/watch?v=eaAonE58sLU","by":"Noam Brown, OpenAI"}],"papers":[{"t":"Chain-of-Thought Prompting Elicits Reasoning","u":"https://arxiv.org/abs/2201.11903","by":"Wei et al."},{"t":"Self-Consistency Improves Chain of Thought","u":"https://arxiv.org/abs/2203.11171","by":"Wang et al."},{"t":"Let's Verify Step by Step","u":"https://arxiv.org/abs/2305.20050","by":"Lightman et al."},{"t":"Scaling LLM Test-Time Compute Optimally","u":"https://arxiv.org/abs/2408.03314","by":"Snell et al."},{"t":"DeepSeek-R1: Incentivizing Reasoning via RL","u":"https://arxiv.org/abs/2501.12948","by":"DeepSeek-AI"}],"reads":[{"t":"Understanding Reasoning LLMs","u":"https://magazine.sebastianraschka.com/p/understanding-reasoning-llms","by":"Sebastian Raschka"},{"t":"Why We Think","u":"https://lilianweng.github.io/posts/2025-05-01-thinking/","by":"Lilian Weng"}],"mins":720,"pre":["posttrain"],"ideas":["Chain-of-thought means letting the model write out steps before answering.","Test-time compute: sampling more and verifying can beat a bigger model.","Reasoning models are trained with RL on verifiable rewards (maths, code).","GRPO is a simpler PPO variant used to train DeepSeek-R1."],"callout":["Intuition","This is the newest chapter and changes the fastest. Check the Daily drop for papers tagged here."],"projects":[{"n":"Self-consistency","l":"Intermediate","d":"Sample 10 chain-of-thought answers on GSM8K and majority-vote. Measure the gain."},{"n":"Tiny R1-Zero","l":"Advanced","d":"Reproduce a TinyZero-style RL run where a small model learns to reason on a countdown game."}],"repos":[{"r":"huggingface/open-r1","d":"Open reproduction of DeepSeek-R1"},{"r":"Jiayi-Pan/TinyZero","d":"Minimal R1-Zero reproduction"},{"r":"deepseek-ai/DeepSeek-R1","d":"DeepSeek-R1 release"}],"short":"Reasoning"},{"id":"peft","title":"Efficient fine-tuning & quantization","level":"Advanced","why":"Adapting and running big models on small hardware.","lectures":[{"t":"LoRA explained (and a bit about precision and quantization)","u":"https://www.youtube.com/watch?v=PXWYUTMt-AU","by":"Umar Jamil"}],"papers":[{"t":"LoRA: Low-Rank Adaptation of LLMs","u":"https://arxiv.org/abs/2106.09685","by":"Hu et al."},{"t":"QLoRA: Efficient Finetuning of Quantized LLMs","u":"https://arxiv.org/abs/2305.14314","by":"Dettmers et al."},{"t":"LLM.int8(): 8-bit Matrix Multiplication for Transformers","u":"https://arxiv.org/abs/2208.07339","by":"Dettmers et al."}],"reads":[{"t":"A Visual Guide to Quantization","u":"https://newsletter.maartengrootendorst.com/p/a-visual-guide-to-quantization","by":"Maarten Grootendorst"},{"t":"Practical Tips for Finetuning LLMs Using LoRA","u":"https://magazine.sebastianraschka.com/p/practical-tips-for-finetuning-llms","by":"Sebastian Raschka"}],"mins":900,"pre":["posttrain"],"ideas":["LoRA freezes the model and trains small low-rank update matrices.","Quantization stores weights in 8, 4 or fewer bits to save memory.","QLoRA combines both, so you can fine-tune large models on one GPU.","GGUF and llama.cpp run quantized models on laptops."],"callout":["Pitfall","Fine-tuning is rarely the first answer. Try prompting and RAG first, and fine-tune only for style, format or narrow skills."],"projects":[{"n":"LoRA on a laptop","l":"Intermediate","d":"QLoRA fine-tune a small model on your own notes with Unsloth."},{"n":"Quantization benchmark","l":"Intermediate","d":"Compare 16-, 8- and 4-bit versions of one model on speed, memory and quality."}],"repos":[{"r":"huggingface/peft","d":"LoRA and other adapters"},{"r":"unslothai/unsloth","d":"Faster, lighter fine-tuning"},{"r":"ggml-org/llama.cpp","d":"Run LLMs locally on CPU or GPU"}],"short":"LoRA & quant."}]},{"id":"apps","title":"AI engineering","level":"Intermediate","intro":"Build features on top of models: calling LLM APIs well, retrieval, evaluation, cost and latency.","phase":4,"optional":false,"topics":[{"id":"llmapi","title":"LLM APIs, streaming & structured output","short":"LLM APIs","level":"Intermediate","why":"Every LLM feature starts with an HTTP call to a model, and doing it well means streaming tokens to users, getting parseable JSON back and surviving timeouts and rate limits.","mins":720,"pre":["http","realtime","validation"],"ideas":["A chat API is stateless: you send the whole conversation (system prompt plus messages) on every request, and you pay for every input and output token. Your server owns the history, usually in Postgres or Redis.","Streaming returns tokens as server-sent events while the model generates. Proxy them from the provider to the browser over your own SSE endpoint so users see the first words in under a second instead of waiting for the full answer.","Structured output constrains the model to a JSON schema. Define the schema as a Pydantic model, pass it to the API (or a library like Instructor), and validate the result before trusting it.","Model calls fail in normal ways: 429 rate limits, 529 or 5xx overloads, and slow responses. Set explicit timeouts, retry with exponential backoff and jitter only on retryable errors, and cap max_tokens so one request cannot run forever."],"callout":["Pitfall","A stream can fail halfway after you have already sent a 200 to the client. Send an explicit error event over SSE and log the partial output, because you cannot change the status code anymore."],"lectures":[{"t":"[1hr Talk] Intro to Large Language Models","u":"https://www.youtube.com/watch?v=zjkBMFhNj_g","by":"Andrej Karpathy"},{"t":"Large Language Models explained briefly","u":"https://www.youtube.com/watch?v=LPZh9BOjkQs","by":"3Blue1Brown"}],"papers":[{"t":"Streaming messages","u":"https://docs.claude.com/en/docs/build-with-claude/streaming","by":"Anthropic docs"},{"t":"Structured outputs","u":"https://docs.claude.com/en/docs/build-with-claude/structured-outputs","by":"Anthropic docs"},{"t":"Claude API errors","u":"https://docs.claude.com/en/api/errors","by":"Anthropic docs"},{"t":"Server-sent events (HTML Living Standard)","u":"https://html.spec.whatwg.org/multipage/server-sent-events.html","by":"WHATWG"}],"reads":[{"t":"All the Hard Stuff Nobody Talks About when Building Products with LLMs","u":"https://www.honeycomb.io/blog/hard-stuff-nobody-talks-about-llm","by":"Phillip Carter, Honeycomb"},{"t":"Using server-sent events","u":"https://developer.mozilla.org/en-US/docs/Web/API/Server-sent_events/Using_server-sent_events","by":"MDN"},{"t":"Building LLM applications for production","u":"https://huyenchip.com/2023/04/11/llm-engineering.html","by":"Chip Huyen"}],"projects":[{"n":"Streaming chat endpoint","l":"Intermediate","d":"Add a FastAPI /chat endpoint that streams model tokens to the browser over SSE and stores the conversation in Postgres. Measure time to first token and total latency for short and long prompts."},{"n":"Typed extraction service","l":"Intermediate","d":"Build an endpoint that turns free-text support tickets into a Pydantic object (category, priority, product). Add timeouts and backoff retries, then count how often validation fails across 200 real or synthetic tickets."}],"repos":[{"r":"anthropics/anthropic-sdk-python","d":"Official Python SDK; read its retry, timeout and streaming helpers"},{"r":"567-labs/instructor","d":"Pydantic-validated structured outputs with automatic re-asking on failure"},{"r":"sysid/sse-starlette","d":"Production SSE responses for Starlette and FastAPI"}]},{"id":"prompt","title":"Prompting & in-context learning","level":"Beginner","why":"The cheapest, fastest way to get better results from a model.","lectures":[{"t":"Prompting 101","u":"https://www.youtube.com/watch?v=ysPbXH0LpIE","by":"Anthropic"},{"t":"How I use LLMs","u":"https://www.youtube.com/watch?v=EWvNQjAaOHw","by":"Andrej Karpathy"}],"papers":[{"t":"Language Models are Few-Shot Learners (GPT-3)","u":"https://arxiv.org/abs/2005.14165","by":"Brown et al."},{"t":"Large Language Models are Zero-Shot Reasoners","u":"https://arxiv.org/abs/2205.11916","by":"Kojima et al."}],"reads":[{"t":"Prompt Engineering","u":"https://lilianweng.github.io/posts/2023-03-15-prompt-engineering/","by":"Lilian Weng"},{"t":"Prompt engineering overview","u":"https://docs.anthropic.com/en/docs/build-with-claude/prompt-engineering/overview","by":"Anthropic docs"}],"mins":600,"pre":["pretrain"],"ideas":["Clear instructions, context and examples beat clever tricks.","Few-shot examples teach format and style in context.","Ask the model to think step by step for hard problems.","Structure prompts with sections or XML tags, and tell the model what to output."],"callout":["Intuition","Write prompts the way you'd brief a smart new colleague who has zero context."],"projects":[{"n":"Prompt test bench","l":"Beginner","d":"Build a script that runs 3 prompt variants over 20 inputs and compares the outputs side by side."},{"n":"Structured extractor","l":"Beginner","d":"Extract JSON from messy emails reliably, and measure the failure rate."}],"repos":[{"r":"anthropics/prompt-eng-interactive-tutorial","d":"Anthropic's interactive prompting course"},{"r":"dair-ai/Prompt-Engineering-Guide","d":"Guides, papers and techniques"}],"short":"Prompting"},{"id":"ai_coding","title":"Working with AI coding tools: Claude Code, Copilot & agentic workflows","short":"AI coding tools","level":"Intermediate","why":"Coding agents can now write, run and fix code across a repo, and knowing how to direct and verify them is a core engineering skill.","mins":1200,"pre":["cli","testing","prompt"],"ideas":["An agentic coding tool runs a loop: read files, plan, edit, run a command such as tests, read the output, and repeat. It works best when it has a fast, reliable way to check its own work, so invest in tests, linters and type checks before you invest in prompts.","Use explore, plan, then code. Ask the agent to read the relevant files and write a plan first, review the plan, and only then let it edit. Catching a wrong approach in a plan costs one message; catching it in a 600-line diff costs an hour.","Context is the main lever. Keep a short project memory file (CLAUDE.md, AGENTS.md or Copilot instructions) with build commands, conventions and gotchas, point the agent at specific files, and clear or restart the session when it drifts.","You own every line that ships. Keep changes small, read the diff, run the tests yourself, and commit often so you can roll back. Treat agent output like a pull request from a fast junior colleague who never gets tired and sometimes invents APIs."],"callout":["Pitfall","Letting an agent loop on a vague task with no tests produces code that looks right and is wrong in quiet ways. Give it a concrete goal and a command that proves success, such as a failing test it must make pass."],"lectures":[{"t":"Mastering Claude Code in 30 minutes","u":"https://www.youtube.com/watch?v=6eBSHbLKuN0","by":"Anthropic"},{"t":"Software Is Changing (Again)","u":"https://www.youtube.com/watch?v=LCEmiRjPEtQ","by":"Andrej Karpathy (Y Combinator)"},{"t":"Engineering practices that make coding agents work","u":"https://www.youtube.com/watch?v=owmJyKVu5f8","by":"Simon Willison (The Pragmatic Engineer)"}],"papers":[{"t":"Claude Code: Best practices for agentic coding","u":"https://www.anthropic.com/engineering/claude-code-best-practices","by":"Anthropic Engineering"},{"t":"Claude Code documentation: best practices","u":"https://code.claude.com/docs/en/best-practices","by":"Anthropic"},{"t":"GitHub Copilot documentation: best practices","u":"https://docs.github.com/en/copilot/get-started/best-practices","by":"GitHub"}],"reads":[{"t":"Here's how I use LLMs to help me write code","u":"https://simonwillison.net/2025/Mar/11/using-llms-for-code/","by":"Simon Willison"},{"t":"Vibe engineering","u":"https://simonwillison.net/2025/Oct/7/vibe-engineering/","by":"Simon Willison"},{"t":"My LLM codegen workflow atm","u":"https://harper.blog/2025/02/16/my-llm-codegen-workflow-atm/","by":"Harper Reed"}],"projects":[{"n":"Agent-ready repo","l":"Intermediate","d":"Take one of your projects and add a CLAUDE.md or AGENTS.md, a one-command test run and a linter. Give an agent the same 5 small tasks before and after, and record how many it finishes without your help and how many review comments each diff needs."},{"n":"Spec-to-PR workflow","l":"Advanced","d":"Write a one-page spec for a feature, have an agent produce a plan, then implement it in small commits with tests, and open a PR. Log time spent, tokens or cost, and every bug you caught in review, then write up what you would change next time."}],"repos":[{"r":"anthropics/claude-code","d":"Claude Code CLI: issues, changelog and plugin examples"},{"r":"anthropics/claude-code-action","d":"Run Claude Code in GitHub Actions on PRs and issues"},{"r":"Aider-AI/aider","d":"Open source terminal coding agent; readable code for how edit loops work"}]},{"id":"vectordb","title":"Embeddings & vector databases","short":"Vector search","level":"Intermediate","why":"Embeddings turn text into vectors where similar meaning sits close together, and vector indexes let you find the nearest ones among millions in milliseconds.","mins":720,"pre":["llmapi","indexes","dsa"],"ideas":["An embedding model maps a piece of text to a fixed-length list of numbers. Texts with similar meaning get vectors with high cosine similarity, so search becomes a nearest-neighbor problem.","Exact search compares the query to every vector, which is O(n). Approximate nearest neighbor (ANN) indexes trade a little recall for big speedups, and you tune that trade with index parameters.","HNSW builds a layered graph: sparse upper layers for long jumps and a dense bottom layer for fine search. A query greedily walks toward closer neighbors layer by layer, so it visits a few hundred nodes instead of millions.","pgvector adds a vector column and HNSW or IVFFlat indexes to Postgres. For most apps under tens of millions of vectors this keeps embeddings next to your relational data, with joins, filters and transactions."],"callout":["Pitfall","Vectors from different embedding models, or different versions of one model, are not comparable. Store the model name with each vector and re-embed everything when you switch."],"lectures":[{"t":"Embeddings: What they are and why they matter (PyBay 2023)","u":"https://www.youtube.com/watch?v=snKTqb10vWQ","by":"Simon Willison / SF Python"},{"t":"HNSW for Vector Search Explained and Implemented with Faiss","u":"https://www.youtube.com/watch?v=QvKMwLjdK-s","by":"James Briggs"}],"papers":[{"t":"Efficient and robust approximate nearest neighbor search using Hierarchical Navigable Small World graphs","u":"https://arxiv.org/abs/1603.09320","by":"Malkov & Yashunin"},{"t":"MTEB: Massive Text Embedding Benchmark","u":"https://arxiv.org/abs/2210.07316","by":"Muennighoff et al."},{"t":"pgvector README","u":"https://github.com/pgvector/pgvector","by":"Andrew Kane"}],"reads":[{"t":"Embeddings: What they are and why they matter","u":"https://simonwillison.net/2023/Oct/23/embeddings/","by":"Simon Willison"},{"t":"Hierarchical Navigable Small Worlds (HNSW)","u":"https://www.pinecone.io/learn/series/faiss/hnsw/","by":"James Briggs, Pinecone"},{"t":"An early look at HNSW performance with pgvector","u":"https://jkatz05.com/post/postgres/pgvector-hnsw-performance/","by":"Jonathan Katz"}],"projects":[{"n":"Semantic search in Postgres","l":"Intermediate","d":"Embed a few thousand documents into a pgvector column and add an HNSW index. Compare recall@10 and p95 query latency against exact search while varying ef_search."},{"n":"Embedding model bake-off","l":"Intermediate","d":"Write 50 queries with known correct documents and run them against two or three embedding models. Record recall@5, vector size and embedding cost to pick one."}],"repos":[{"r":"pgvector/pgvector","d":"Vector similarity search inside Postgres"},{"r":"nmslib/hnswlib","d":"Small, readable reference implementation of HNSW"},{"r":"facebookresearch/faiss","d":"Library of ANN indexes (IVF, PQ, HNSW) for large-scale search"}]},{"id":"rag","title":"Retrieval-augmented generation (RAG) & embeddings","level":"Intermediate","why":"Giving a model your documents so it answers from facts, not memory.","lectures":[{"t":"Learn RAG From Scratch","u":"https://www.youtube.com/watch?v=sVcwVQRHIc8","by":"freeCodeCamp \u00d7 LangChain"}],"papers":[{"t":"Retrieval-Augmented Generation for Knowledge-Intensive NLP","u":"https://arxiv.org/abs/2005.11401","by":"Lewis et al."},{"t":"Dense Passage Retrieval","u":"https://arxiv.org/abs/2004.04906","by":"Karpukhin et al."},{"t":"Sentence-BERT","u":"https://arxiv.org/abs/1908.10084","by":"Reimers & Gurevych"},{"t":"Lost in the Middle: How LMs Use Long Contexts","u":"https://arxiv.org/abs/2307.03172","by":"Liu et al."}],"reads":[{"t":"Introducing Contextual Retrieval","u":"https://www.anthropic.com/news/contextual-retrieval","by":"Anthropic"},{"t":"Patterns for Building LLM-based Systems & Products","u":"https://eugeneyan.com/writing/llm-patterns/","by":"Eugene Yan"}],"mins":900,"pre":["emb","prompt"],"ideas":["RAG retrieves relevant chunks and puts them in the prompt.","Chunking, embedding model and retrieval quality decide most of the results.","Hybrid search (BM25 plus embeddings) and re-ranking fix many failures.","Models use the start and end of the context best ('lost in the middle')."],"callout":["Pitfall","Most RAG failures are retrieval failures. Measure whether the right chunk was retrieved before tuning the prompt."],"projects":[{"n":"Chat with your PDFs","l":"Intermediate","d":"Build RAG over your own notes with FAISS or Chroma and show the citations."},{"n":"Retrieval eval","l":"Intermediate","d":"Write 50 question\u2013answer pairs and measure recall@5 for 3 chunking strategies."}],"repos":[{"r":"langchain-ai/rag-from-scratch","d":"Notebooks for the RAG From Scratch series"},{"r":"facebookresearch/faiss","d":"Fast vector similarity search"},{"r":"chroma-core/chroma","d":"Open-source embedding database"}],"short":"RAG"},{"id":"ragprod","title":"Production RAG pipelines","short":"Production RAG","level":"Advanced","why":"Retrieval-augmented generation grounds answers in your own data, and most of its quality comes from ingestion, chunking and retrieval rather than the prompt.","mins":1200,"pre":["vectordb","queues"],"ideas":["RAG has two pipelines. Offline ingestion parses, chunks, embeds and indexes documents, usually as background jobs. Online serving retrieves top chunks for a query and passes them to the model as context.","Chunking decides what can be found. Split on document structure (headings, paragraphs) with modest overlap, and keep metadata such as source, section and date so you can filter and cite.","Hybrid search runs keyword search (BM25) and vector search in parallel and merges the lists, often with reciprocal rank fusion. Keywords catch exact names and IDs that embeddings blur.","A reranker is a cross-encoder that scores each query and chunk pair together. Retrieve 50 to 100 candidates cheaply, rerank them, and send only the best 5 to 10 to the model."],"callout":["Intuition","Treat retrieval as a search engine you can test on its own. If the right chunk is not in the top results, no prompt change will fix the answer."],"lectures":[{"t":"Systematically Improving RAG applications","u":"https://www.youtube.com/watch?v=e668bTot45w","by":"Jason Liu"},{"t":"Back to Basics for RAG w/ Jo Bergum","u":"https://www.youtube.com/watch?v=nc0BupOkrhI","by":"Hamel Husain"}],"papers":[{"t":"Retrieval-Augmented Generation for Knowledge-Intensive NLP Tasks","u":"https://arxiv.org/abs/2005.11401","by":"Lewis et al."},{"t":"Reciprocal Rank Fusion outperforms Condorcet and individual Rank Learning Methods","u":"https://cormack.uwaterloo.ca/cormacksigir09-rrf.pdf","by":"Cormack, Clarke & Buettcher"},{"t":"Lost in the Middle: How Language Models Use Long Contexts","u":"https://arxiv.org/abs/2307.03172","by":"Liu et al."}],"reads":[{"t":"Introducing Contextual Retrieval","u":"https://www.anthropic.com/engineering/contextual-retrieval","by":"Anthropic"},{"t":"Rerankers and Two-Stage Retrieval","u":"https://www.pinecone.io/learn/series/rag/rerankers/","by":"James Briggs, Pinecone"},{"t":"Systematically Improving Your RAG","u":"https://jxnl.co/writing/2024/05/22/systematically-improving-your-rag/","by":"Jason Liu"}],"projects":[{"n":"Docs Q&A with citations","l":"Advanced","d":"Build ingestion as a background job (parse, chunk, embed into pgvector) and a /ask endpoint that answers with cited chunk IDs. Track how often the cited chunk actually supports the answer."},{"n":"Hybrid plus rerank experiment","l":"Advanced","d":"Add Postgres full-text search beside vector search, merge with reciprocal rank fusion, then add a cross-encoder reranker. Measure recall@5 on a fixed query set after each step."}],"repos":[{"r":"run-llama/llama_index","d":"Ingestion, chunking and retrieval building blocks to read and borrow from"},{"r":"UKPLab/sentence-transformers","d":"Embedding and cross-encoder reranker models in Python"},{"r":"explodinggradients/ragas","d":"Metrics for evaluating retrieval and answer faithfulness"}]},{"id":"evals","title":"Evaluating LLMs","level":"Intermediate","why":"If you can't measure it, you can't improve it.","lectures":[{"t":"Why AI evals are the hottest new skill for product builders","u":"https://www.youtube.com/watch?v=BsWxPI9UM4c","by":"Hamel Husain & Shreya Shankar"}],"papers":[{"t":"Measuring Massive Multitask Language Understanding (MMLU)","u":"https://arxiv.org/abs/2009.03300","by":"Hendrycks et al."},{"t":"Holistic Evaluation of Language Models (HELM)","u":"https://arxiv.org/abs/2211.09110","by":"Liang et al."},{"t":"Judging LLM-as-a-Judge","u":"https://arxiv.org/abs/2306.05685","by":"Zheng et al."}],"reads":[{"t":"Your AI Product Needs Evals","u":"https://hamel.dev/blog/posts/evals/","by":"Hamel Husain"},{"t":"Task-Specific LLM Evals that Do & Don't Work","u":"https://eugeneyan.com/writing/evals/","by":"Eugene Yan"}],"mins":900,"pre":["prompt"],"ideas":["Benchmarks (MMLU, SWE-bench) compare models. Your own evals test your product.","Start with error analysis: read the outputs, then group the failures into categories.","LLM-as-judge scales evaluation, but check it against human labels.","Evals are what make prompt and model changes safe."],"callout":["Pitfall","Public benchmark scores get saturated and contaminated. Trust your own task-specific evals more."],"projects":[{"n":"Eval harness","l":"Intermediate","d":"Build a tiny eval runner with test cases, scoring and a results table for one of your projects."},{"n":"Judge calibration","l":"Intermediate","d":"Label 50 outputs yourself, then measure how often an LLM judge agrees with you."}],"repos":[{"r":"EleutherAI/lm-evaluation-harness","d":"Standard benchmark runner"},{"r":"UKGovernmentBEIS/inspect_ai","d":"Framework for LLM evaluations"},{"r":"openai/evals","d":"Evals framework and registry"}],"short":"Evals"},{"id":"costlat","title":"Cost, latency & caching for LLM apps","short":"Cost & latency","level":"Advanced","why":"Model calls are the slowest and most expensive part of an LLM feature, so caching, routing and batching decide whether it is affordable and fast enough.","mins":600,"pre":["evals","caching","queues"],"ideas":["Cost is roughly input tokens times input price plus output tokens times output price. Output tokens are slower and pricier, so cap max_tokens and ask for short answers before reaching for anything clever.","Prompt caching lets the provider reuse the processed prefix of a prompt. Put stable content (system prompt, tool definitions, documents) first and the changing user message last, and repeat calls read that prefix at a fraction of the price and latency.","Model routing sends easy requests to a small fast model and hard ones to a large model. A classifier, simple rules, or a cascade that escalates on low confidence can cut cost a lot if evals show quality holds.","Work that does not need an answer now (backfills, nightly summaries, eval runs) can go through batch APIs at a discount. Semantic or exact response caching in Redis helps only when users really repeat questions."],"callout":["Pitfall","Anything that changes early in the prompt, like a timestamp or a reordered tool list, breaks the cache for everything after it. Check the cache-read token counts in responses to confirm hits."],"lectures":[{"t":"Mastering LLM Inference Optimization From Theory to Cost Effective Deployment","u":"https://www.youtube.com/watch?v=9tvJ_GYJA-o","by":"Mark Moyou / AI Engineer"},{"t":"The State of Model Routing","u":"https://www.youtube.com/watch?v=QHBjufYK8TA","by":"AI Engineer"}],"papers":[{"t":"Prompt caching","u":"https://docs.claude.com/en/docs/build-with-claude/prompt-caching","by":"Anthropic docs"},{"t":"Batch processing","u":"https://docs.claude.com/en/docs/build-with-claude/batch-processing","by":"Anthropic docs"},{"t":"RouteLLM: Learning to Route LLMs with Preference Data","u":"https://arxiv.org/abs/2406.18665","by":"Ong et al."},{"t":"Reducing latency","u":"https://docs.claude.com/en/docs/test-and-evaluate/strengthen-guardrails/reduce-latency","by":"Anthropic docs"}],"reads":[{"t":"Prompt caching with Claude","u":"https://www.anthropic.com/news/prompt-caching","by":"Anthropic"},{"t":"RouteLLM: An Open-Source Framework for Cost-Effective LLM Routing","u":"https://lmsys.org/blog/2024-07-01-routellm/","by":"LMSYS"},{"t":"Building A Generative AI Platform","u":"https://huyenchip.com/2024/07/25/genai-platform.html","by":"Chip Huyen"}],"projects":[{"n":"Cost and cache dashboard","l":"Intermediate","d":"Log input, output and cache-read tokens per request, restructure prompts so stable parts come first, and compare cost and time to first token before and after over 500 requests."},{"n":"Router with fallback","l":"Advanced","d":"Route requests between a small and a large model with a simple classifier, escalating when the small model's output fails validation. Use your eval suite to compare quality and cost per 1,000 requests."}],"repos":[{"r":"BerriAI/litellm","d":"Proxy for many model providers with routing, fallbacks, budgets and caching"},{"r":"lm-sys/RouteLLM","d":"Trained routers between strong and weak models"},{"r":"anthropics/claude-cookbooks","d":"Notebooks on prompt caching and batch processing"}]}]},{"id":"agent_eng","title":"Agent engineering","level":"Intermediate \u2192 Advanced","intro":"Design, build, evaluate and secure agents that act in the real world.","phase":5,"optional":false,"topics":[{"id":"agents","title":"Agents: overview, tool calling & MCP basics","level":"Intermediate","why":"Models that plan, call tools, and act in loops.","lectures":[{"t":"CS329A: Self-Improving AI Agents (full course)","u":"https://www.youtube.com/playlist?list=PLangBM27OtEA","by":"Stanford Online"},{"t":"CS329Z: Engineering AI Agents (Autumn 2026, full course)","u":"https://www.youtube.com/playlist?list=PLPRcF5HR02_U","by":"Stanford Online"},{"t":"How We Build Effective Agents","u":"https://www.youtube.com/watch?v=D7_ipDqhtwk","by":"Barry Zhang, Anthropic"}],"papers":[{"t":"ReAct: Synergizing Reasoning and Acting","u":"https://arxiv.org/abs/2210.03629","by":"Yao et al."},{"t":"Toolformer","u":"https://arxiv.org/abs/2302.04761","by":"Schick et al."},{"t":"Generative Agents: Interactive Simulacra of Human Behavior","u":"https://arxiv.org/abs/2304.03442","by":"Park et al."},{"t":"SWE-bench","u":"https://arxiv.org/abs/2310.06770","by":"Jimenez et al."},{"t":"Tool use with Claude","u":"https://docs.claude.com/en/docs/agents-and-tools/tool-use/overview","by":"Anthropic docs"}],"reads":[{"t":"Building Effective Agents","u":"https://www.anthropic.com/research/building-effective-agents","by":"Anthropic"},{"t":"LLM Powered Autonomous Agents","u":"https://lilianweng.github.io/posts/2023-06-23-agent/","by":"Lilian Weng"},{"t":"Agents","u":"https://huyenchip.com/2025/01/07/agents.html","by":"Chip Huyen"},{"t":"Building effective agents","u":"https://www.anthropic.com/engineering/building-effective-agents","by":"Erik Schluntz & Barry Zhang, Anthropic"}],"mins":480,"pre":["prompt","rag","llmapi","apis","authz"],"ideas":["An agent is an LLM using tools in a loop until a task is done.","Start with simple workflows (chains, routing). Use agents only when the task truly needs them.","Tool descriptions are prompts. Write them carefully.","MCP standardizes how models connect to tools and data."],"callout":["Intuition","An agent is a model, a set of tools and a loop. Most of the work is in the tools and in the evals."],"projects":[{"n":"ReAct agent from scratch","l":"Intermediate","d":"Write an agent loop with a calculator and web-search tool, with no framework."},{"n":"Build an MCP server","l":"Intermediate","d":"Expose your own notes or a small API as an MCP server and use it from Claude."},{"n":"Support agent over your API","l":"Advanced","d":"Expose three tools from your service (search orders, get order, open refund request) and run a tool-calling loop with a step limit. Log every tool call and measure how many steps typical tasks take."}],"repos":[{"r":"anthropics/claude-cookbooks","d":"Recipes for tool use, agents and RAG"},{"r":"modelcontextprotocol/servers","d":"Reference MCP servers"},{"r":"SWE-bench/SWE-bench","d":"Benchmark for coding agents"},{"r":"modelcontextprotocol/python-sdk","d":"Official Python SDK for MCP servers and clients"}],"short":"Agents overview"},{"id":"ag_arch","title":"Agent architectures: workflows vs agents, ReAct, planning & routing","short":"Agent patterns","level":"Intermediate","why":"Most agent failures are architecture failures, so knowing when a fixed workflow beats an open-ended loop saves months of debugging.","mins":720,"pre":["agents","llmapi","prompt"],"ideas":["A workflow runs LLM calls along paths you wrote in code (chain, route, run in parallel, orchestrator-workers, evaluator-optimizer). An agent is an LLM in a loop that picks its own next tool call until it decides it is done. Workflows are cheaper and predictable; agents handle tasks whose steps you cannot list in advance.","ReAct interleaves a reasoning step, a tool call and the tool's observation, then repeats. Grounding each step in a real observation cuts hallucination compared with reasoning alone, and the trace doubles as a debugging log.","Routing sends each input to a specialised prompt, model or sub-workflow using a classifier or a cheap LLM call. It lets you use a small model for easy cases and a large one for hard ones, and it is one of the cheapest wins in production.","Planning asks the model to write a plan before acting, then executes it step by step and re-plans when an observation contradicts it. Reflection (as in Reflexion) adds a step where the agent critiques a failed attempt and keeps the critique in memory for the next try."],"callout":["Pitfall","Teams often start with a multi-step autonomous agent for a task that a three-step chain would solve. Start with the simplest workflow, measure, and add autonomy only where the evals show the fixed path is failing."],"lectures":[{"t":"How We Build Effective Agents","u":"https://www.youtube.com/watch?v=D7_ipDqhtwk","by":"Barry Zhang, Anthropic (AI Engineer)"},{"t":"LLM Agents: History & Overview (CS294-196)","u":"https://www.youtube.com/watch?v=RM6ZArd2nVc","by":"Shunyu Yao, UC Berkeley LLM Agents MOOC"},{"t":"What's next for AI agentic workflows","u":"https://www.youtube.com/watch?v=sal78ACtGTc","by":"Andrew Ng (Sequoia Capital)"}],"papers":[{"t":"Building effective agents","u":"https://www.anthropic.com/research/building-effective-agents","by":"Schluntz & Zhang, Anthropic"},{"t":"ReAct: Synergizing Reasoning and Acting in Language Models","u":"https://arxiv.org/abs/2210.03629","by":"Yao et al., 2022"},{"t":"Reflexion: Language Agents with Verbal Reinforcement Learning","u":"https://arxiv.org/abs/2303.11366","by":"Shinn et al., 2023"},{"t":"Workflows and agents (LangGraph docs)","u":"https://docs.langchain.com/oss/python/langgraph/workflows-agents","by":"LangChain"}],"reads":[{"t":"LLM Powered Autonomous Agents","u":"https://lilianweng.github.io/posts/2023-06-23-agent/","by":"Lilian Weng"},{"t":"Agents","u":"https://huyenchip.com/2025/01/07/agents.html","by":"Chip Huyen"},{"t":"I think \"agent\" may finally have a widely enough agreed upon definition","u":"https://simonwillison.net/2025/Sep/18/agents/","by":"Simon Willison"}],"projects":[{"n":"Helpdesk agent v0: chain vs loop","l":"Intermediate","d":"Start the course project: a support agent for a fake shop (SQLite orders, a markdown help centre). Build it first as a fixed chain (classify, retrieve, answer) and then as a raw ReAct loop over the same three tools with no framework, and compare success, steps, tokens and latency on 30 hand-written tickets."},{"n":"Router in front of two models","l":"Intermediate","d":"Add a routing step that sends easy tickets to a small model and hard ones to a large model or the full agent loop. Measure cost per ticket and accuracy against routing everything to the large model."}],"repos":[{"r":"anthropics/claude-cookbooks","d":"Reference code for every workflow pattern in Building effective agents"},{"r":"humanlayer/12-factor-agents","d":"Principles for production agents: own your prompts, context window and control flow"},{"r":"openai/openai-agents-python","d":"Small agent loop SDK with handoffs, guardrails and tracing"}]},{"id":"ag_tools","title":"Designing tools & function calling for agents","short":"Tool design","level":"Intermediate","why":"Tools are the agent's only interface to the world, and their names, schemas and outputs decide more of its success than the prompt does.","mins":720,"pre":["ag_arch","apis","validation","llmapi"],"ideas":["Function calling works by giving the model a name, a description and a JSON Schema per tool. The model emits a structured call, your code runs it, and the result goes back as a message. The model never executes anything itself, so validation and permissions live in your code.","Design tools around tasks the agent needs to finish, not around your REST endpoints. One schedule_event tool that checks availability and books beats list_users, list_events and create_event, because every extra call costs tokens and is another chance to go wrong.","Tool output is context the model must read. Return human-readable names over opaque ids, paginate and truncate large results, offer a concise vs detailed response mode, and write error messages that say how to fix the call.","Treat tool descriptions like docs for a new hire: say what the tool is for, when not to use it, and what each parameter means with examples. Then evaluate with real tasks and read the transcripts, since small wording changes move success rates a lot."],"callout":["Intuition","The SWE-agent authors call this the agent-computer interface. A file viewer that shows 100 lines with line numbers and a linter that rejects bad edits raised resolve rates well above a plain shell with the same model."],"lectures":[{"t":"Teaching LLMs to Use Tools at Scale (Stanford MLSys #98)","u":"https://www.youtube.com/watch?v=WAvO8FTDJ8M","by":"Shishir Patil"},{"t":"Tips for building AI agents","u":"https://www.youtube.com/watch?v=LP5OCa20Zpg","by":"Anthropic"}],"papers":[{"t":"Writing effective tools for agents, with agents","u":"https://www.anthropic.com/research/writing-tools-for-agents","by":"Anthropic Engineering"},{"t":"Tool use with Claude (docs)","u":"https://platform.claude.com/docs/en/agents-and-tools/tool-use/overview","by":"Anthropic"},{"t":"SWE-agent: Agent-Computer Interfaces Enable Automated Software Engineering","u":"https://arxiv.org/abs/2405.15793","by":"Yang et al., 2024"},{"t":"Toolformer: Language Models Can Teach Themselves to Use Tools","u":"https://arxiv.org/abs/2302.04761","by":"Schick et al., 2023"}],"reads":[{"t":"Introducing advanced tool use (tool search, programmatic tool calling, examples)","u":"https://www.anthropic.com/research/advanced-tool-use","by":"Anthropic Engineering"},{"t":"The \"think\" tool","u":"https://www.anthropic.com/research/claude-think-tool","by":"Anthropic Engineering"},{"t":"Berkeley Function Calling Leaderboard","u":"https://gorilla.cs.berkeley.edu/leaderboard.html","by":"Gorilla team, UC Berkeley"}],"projects":[{"n":"Helpdesk tools v1: CRUD vs task-shaped","l":"Intermediate","d":"Give the helpdesk agent thin CRUD wrappers (get_customer, list_orders, create_refund), then replace them with task-shaped tools (lookup_customer_context, issue_refund with dry_run) that return names, short summaries and fix-it errors. Compare task success, tool calls and tokens per task on 40 tickets."},{"n":"Tool description ablation","l":"Intermediate","d":"Run the same task set with full tool descriptions, one-line descriptions and misleading parameter names. Log wrong-tool and malformed-argument rates and keep the transcripts that explain each failure."}],"repos":[{"r":"ShishirPatil/gorilla","d":"Gorilla and the Berkeley Function Calling Leaderboard"},{"r":"pydantic/pydantic-ai","d":"Typed tool definitions and validation for Python agents"},{"r":"anthropics/claude-cookbooks","d":"Tool use notebooks: parallel calls, tool choice, structured output"}]},{"id":"ag_mcp","title":"MCP in depth: building servers & clients","short":"MCP servers","level":"Intermediate","why":"The Model Context Protocol is the common plug between agents and tools, so one server you write works in Claude, ChatGPT, IDEs and your own agents.","mins":840,"pre":["ag_tools","http","authn","realtime"],"ideas":["MCP has three roles. A host (Claude Desktop, an IDE, your app) runs one client per server, and each server exposes tools the model can call, resources the app can read and prompts the user can pick. Messages are JSON-RPC 2.0 over stdio for local servers or Streamable HTTP for remote ones.","The 2026-07-28 spec made the protocol stateless. There is no initialize handshake or session id; each request carries its protocol version and client capabilities, and a server that needs state across calls mints a handle and passes it as a normal tool argument. That lets remote servers scale behind an ordinary load balancer.","When a server needs more from the client mid-call (user input via elicitation, a model completion via sampling), it now returns an input_required result and the client retries the request with the answers. Long jobs use the tasks extension, where the client polls tasks/get.","Remote servers use OAuth 2.1. The server is a resource server that advertises its authorization server, the client registers and runs the auth code flow with PKCE, and tokens must be scoped to that server. Never forward a user's token on to other APIs."],"callout":["Pitfall","Wrapping every endpoint of an existing API as an MCP tool floods the context with dozens of near-identical definitions. Expose a few task-level tools, and for large tool sets consider tool search or letting the agent call servers from code."],"lectures":[{"t":"Building Agents with Model Context Protocol (full workshop)","u":"https://www.youtube.com/watch?v=kQmXtrmQ5Zg","by":"Mahesh Murag, Anthropic (AI Engineer)"},{"t":"The Future of MCP","u":"https://www.youtube.com/watch?v=v3Fr2JR47KA","by":"David Soria Parra, Anthropic (AI Engineer)"}],"papers":[{"t":"MCP specification (2026-07-28)","u":"https://modelcontextprotocol.io/specification/2026-07-28","by":"modelcontextprotocol.io"},{"t":"MCP architecture overview","u":"https://modelcontextprotocol.io/docs/learn/architecture","by":"modelcontextprotocol.io"},{"t":"MCP authorization","u":"https://modelcontextprotocol.io/specification/2026-07-28/basic/authorization","by":"modelcontextprotocol.io"}],"reads":[{"t":"Code execution with MCP: building more efficient agents","u":"https://www.anthropic.com/research/code-execution-with-mcp","by":"Anthropic Engineering"},{"t":"Model Context Protocol has prompt injection security problems","u":"https://simonwillison.net/2025/Apr/9/mcp-prompt-injection/","by":"Simon Willison"},{"t":"MCP Security Notification: Tool Poisoning Attacks","u":"https://invariantlabs.ai/blog/mcp-security-notification-tool-poisoning-attacks","by":"Invariant Labs"}],"projects":[{"n":"Helpdesk MCP server","l":"Intermediate","d":"Move the helpdesk tools into an MCP server with the official Python SDK or FastMCP: tools for lookups and refunds, resources for help-centre articles. Run it over stdio, then Streamable HTTP, inspect traffic with MCP Inspector and connect it to Claude Code and to your own agent."},{"n":"Minimal MCP host with OAuth","l":"Advanced","d":"Write a small host that discovers tools from two servers, maps them into LLM tool calls and handles input_required retries. Put the remote server behind OAuth with PKCE and test token expiry, wrong audience and a revoked token."}],"repos":[{"r":"modelcontextprotocol/python-sdk","d":"Official Python SDK for servers and clients"},{"r":"modelcontextprotocol/servers","d":"Reference servers (filesystem, git, fetch, memory) worth reading"},{"r":"modelcontextprotocol/inspector","d":"Visual tool for testing and debugging MCP servers"}]},{"id":"ag_context","title":"Context engineering & agent memory","short":"Context & memory","level":"Advanced","why":"An agent's context window is a small, expensive working memory, and deciding what goes into it each turn is now the core skill of agent building.","mins":780,"pre":["ag_arch","rag","costlat"],"ideas":["Models get worse as context grows (context rot): recall drops, distractors mislead, and facts in the middle get missed. Treat every token as having a cost and aim for the smallest set of high-signal tokens that lets the model take the next step.","Load context just in time. Keep light references (file paths, ids, queries) and let the agent fetch details with tools when needed, the way a person uses a file system instead of memorising it. Sub-agents can explore in their own context and return a short summary.","Long tasks need compaction and notes. Summarise old turns and drop stale tool results when the window fills, and have the agent write progress to a notes or todo file it can re-read after a reset. MemGPT frames this as paging between a small main context and large external memory.","Keep the prompt prefix stable and append only. Prompt caching makes reused prefixes far cheaper and faster, so timestamps at the top, reordered tool lists or edited history quietly multiply cost. Mask tools you want unavailable instead of removing their definitions."],"callout":["Pitfall","Long-term memory that stores everything becomes a second, noisier context. Decide what is worth remembering (user preferences, decisions, verified facts), add timestamps, and let the agent update or delete memories so old ones do not override new ones."],"lectures":[{"t":"Context Engineering for Agents","u":"https://www.youtube.com/watch?v=_IlTcWciEC4","by":"Lance Martin, LangChain (Latent Space)"},{"t":"Stateful Agents (full workshop)","u":"https://www.youtube.com/watch?v=E0k9Ppq6yXY","by":"Charles Packer, Letta (AI Engineer)"},{"t":"No Vibes Allowed: Solving Hard Problems in Complex Codebases","u":"https://www.youtube.com/watch?v=rmvDxxNubIg","by":"Dex Horthy, HumanLayer (AI Engineer)"}],"papers":[{"t":"Effective context engineering for AI agents","u":"https://www.anthropic.com/research/effective-context-engineering-for-ai-agents","by":"Anthropic Engineering"},{"t":"MemGPT: Towards LLMs as Operating Systems","u":"https://arxiv.org/abs/2310.08560","by":"Packer et al., 2023"},{"t":"Lost in the Middle: How Language Models Use Long Contexts","u":"https://arxiv.org/abs/2307.03172","by":"Liu et al., 2023"},{"t":"Generative Agents: Interactive Simulacra of Human Behavior","u":"https://arxiv.org/abs/2304.03442","by":"Park et al., 2023"}],"reads":[{"t":"Context Engineering for AI Agents: Lessons from Building Manus","u":"https://manus.im/blog/Context-Engineering-for-AI-Agents-Lessons-from-Building-Manus","by":"Yichao 'Peak' Ji, Manus"},{"t":"Context Rot: How Increasing Input Tokens Impacts LLM Performance","u":"https://www.trychroma.com/research/context-rot","by":"Chroma Research"},{"t":"How Long Contexts Fail","u":"https://www.dbreunig.com/2025/06/22/how-contexts-fail-and-how-to-fix-them.html","by":"Drew Breunig"}],"projects":[{"n":"Helpdesk memory and compaction","l":"Advanced","d":"Give the helpdesk agent per-customer memory (a notes store it reads and edits with tools) and automatic compaction of old turns. On 50-turn simulated sessions, compare success, tokens per turn and prompt cache hit rate with a naive full-history version."},{"n":"Context rot on your own data","l":"Intermediate","d":"Hide one key fact in growing amounts of realistic tool output (2k to 150k tokens) and at different positions. Plot answer accuracy by length and position for two models."}],"repos":[{"r":"letta-ai/letta","d":"Stateful agents with editable memory blocks, from the MemGPT authors"},{"r":"mem0ai/mem0","d":"Memory layer that extracts, updates and retrieves user facts"},{"r":"anthropics/claude-cookbooks","d":"Notebooks on prompt caching, compaction and the memory tool"}]},{"id":"ag_state","title":"State, orchestration & durable execution (LangGraph, Temporal), human-in-the-loop","short":"Durable agents","level":"Advanced","why":"Real agents run for minutes to days, call flaky APIs and wait for people, so they need persisted state, safe retries and pause-and-resume.","mins":900,"pre":["ag_arch","queues","txn","concur"],"ideas":["Model the agent as explicit state plus steps. LangGraph represents it as a graph whose nodes read and write a typed state object, and a checkpointer saves that state after every step to a thread id, so a crash or a deploy resumes from the last step instead of from scratch.","Durable execution engines like Temporal record every completed step in an event history. After a crash the workflow code is replayed against that history, so workflow code must be deterministic and all side effects (LLM calls, API calls) go in activities that are retried with backoff.","Human-in-the-loop is a pause in a durable workflow. The agent proposes an action, the run saves state and stops (LangGraph interrupt, a Temporal signal or update), and it resumes hours later with the human's approval, edit or rejection as input.","Retries mean side effects can run twice. Give every external write an idempotency key derived from the workflow and step id, and make tools check it, so a retried refund or email happens once."],"callout":["Pitfall","In LangGraph, resuming after interrupt() re-runs the whole node from the top. Any API call placed before the interrupt in the same node runs again, so put side effects in their own node or task."],"lectures":[{"t":"AI and the Mechanics of Durable Execution","u":"https://www.youtube.com/watch?v=89WOM-kV7Ws","by":"Temporal"},{"t":"LangGraph interrupt: making it easier to build human-in-the-loop agents","u":"https://www.youtube.com/watch?v=6t7YJcEFUIY","by":"LangChain"}],"papers":[{"t":"LangGraph persistence and durable execution","u":"https://docs.langchain.com/oss/python/langgraph/persistence","by":"LangChain docs"},{"t":"LangGraph interrupts","u":"https://docs.langchain.com/oss/python/langgraph/interrupts","by":"LangChain docs"},{"t":"Temporal Workflows","u":"https://docs.temporal.io/workflows","by":"Temporal docs"},{"t":"Introduction to LangGraph (free course)","u":"https://academy.langchain.com/courses/intro-to-langgraph","by":"LangChain Academy"}],"reads":[{"t":"Demystifying determinism in durable execution","u":"https://jack-vanlightly.com/blog/2025/11/24/demystifying-determinism-in-durable-execution","by":"Jack Vanlightly"},{"t":"Durable Execution meets AI: Why Temporal is ideal for AI agents","u":"https://temporal.io/blog/durable-execution-meets-ai-why-temporal-is-the-perfect-foundation-for-ai","by":"Temporal"},{"t":"What is durable execution?","u":"https://temporal.io/blog/what-is-durable-execution","by":"Temporal"}],"projects":[{"n":"Durable refund approvals","l":"Advanced","d":"Turn the helpdesk agent into a durable workflow: refunds over $100 pause for a human approve, edit or reject, and resume later. Kill the worker mid-run at random points and show that every run finishes with exactly one refund, using idempotency keys."},{"n":"Same agent, two engines","l":"Advanced","d":"Build the approval flow once with LangGraph (Postgres checkpointer plus interrupt) and once with Temporal (activities plus a signal). Compare lines of code, how you debug a stuck run, and behaviour when a tool fails five times in a row."}],"repos":[{"r":"langchain-ai/langgraph","d":"Graph-based agent runtime with checkpoints and interrupts"},{"r":"temporalio/sdk-python","d":"Temporal Python SDK for durable workflows and activities"},{"r":"temporalio/samples-python","d":"Samples including AI agent and OpenAI Agents SDK integrations"}]},{"id":"ag_multi","title":"Multi-agent systems: when they help and when they hurt","short":"Multi-agent","level":"Advanced","why":"Splitting work across agents can speed up broad tasks a lot, but it multiplies cost and creates new ways to fail, so you need to know which tasks fit.","mins":600,"pre":["ag_context","ag_state"],"ideas":["The pattern that works most often is orchestrator-workers. A lead agent splits a broad task, launches sub-agents in parallel with clear objectives, output formats and boundaries, and merges their condensed results. Anthropic's research system beat a single agent by 90% on its internal eval this way.","Multi-agent runs burn tokens: Anthropic reports about 15 times the tokens of a chat. In their analysis, token budget explained most of the performance gain, so the method pays off only for valuable tasks that split into independent parallel parts.","Agents that work on dependent pieces without shared context make conflicting choices. Cognition's rule is to share full traces, since every action carries implied decisions, and to keep writes in one agent while others only read or research.","Most multi-agent failures are system design problems: vague role specs, agents ignoring each other, lost information at handoffs, and no step that checks the final answer. Simple setups like one agent with sub-agent tool calls avoid many of these."],"callout":["Pitfall","Coding and other tightly coupled tasks usually get worse with parallel agents editing the same thing. Try a single agent with better context first, and add sub-agents for read-only exploration."],"lectures":[{"t":"Choosing the Right Multi-Agent Architecture","u":"https://www.youtube.com/watch?v=fqvbxkgU6vE","by":"LangChain"},{"t":"The Multi-Agent Architecture That Actually Ships","u":"https://www.youtube.com/watch?v=ow1we5PzK-o","by":"Luke Alvoeiro, Factory (AI Engineer)"}],"papers":[{"t":"How we built our multi-agent research system","u":"https://www.anthropic.com/research/multi-agent-research-system","by":"Anthropic Engineering"},{"t":"Why Do Multi-Agent LLM Systems Fail?","u":"https://arxiv.org/abs/2503.13657","by":"Cemri et al., 2025"},{"t":"Towards a Science of Scaling Agent Systems","u":"https://arxiv.org/abs/2512.08296","by":"Kim et al., 2025"},{"t":"AutoGen: Enabling Next-Gen LLM Applications via Multi-Agent Conversation","u":"https://arxiv.org/abs/2308.08155","by":"Wu et al., 2023"}],"reads":[{"t":"Don't Build Multi-Agents","u":"https://cognition.com/blog/dont-build-multi-agents","by":"Walden Yan, Cognition"},{"t":"How and when to build multi-agent systems","u":"https://www.langchain.com/blog/how-and-when-to-build-multi-agent-systems","by":"LangChain"},{"t":"Multi-agent orchestration (OpenAI Agents SDK)","u":"https://openai.github.io/openai-agents-python/multi_agent/","by":"OpenAI"}],"projects":[{"n":"Parallel account investigation","l":"Advanced","d":"Add an investigate mode to the helpdesk agent: a lead agent spawns read-only sub-agents for billing, logs and docs and writes one report. Compare it with a single agent given the same tools on 20 cases for accuracy, wall-clock time and total tokens."},{"n":"Failure taxonomy on your traces","l":"Intermediate","d":"Collect 50 failed multi-agent runs and label each with the failure categories from the MAST paper. Fix the most common one (often a weak sub-agent brief or a missing verifier) and re-run."}],"repos":[{"r":"langchain-ai/open_deep_research","d":"Open multi-agent deep research agent built on LangGraph"},{"r":"openai/openai-agents-python","d":"Handoffs and agents-as-tools patterns"},{"r":"microsoft/autogen","d":"Multi-agent conversation framework from Microsoft Research"}]},{"id":"ag_evals","title":"Evaluating agents: trajectories, task success & regression suites","short":"Agent evals","level":"Advanced","why":"Agents are non-deterministic and take many steps, so without task-level evals you cannot tell whether a prompt, tool or model change helped.","mins":900,"pre":["ag_arch","evals","testing"],"ideas":["Grade outcomes first. Check the end state of the environment (was the right refund written to the database, do the tests pass) with code, as SWE-bench and tau-bench do. Add trajectory checks (right tools, no forbidden actions, step count) only for behaviours you care about.","Run each task several times. pass@k asks whether any of k tries succeeded; pass^k asks whether all k did. In tau-bench, GPT-4o solved under half of retail tasks and fewer than a quarter on all 8 tries, and pass^k is closer to what users feel.","Start with error analysis. Read 50 to 100 real traces, write a note on the first thing that went wrong in each, group the notes into failure modes, and build automated checks for the frequent ones. LLM judges should be binary pass or fail for one failure mode, and validated against your own labels.","Keep two suites. Capability evals hold hard tasks you mostly fail and show progress; regression evals hold tasks you already pass and run in CI on every change. Report cost and latency next to accuracy, since a slightly better agent at ten times the cost is often worse."],"callout":["Pitfall","Benchmark scores leak and saturate. Public benchmarks tell you about the model; only a suite built from your own tasks, users and tools tells you about your agent."],"lectures":[{"t":"Building and evaluating AI Agents","u":"https://www.youtube.com/watch?v=d5EltXhbcfA","by":"Sayash Kapoor (AI Engineer)"},{"t":"How To Build AI Evals","u":"https://www.youtube.com/watch?v=mF4CaijvJos","by":"Hamel Husain"},{"t":"How to evaluate agent trajectories with AgentEvals","u":"https://www.youtube.com/watch?v=FCKjETgr54U","by":"LangChain"}],"papers":[{"t":"Demystifying evals for AI agents","u":"https://www.anthropic.com/research/demystifying-evals-for-ai-agents","by":"Anthropic Engineering"},{"t":"tau-bench: A Benchmark for Tool-Agent-User Interaction","u":"https://arxiv.org/abs/2406.12045","by":"Yao et al., Sierra, 2024"},{"t":"SWE-bench: Can Language Models Resolve Real-World GitHub Issues?","u":"https://arxiv.org/abs/2310.06770","by":"Jimenez et al., 2023"},{"t":"AI Agents That Matter","u":"https://arxiv.org/abs/2407.01502","by":"Kapoor et al., 2024"}],"reads":[{"t":"A Field Guide to Rapidly Improving AI Products","u":"https://hamel.dev/blog/posts/field-guide/","by":"Hamel Husain"},{"t":"LLM Evals: Everything You Need to Know (FAQ)","u":"https://hamel.dev/blog/posts/evals-faq/","by":"Hamel Husain & Shreya Shankar"},{"t":"An LLM-as-Judge Won't Save The Product, Fixing Your Process Will","u":"https://eugeneyan.com/writing/eval-process","by":"Eugene Yan"}],"projects":[{"n":"Helpdesk regression suite","l":"Advanced","d":"Write 50 tau-bench-style tasks for the helpdesk agent: a simulated customer, a policy and an expected database end state. Report pass^1 and pass^4, cost and latency per task, and make the suite a CI gate that blocks merges on regressions."},{"n":"Error analysis and a validated judge","l":"Intermediate","d":"Label the first failure in 100 production-like traces, group them into failure modes and build an LLM judge for the most common one. Measure the judge's true positive and true negative rates against your labels on a held-out set."}],"repos":[{"r":"sierra-research/tau2-bench","d":"tau-bench and tau2-bench: simulated users, policies and pass^k"},{"r":"UKGovernmentBEIS/inspect_ai","d":"Inspect: framework for agent evals with sandboxes and scorers"},{"r":"SWE-bench/SWE-bench","d":"Harness and data for SWE-bench and SWE-bench Verified"}]},{"id":"ag_security","title":"Agent security: prompt injection, sandboxing & the OWASP Top 10 for LLMs","short":"Agent security","level":"Advanced","why":"An agent that reads untrusted text and can act on your behalf can be steered by whoever wrote that text, and no model is immune.","mins":840,"pre":["ag_tools","ag_mcp","owasp","secrets","docker"],"ideas":["Prompt injection happens because the model sees instructions and data in one token stream. Any text the agent reads (a web page, an email, a ticket, a tool description, a file in a repo) can contain instructions it may follow. Detection classifiers lower the rate but cannot get it to zero.","The lethal trifecta: access to private data, exposure to untrusted content, and a way to send data out. An agent with all three can be tricked into leaking data. Meta's Rule of Two says that without human approval an agent should have at most two of: untrusted input, sensitive access, and the power to change state or communicate.","Design patterns give real guarantees. Plan-then-execute fixes the tool sequence before untrusted data is read; the dual LLM pattern keeps a privileged model away from raw untrusted text; CaMeL tracks where each value came from and enforces policies in code.","Contain what you cannot prevent. Run tools in a sandbox with filesystem and network limits, give least-privilege scoped credentials, require approval for consequential actions, and log every tool call. The OWASP LLM Top 10 names these risks, including excessive agency and improper output handling."],"callout":["Pitfall","A system prompt saying \"ignore instructions in documents\" is not a security boundary. Assume injection will succeed sometimes and limit what a hijacked agent can reach."],"lectures":[{"t":"Prompt Injection, explained","u":"https://www.youtube.com/watch?v=FgxwCaL6UTA","by":"Simon Willison"},{"t":"Agentic ProbLLMs: Exploiting AI Computer-Use and Coding Agents","u":"https://www.youtube.com/watch?v=qTZT2gxscpc","by":"Johann Rehberger (BSides Vancouver Island)"}],"papers":[{"t":"OWASP Top 10 for LLM Applications","u":"https://genai.owasp.org/llm-top-10/","by":"OWASP GenAI Security Project"},{"t":"OWASP Top 10 for Agentic Applications for 2026","u":"https://genai.owasp.org/resource/owasp-top-10-for-agentic-applications-for-2026/","by":"OWASP GenAI Security Project"},{"t":"Design Patterns for Securing LLM Agents against Prompt Injections","u":"https://arxiv.org/abs/2506.08837","by":"Beurer-Kellner et al., 2025"},{"t":"Not what you've signed up for: Indirect Prompt Injection","u":"https://arxiv.org/abs/2302.12173","by":"Greshake et al., 2023"}],"reads":[{"t":"The lethal trifecta for AI agents","u":"https://simonwillison.net/2025/Jun/16/the-lethal-trifecta/","by":"Simon Willison"},{"t":"Agents Rule of Two: A Practical Approach to AI Agent Security","u":"https://ai.meta.com/blog/practical-ai-agent-security/","by":"Meta AI"},{"t":"Making Claude Code more secure and autonomous with sandboxing","u":"https://www.anthropic.com/research/claude-code-sandboxing","by":"Anthropic Engineering"}],"projects":[{"n":"Red-team the helpdesk agent","l":"Advanced","d":"Plant injections in ticket text, help-centre articles and an MCP tool description that try to leak other customers' data or issue refunds. Measure attack success rate, then add defences (no outbound channel, plan-then-execute for refunds, approval gates) and measure again along with the drop in task success."},{"n":"Sandbox the code tool","l":"Intermediate","d":"Give the agent a run_python tool inside a container or microVM with no network, a read-only filesystem except /tmp, and CPU and time limits. Try to esca
