name: Daily drop

on:
  schedule:
    - cron: "10 1 * * *"   # 06:40 IST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/update_daily.py
      - name: Commit if changed
        run: |
          git config user.name "atlas-bot"
          git config user.email "atlas-bot@users.noreply.github.com"
          git add daily.json
          git diff --cached --quiet || (git commit -m "Daily drop $(date -u +%F)" && git push)
